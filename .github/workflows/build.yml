      - name: Write adblock_css.css
        run: |
          cat > Resources/adblock_css.css <<'EOF'
          iframe[src*="doubleclick.net"],iframe[src*="googlesyndication"],ins.adsbygoogle,[id^="div-gpt-ad"],#onetrust-banner-sdk,.cookie-banner-component,.cookie-consent{display:none!important;}
          EOF

      - name: Show file tree
        run: find Sources Resources -type f | sort

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          set -eo pipefail
          xcodebuild -project ChessHelper.xcodeproj -scheme ChessHelper \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" ONLY_ACTIVE_ARCH=NO ARCHS=arm64 build

      - name: Package .ipa
        run: |
          set -eo pipefail
          APP="$(find build/Build/Products -type d -name 'ChessHelper.app' | head -n 1)"
          [ -n "$APP" ] || { echo "Not found"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr ChessHelper-v5.3-Phase5.ipa Payload
          ls -lh ChessHelper-v5.3-Phase5.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-v5.3-Phase5
          path: ChessHelper-v5.3-Phase5.ipa
          retention-days: 90

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChessHelper-v5.3-Phase5.ipa
          generate_release_notes: true
