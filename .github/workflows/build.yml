                  return book[key]
              }
              
              // IMPROVED: match on board + side only (ignore castling/en passant)
              // so the opening name is recognized through transpositions all game.
              private func normalizeFen(_ fen: String) -> String {
                  let parts = fen.split(separator: " ").map(String.init)
