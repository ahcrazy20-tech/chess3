          import Foundation
          import SwiftUI
          @MainActor
          final class GameRecorder: ObservableObject {
              struct MoveRecord: Identifiable, Codable {
                  let id: UUID
                  let ply: Int
                  let uci: String
                  let san: String
                  let fenBefore: String
                  let fenAfter: String
                  let evalBefore: Int?
                  let evalAfter: Int?
                  let wasMyMove: Bool
                  let quality: String
                  let bestAlternative: String?
                  let cpLoss: Int
                  let timestamp: Date
              }
              @Published var moves: [MoveRecord] = []
              @Published var gameId: UUID = UUID()
              @Published var currentAccuracy: Double = 100.0
              @Published var myMoveCount: Int = 0
              @Published var brilliantCount: Int = 0
              @Published var bestCount: Int = 0
              @Published var goodCount: Int = 0
              @Published var inaccuracyCount: Int = 0
              @Published var mistakeCount: Int = 0
              @Published var blunderCount: Int = 0
              private var lastFenBefore: String = ""
              private var lastEvalBefore: Int? = nil
              func recordMove(previousFen: String, previousEval: Int?, currentFen: String, currentEval: Int?, lastMoveUCI: String, wasMyMove: Bool, bestMoveUCI: String?, plyCount: Int) {
                  guard !lastMoveUCI.isEmpty else { return }
                  var cpLoss = 0
                  if let prev = previousEval, let curr = currentEval {
                      let sideMul = wasMyMove ? 1 : -1
                      cpLoss = max(0, (prev - curr) * sideMul)
                  }
                  let quality: String
                  switch cpLoss {
                  case ..<(-30): quality = "brilliant"
                  case (-30)...15: quality = "best"
                  case 16...49: quality = "good"
                  case 50...99: quality = "inaccuracy"
                  case 100...299: quality = "mistake"
                  default: quality = "blunder"
                  }
                  let isBest = (bestMoveUCI == lastMoveUCI)
                  let finalQuality = isBest ? "best" : quality
                  let record = MoveRecord(
                      id: UUID(), ply: plyCount, uci: lastMoveUCI, san: lastMoveUCI,
                      fenBefore: previousFen, fenAfter: currentFen,
                      evalBefore: previousEval, evalAfter: currentEval,
                      wasMyMove: wasMyMove, quality: finalQuality,
                      bestAlternative: (isBest ? nil : bestMoveUCI),
                      cpLoss: cpLoss, timestamp: Date()
                  )
                  moves.append(record)
                  if wasMyMove {
                      myMoveCount += 1
                      switch finalQuality {
                      case "brilliant": brilliantCount += 1
                      case "best": bestCount += 1
                      case "good": goodCount += 1
                      case "inaccuracy": inaccuracyCount += 1
                      case "mistake": mistakeCount += 1
                      case "blunder": blunderCount += 1
                      default: break
                      }
                      recomputeAccuracy()
                  }
              }
              func startNewGame() {
                  moves = []
                  gameId = UUID()
                  currentAccuracy = 100.0
                  myMoveCount = 0
                  brilliantCount = 0; bestCount = 0; goodCount = 0
                  inaccuracyCount = 0; mistakeCount = 0; blunderCount = 0
              }
              private func recomputeAccuracy() {
                  guard myMoveCount > 0 else { currentAccuracy = 100.0; return }
                  let total = brilliantCount * 100 + bestCount * 100 + goodCount * 90
                             + inaccuracyCount * 70 + mistakeCount * 40 + blunderCount * 10
                  currentAccuracy = Double(total) / Double(myMoveCount)
              }
              private let storeKey = "chess_helper_game_history"
              func saveCurrentGame() {
                  guard !moves.isEmpty else { return }
                  var history = loadHistory()
                  let entry = GameHistoryEntry(id: gameId, date: Date(), moves: moves, accuracy: currentAccuracy)
                  history.insert(entry, at: 0)
                  if history.count > 20 { history = Array(history.prefix(20)) }
                  if let data = try? JSONEncoder().encode(history) {
                      UserDefaults.standard.set(data, forKey: storeKey)
                  }
              }
              func loadHistory() -> [GameHistoryEntry] {
                  guard let data = UserDefaults.standard.data(forKey: storeKey),
                        let history = try? JSONDecoder().decode([GameHistoryEntry].self, from: data) else {
                      return []
                  }
                  return history
              }
              func clearHistory() {
                  UserDefaults.standard.removeObject(forKey: storeKey)
              }
          }
          struct GameHistoryEntry: Identifiable, Codable {
              let id: UUID
              let date: Date
              let moves: [GameRecorder.MoveRecord]
              let accuracy: Double
          }
