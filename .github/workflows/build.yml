name: Build ChessHelper v2

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Clean & prepare
        run: |
          rm -rf Sources Resources ChessHelper.xcodeproj build Payload
          rm -f chess-helper.manifest.json
          mkdir -p Sources Resources

      - name: Write project.yml
        run: |
          cat > project.yml <<'EOF'
          name: ChessHelper
          options:
            bundleIdPrefix: com.chesshelper
            deploymentTarget: { iOS: "16.0" }
            createIntermediateGroups: true
          settings:
            base:
              MARKETING_VERSION: "2.0.0"
              CURRENT_PROJECT_VERSION: "20"
              SWIFT_VERSION: "5.9"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              TARGETED_DEVICE_FAMILY: "1,2"
          targets:
            ChessHelper:
              type: application
              platform: iOS
              sources: [ { path: Sources }, { path: Resources } ]
              info:
                path: Resources/Info.plist
                properties:
                  CFBundleDisplayName: Chess Helper
                  CFBundleShortVersionString: $(MARKETING_VERSION)
                  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.chesshelper.app
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  PROVISIONING_PROFILE_SPECIFIER: ""
          EOF

      - name: Generate all source files
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, textwrap
          files = {}

          files["Sources/ChessHelperApp.swift"] = r'''
          import SwiftUI
          @main
          struct ChessHelperApp: App {
              var body: some Scene {
                  WindowGroup { ContentView().preferredColorScheme(.dark) }
              }
          }
          '''

          files["Sources/AppRouter.swift"] = r'''
          import SwiftUI
          @MainActor
          final class AppRouter: ObservableObject {
              @Published var selectedTab: Int = 0
              @Published var chessURL: URL = URL(string: "https://www.chess.com/")!
              @Published var navigateTrigger: Int = 0
              func openInPlay(_ s: String) {
                  if let u = URL(string: s) { chessURL = u; navigateTrigger &+= 1; selectedTab = 0 }
              }
          }
          '''

          files["Sources/ContentView.swift"] = r'''
          import SwiftUI
          struct ContentView: View {
              @StateObject private var engine  = EngineViewModel()
              @StateObject private var stealth = StealthManager()
              @StateObject private var router  = AppRouter()
              var body: some View {
                  TabView(selection: $router.selectedTab) {
                      PlayView(engine: engine, stealth: stealth, router: router)
                          .tabItem { Label("Play", systemImage: "gamecontroller.fill") }.tag(0)
                      SimpleTabView(title: "Review", icon: "magnifyingglass")
                          .tabItem { Label("Review", systemImage: "magnifyingglass") }.tag(1)
                      SimpleTabView(title: "Openings", icon: "book.fill")
                          .tabItem { Label("Openings", systemImage: "book.fill") }.tag(2)
                      SimpleTabView(title: "Puzzles", icon: "puzzlepiece.fill")
                          .tabItem { Label("Puzzles", systemImage: "puzzlepiece.fill") }.tag(3)
                      SimpleTabView(title: "Stats", icon: "chart.bar.fill")
                          .tabItem { Label("Stats", systemImage: "chart.bar.fill") }.tag(4)
