      - name: Generate Swift files (Part 4 - Engine Service + SAN)
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, textwrap
          files = {}

          # ========== NEW: Standard Algebraic Notation generator ==========
          files["Sources/SanGenerator.swift"] = r'''
          import Foundation

          /// Generates Standard Algebraic Notation from a UCI move + FEN.
          /// ADDITIVE feature (does not modify existing code).
          /// Handles: piece letters, captures, castle, pawn pushes, promotion,
          /// disambiguation, and basic check/checkmate detection.
          enum SanGenerator {

              static func generate(uci: String, fen: String) -> String {
                  guard uci.count >= 4,
                        let grid = MoveValidator.parseFen(fen) else { return uci }
                  let parts = fen.split(separator: " ").map(String.init)
                  guard parts.count >= 2 else { return uci }
                  guard let from = MoveValidator.squareToCoord(String(uci.prefix(2))),
                        let to = MoveValidator.squareToCoord(String(uci.dropFirst(2).prefix(2))) else { return uci }
                  let piece = grid[from.row][from.col]
                  guard piece != "." else { return uci }

                  let promoteChar = uci.count >= 5 ? uci.suffix(1).uppercased() : ""
                  let dest = String(uci.dropFirst(2).prefix(2))
                  let isCapture = grid[to.row][to.col] != "."
                  let isWhite = piece.isUppercase
                  let low = piece.lowercased()

                  // Castle
                  if low == "k" && abs(to.col - from.col) == 2 {
                      var san = to.col < from.col ? "O-O-O" : "O-O"
                      san += checkSuffix(grid: grid, from: from, to: to, piece: piece, promoteChar: "", isWhite: isWhite)
                      return san
                  }

                  var san = ""
                  if low == "p" {
                      if isCapture { san += String(UnicodeScalar(97 + from.col)!) + "x" }
                      san += dest
                      if !promoteChar.isEmpty { san += "=" + promoteChar }
                  } else {
                      san += piece.uppercased()
                      san += disambiguation(piece: piece, from: from, to: to, grid: grid)
                      if isCapture { san += "x" }
                      san += dest
                  }

                  san += checkSuffix(grid: grid, from: from, to: to, piece: piece, promoteChar: promoteChar, isWhite: isWhite)
                  return san
              }

              private static func disambiguation(piece: Character, from: (row: Int, col: Int), to: (row: Int, col: Int), grid: [[Character]]) -> String {
                  var sameFile = false, sameRank = false
                  var rivals = 0
                  for r in 0..<8 {
                      for c in 0..<8 {
                          if (r == from.row && c == from.col) { continue }
                          if grid[r][c] != piece { continue }
                          if canReach(piece: piece, from: (r, c), to: to, grid: grid) {
                              rivals += 1
                              if c == to.col { sameFile = true }
                              if r == to.row { sameRank = true }
                          }
                      }
                  }
                  guard rivals > 0 else { return "" }
                  if !sameFile { return String(UnicodeScalar(97 + from.col)!) }
                  if !sameRank { return String(8 - from.row) }
                  return String(UnicodeScalar(97 + from.col)!) + String(8 - from.row)
              }

              private static func canReach(piece: Character, from: (row: Int, col: Int), to: (row: Int, col: Int), grid: [[Character]]) -> Bool {
                  let dr = to.row - from.row, dc = to.col - from.col
                  let adr = abs(dr), adc = abs(dc)
                  switch piece.lowercased() {
                  case "n": return (adr == 2 && adc == 1) || (adr == 1 && adc == 2)
                  case "b": return adr == adc
                  case "r": return dr == 0 || dc == 0
                  case "q": return adr == adc || dr == 0 || dc == 0
                  case "k": return max(adr, adc) == 1
                  case "p":
                      let dir = piece.isUppercase ? -1 : 1
                      return (dr == dir && adc == 1) || (dr == dir && adc == 0)
                  default: return false
                  }
              }

              private static func checkSuffix(grid: [[Character]], from: (row: Int, col: Int), to: (row: Int, col: Int), piece: Character, promoteChar: String, isWhite: Bool) -> String {
                  guard let ng = applyMove(grid: grid, from: from, to: to, piece: piece, promoteChar: promoteChar) else { return "" }
                  let enemyKing: Character = isWhite ? "k" : "K"
                  guard let kp = findPiece(ng, enemyKing) else { return "" }
                  if !isAttacked(grid: ng, r: kp.row, c: kp.col, byWhite: !isWhite) { return "" }
                  if kingHasNoLegalEscape(ng, king: enemyKing, at: kp, attackerWhite: !isWhite) {
                      return "#"
                  }
                  return "+"
              }

              private static func applyMove(grid: [[Character]], from: (row: Int, col: Int), to: (row: Int, col: Int), piece: Character, promoteChar: String) -> [[Character]]? {
                  var ng = grid
                  var moved = piece
                  if piece.lowercased() == "p" && !promoteChar.isEmpty {
                      moved = Character(promoteChar)
                      if !piece.isUppercase { moved = Character(promoteChar.lowercased()) }
                  }
                  ng[from.row][from.col] = "."
                  ng[to.row][to.col] = moved
                  return ng
              }

              private static func findPiece(_ grid: [[Character]], _ p: Character) -> (row: Int, col: Int)? {
                  for r in 0..<8 { for c in 0..<8 { if grid[r][c] == p { return (r, c) } } }
                  return nil
              }

              private static func isAttacked(grid: [[Character]], r: Int, c: Int, byWhite: Bool) -> Bool {
                  let target: Character = byWhite ? "K" : "k"
                  for rr in 0..<8 { for cc in 0..<8 {
                      let p = grid[rr][cc]
                      if p == "." { continue }
                      if (byWhite && !p.isUppercase) { continue }
                      if (!byWhite && p.isUppercase) { continue }
                      if p.lowercased() == "k" && p == target { continue }
                      if canReach(piece: p, from: (rr, cc), to: (r, c), grid: grid) { return true }
                      if p.lowercased() == "p" {
                          let dir = byWhite ? -1 : 1
                          if (rr + dir == r) && abs(cc - c) == 1 { return true }
                      }
                  }}
                  return false
              }

              private static func kingHasNoLegalEscape(_ grid: [[Character]], king: Character, at kp: (row: Int, col: Int), attackerWhite: Bool) -> Bool {
                  let enemyWhite = !attackerWhite
                  for dr in -1...1 { for dc in -1...1 {
                      if dr == 0 && dc == 0 { continue }
                      let r = kp.row + dr, c = kp.col + dc
                      if r < 0 || r > 7 || c < 0 || c > 7 { continue }
                      let occ = grid[r][c]
                      if occ != "." {
                          let occWhite = occ.isUppercase
                          if occWhite == enemyWhite { continue }
                          if !isAttacked(grid: grid, r: r, c: c, byWhite: attackerWhite) { return false }
                          continue
                      }
                      if !isAttacked(grid: grid, r: r, c: c, byWhite: attackerWhite) { return false }
                  }}
                  return true
              }
          }
          '''

          # ========== Main Engine Service - Combines all sources ==========
          files["Sources/EngineService.swift"] = r'''
          import Foundation

          struct TopMove: Identifiable, Equatable {
              let id = UUID()
              let rank: Int
              let uci: String
              let san: String
              let evaluationCp: Int?
              let mateIn: Int?
              let depth: Int
              let source: String
              let votes: Int
              
              var evalString: String {
                  if let m = mateIn, m != 0 { return "M\(abs(m))" }
                  if let cp = evaluationCp { return String(format: "%+.2f", Double(cp)/100.0) }
                  return "—"
              }
              var winChance: Double {
                  if let m = mateIn, m != 0 { return m > 0 ? 99 : 1 }
                  guard let cp = evaluationCp else { return 50 }
                  return 50 + 50 * tanh(Double(cp)/400.0)
              }
              var rankScore: Double {
                  if let m = mateIn, m != 0 { return m > 0 ? 100000 - Double(m) : -100000 - Double(m) }
                  return Double(evaluationCp ?? 0)
              }
          }

          struct EngineAnalysis {
              let topMoves: [TopMove]
              let bestMove: TopMove?
              let depth: Int
              let sourcesUsed: String
              let confidence: Int
              let debugFen: String
              let openingName: String?
              let openingECO: String?
              let tablebaseResult: TablebaseResult?
              let isMatchMode: Bool
          }

          enum EngineError: Error, LocalizedError {
              case badFen(String), networkOffline, allEnginesFailed, cancelled
              var errorDescription: String? {
                  switch self {
                  case .badFen(let m): return "Bad FEN: \(m)"
                  case .networkOffline: return "No internet"
                  case .allEnginesFailed: return "All engines offline"
                  case .cancelled: return "Cancelled"
                  }
              }
          }

          enum EngineService {
              // MARK: - Opening Book (INSTANT - 0ms)
              static func checkOpeningBook(fen: String) async -> (info: OpeningInfo?, moves: [String]) {
                  await OpeningBook.shared.load()
                  if let info = await OpeningBook.shared.lookup(fen: fen) {
                      return (info, info.moves)
                  }
                  return (nil, [])
              }
              
              // MARK: - Tablebase (for endgames ≤7 pieces)
              static func checkTablebase(fen: String) async -> TablebaseResult? {
                  return await TablebaseService.shared.probe(fen: fen)
              }
              
              // MARK: - Cloud APIs
              static func callLichessCloud(fen: String, multiPv: Int = 3) async -> [TopMove]? {
                  var comps = URLComponents(string: "https://lichess.org/api/cloud-eval")!
                  comps.queryItems = [URLQueryItem(name: "fen", value: fen), URLQueryItem(name: "multiPv", value: "\(multiPv)")]
                  guard let url = comps.url else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 5
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  do {
                      let (data, resp) = try await URLSession.shared.data(for: req)
                      guard let http = resp as? HTTPURLResponse else { return nil }
                      if http.statusCode == 404 { return [] }   // no cached eval -> NOT failure
                      guard http.statusCode == 200 else { return nil }
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      let depth = (json["depth"] as? Int) ?? 20
                      guard let pvs = json["pvs"] as? [[String: Any]] else { return [] }
                      var moves: [TopMove] = []
                      for (idx, pv) in pvs.prefix(multiPv).enumerated() {
                          let ms = (pv["moves"] as? String) ?? ""
                          let fm = String(ms.split(separator: " ").first ?? "")
                          guard !fm.isEmpty, MoveValidator.isPlausibleMove(uci: fm, fen: fen) else { continue }
                          let cp = pv["cp"] as? Int; let mate = pv["mate"] as? Int
                          let san = SanGenerator.generate(uci: fm, fen: fen)
                          moves.append(TopMove(rank: idx + 1, uci: fm, san: san, evaluationCp: cp, mateIn: (mate == 0 ? nil : mate), depth: depth, source: "LC", votes: 1))
                      }
                      return moves
                  } catch { return nil }
              }
              
              static func callChessApi(fen: String, depth: Int = 15) async -> TopMove? {
                  guard let url = URL(string: "https://chess-api.com/v1") else { return nil }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  req.timeoutInterval = 8
                  let body: [String: Any] = ["fen": fen, "depth": depth, "maxThinkingTime": 500]
                  guard let hb = try? JSONSerialization.data(withJSONObject: body) else { return nil }
                  req.httpBody = hb
                  do {
                      let (data, _) = try await URLSession.shared.data(for: req)
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      let uci = (json["move"] as? String) ?? ""
                      guard !uci.isEmpty, MoveValidator.isPlausibleMove(uci: uci, fen: fen) else { return nil }
                      let san = (json["san"] as? String) ?? SanGenerator.generate(uci: uci, fen: fen)
                      let eval = json["eval"] as? Double; let mate = json["mate"] as? Int
                      let cp = eval.map { Int(($0 * 100).rounded()) }; let d = (json["depth"] as? Int) ?? depth
                      return TopMove(rank: 1, uci: uci, san: san, evaluationCp: cp, mateIn: (mate == 0 ? nil : mate), depth: d, source: "CA", votes: 1)
                  } catch { return nil }
              }
              
              static func callStockfishOnline(fen: String, depth: Int = 15) async -> TopMove? {
                  var comps = URLComponents(string: "https://stockfish.online/api/s/v2.php")!
                  comps.queryItems = [URLQueryItem(name: "fen", value: fen), URLQueryItem(name: "depth", value: "\(depth)")]
                  guard let url = comps.url else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 8
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  do {
                      let (data, _) = try await URLSession.shared.data(for: req)
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      if let s = json["success"] as? Bool, !s { return nil }
                      let bf = (json["bestmove"] as? String) ?? ""
                      let parts = bf.split(separator: " ").map(String.init)
                      var uci = ""
                      for (i, p) in parts.enumerated() where p == "bestmove" && i+1 < parts.count { uci = parts[i+1]; break }
                      if uci.isEmpty { uci = parts.first ?? "" }
                      guard !uci.isEmpty, MoveValidator.isPlausibleMove(uci: uci, fen: fen) else { return nil }
                      let ev = json["evaluation"] as? Double; let mate = json["mate"] as? Int
                      let cp = ev.map { Int(($0 * 100).rounded()) }; let d = (json["depth"] as? Int) ?? depth
                      let san = SanGenerator.generate(uci: uci, fen: fen)
                      return TopMove(rank: 1, uci: uci, san: san, evaluationCp: cp, mateIn: (mate == 0 ? nil : mate), depth: d, source: "SF", votes: 1)
                  } catch { return nil }
              }
              
              // MARK: - Local engine fallback (works offline)
              static func callLocalEngine(fen: String, depth: Int) async -> TopMove? {
                  await withCheckedContinuation { cont in
                      Task { @MainActor in
                          guard LocalEngine.shared.isReady else { cont.resume(returning: nil); return }
                          LocalEngine.shared.analyze(fen: fen, depth: min(depth, 18), multiPV: 1) { r in
                              let best = r.bestMove
                              guard !best.isEmpty, MoveValidator.isPlausibleMove(uci: best, fen: fen) else {
                                  cont.resume(returning: nil); return
                              }
                              let san = SanGenerator.generate(uci: best, fen: fen)
                              cont.resume(returning: TopMove(rank: 1, uci: best, san: san, evaluationCp: r.evaluation, mateIn: r.mateIn, depth: r.depth, source: "🧠", votes: 1))
                          }
                      }
                  }
              }
              
              // MARK: - Main Analysis Function
              static func analyzePosition(fen: String, isMatchMode: Bool = false, onUpdate: @escaping @MainActor (EngineAnalysis) -> Void) async throws -> EngineAnalysis {
                  if let issue = FenValidator.validate(fen) { throw EngineError.badFen(issue) }
                  
                  let settings = await MainActor.run { AppSettings.shared }
                  let depth = await MainActor.run { isMatchMode ? 25 : settings.analysisDepth }
                  let multiPV = await MainActor.run { isMatchMode ? 5 : settings.multiPV }
                  
                  // 1. Check Opening Book FIRST (instant!)
                  let (openingInfo, bookMoves) = await checkOpeningBook(fen: fen)
                  if let opening = openingInfo, !bookMoves.isEmpty {
                      let moves = bookMoves.prefix(multiPV).enumerated().map { idx, move in
                          let san = SanGenerator.generate(uci: move, fen: fen)
                          return TopMove(rank: idx + 1, uci: move, san: san, evaluationCp: 0, mateIn: nil, depth: 99, source: "📖", votes: 3)
                      }
                      let a = EngineAnalysis(topMoves: Array(moves), bestMove: moves.first, depth: 99, sourcesUsed: "📖 Opening Book", confidence: 3, debugFen: fen, openingName: opening.name, openingECO: opening.eco, tablebaseResult: nil, isMatchMode: isMatchMode)
                      await MainActor.run { onUpdate(a) }
                      return a
                  }
                  
                  // 2. Check Tablebase for endgames
                  let pieceCount = FenValidator.countPieces(fen)
                  if pieceCount <= 7 {
                      if let tb = await checkTablebase(fen: fen), let bestMove = tb.bestMove {
                          let evalCp: Int
                          let mate: Int?
                          switch tb.category {
                          case .win: evalCp = 10000; mate = tb.dtm
                          case .loss: evalCp = -10000; mate = tb.dtm.map { -$0 }
                          case .draw, .unknown: evalCp = 0; mate = nil
                          }
                          
                          var tbMoves: [TopMove] = []
                          for (idx, m) in tb.allMoves.prefix(multiPV).enumerated() {
                              let mEval: Int
                              switch m.category {
                              case .win: mEval = 10000 - (m.dtz ?? 0)
                              case .loss: mEval = -10000 + (m.dtz ?? 0)
                              case .draw, .unknown: mEval = 0
                              }
                              let san = SanGenerator.generate(uci: m.uci, fen: fen)
                              tbMoves.append(TopMove(rank: idx + 1, uci: m.uci, san: san, evaluationCp: mEval, mateIn: m.category == .win ? (m.dtz ?? 0) / 2 : nil, depth: 99, source: "🏁", votes: 3))
                          }
                          
                          if tbMoves.isEmpty {
                              let san = SanGenerator.generate(uci: bestMove, fen: fen)
                              tbMoves = [TopMove(rank: 1, uci: bestMove, san: san, evaluationCp: evalCp, mateIn: mate, depth: 99, source: "🏁", votes: 3)]
                          }
                          
                          let a = EngineAnalysis(topMoves: tbMoves, bestMove: tbMoves.first, depth: 99, sourcesUsed: "🏁 Tablebase", confidence: 3, debugFen: fen, openingName: nil, openingECO: nil, tablebaseResult: tb, isMatchMode: isMatchMode)
                          await MainActor.run { onUpdate(a) }
                          return a
                      }
                  }
                  
                  // 3. Check Cache
                  if !isMatchMode, let cached = await AnalysisCache.shared.get(fen: fen) {
                      let moves = cached.moves.enumerated().map { (i, m) in
                          TopMove(rank: i + 1, uci: m.uci, san: m.san, evaluationCp: m.evaluationCp, mateIn: m.mateIn, depth: m.depth, source: "💾", votes: m.votes)
                      }
                      let a = EngineAnalysis(topMoves: moves, bestMove: moves.first, depth: cached.depth, sourcesUsed: "💾 Cache", confidence: cached.confidence, debugFen: fen, openingName: nil, openingECO: nil, tablebaseResult: nil, isMatchMode: false)
                      await MainActor.run { onUpdate(a) }
                      return a
                  }
                  
                  // 4. Call all cloud engines in parallel
                  async let lichessResult = callLichessCloud(fen: fen, multiPv: multiPV)
                  async let chessApiResult = callChessApi(fen: fen, depth: depth)
                  async let stockfishResult = callStockfishOnline(fen: fen, depth: depth)
                  
                  let lichess = await lichessResult
                  try Task.checkCancellation()
                  let chessApi = await chessApiResult
                  try Task.checkCancellation()
                  let stockfish = await stockfishResult
                  try Task.checkCancellation()
                  
                  // 5. FAIR voting: one vote per source for its best move only,
                  //    so a multi-PV source can't dominate the others.
                  var bestBySource: [String: TopMove] = [:]
                  if let lm = lichess, !lm.isEmpty, let first = lm.first { bestBySource["LC"] = first }
                  if let m = chessApi { bestBySource["CA"] = m }
                  if let m = stockfish { bestBySource["SF"] = m }
                  
                  // 6. If ALL cloud engines failed (nil = network error / no
                  //    response), fall back to local Stockfish so we still get an
                  //    answer offline instead of showing "Offline".
                  if bestBySource.isEmpty {
                      if let local = await callLocalEngine(fen: fen, depth: depth) {
                          let a = EngineAnalysis(topMoves: [local], bestMove: local, depth: local.depth, sourcesUsed: "🧠 Local", confidence: 1, debugFen: fen, openingName: nil, openingECO: nil, tablebaseResult: nil, isMatchMode: isMatchMode)
                          await MainActor.run { onUpdate(a) }
                          return a
                      }
                      throw EngineError.networkOffline
                  }
                  
                  // 7. Build combined candidate list and merge
                  var combined: [TopMove] = []
                  if let lm = lichess { combined.append(contentsOf: lm) }
                  if let m = chessApi { combined.append(m) }
                  if let m = stockfish { combined.append(m) }
                  
                  var voteCount: [String: Int] = [:]
                  var sourceOf: [String: [String]] = [:]
                  for (src, mv) in bestBySource {
                      voteCount[mv.uci, default: 0] += 1
                      sourceOf[mv.uci, default: []].append(src)
                  }
                  
                  var unique: [String: TopMove] = [:]
                  for m in combined {
                      if let ex = unique[m.uci] {
                          if m.rankScore > ex.rankScore { unique[m.uci] = m }
                      } else { unique[m.uci] = m }
                  }
                  
                  let sorted = unique.values.sorted { a, b in
                      let av = voteCount[a.uci] ?? 0, bv = voteCount[b.uci] ?? 0
                      if av != bv { return av > bv }
                      return a.rankScore > b.rankScore
                  }
                  
                  let finalMoves: [TopMove] = sorted.prefix(multiPV).enumerated().map { idx, m in
                      let votes = voteCount[m.uci] ?? 0
                      let srcs = (sourceOf[m.uci] ?? [m.source])
                      let san = SanGenerator.generate(uci: m.uci, fen: fen)
                      return TopMove(rank: idx + 1, uci: m.uci, san: san, evaluationCp: m.evaluationCp, mateIn: m.mateIn, depth: m.depth, source: srcs.joined(separator: "+"), votes: votes)
                  }
                  
                  let topVotes = finalMoves.first?.votes ?? 1
                  let allSources = Array(Set(bestBySource.keys)).sorted().joined(separator: "+")
                  let bestDepth = finalMoves.map { $0.depth }.max() ?? depth
                  
                  let analysis = EngineAnalysis(topMoves: finalMoves, bestMove: finalMoves.first, depth: bestDepth, sourcesUsed: allSources, confidence: min(topVotes, 3), debugFen: fen, openingName: nil, openingECO: nil, tablebaseResult: nil, isMatchMode: isMatchMode)
                  
                  if !isMatchMode {
                      await AnalysisCache.shared.set(fen: fen, moves: finalMoves, depth: bestDepth, sources: allSources, confidence: min(topVotes, 3))
                  }
                  
                  await MainActor.run { onUpdate(analysis) }
                  return analysis
              }
          }
          '''

          for path, content in files.items():
              content = textwrap.dedent(content).strip() + "\n"
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f: f.write(content)
              print(f"  ✅ {path}")
          print(f"\nWrote Engine Service + SAN generator")
          PYEOF

      - name: Generate Swift files (Part 5 - ViewModels)
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, textwrap
          files = {}

          files["Sources/EngineViewModel.swift"] = r'''
          import Foundation
          import SwiftUI

          enum MoveQuality: String {
              case brilliant = "!!", best = "!", good = "✓", inaccuracy = "?!", mistake = "?", blunder = "??", none = ""
              var color: Color {
                  switch self {
                  case .brilliant: return .cyan
                  case .best: return .green
                  case .good: return .green.opacity(0.7)
                  case .inaccuracy: return .yellow
                  case .mistake: return .orange
                  case .blunder: return .red
                  case .none: return .clear
                  }
              }
          }

          @MainActor
          final class EngineViewModel: ObservableObject {
              @Published var currentFEN = ""
              @Published var topMoves: [TopMove] = []
              @Published var evaluation = "—"
              @Published var winChance: Double = 50
              @Published var depth = 0
              @Published var isThinking = false
              @Published var errorMessage = ""
              @Published var isOffline = false
              @Published var sourcesUsed = ""
              @Published var engineConfidence: Int = 0
              
              @Published var detectedPlayerColor = "w"
              @Published var manualPlayerColor: String? = nil
              @Published var sideToMove = "w"
              @Published var lastMoveUCI = ""
              @Published var plyCount = -1
              
              @Published var lastMoveQuality: MoveQuality = .none
              @Published var lastMoveCentipawnLoss = 0
              @Published var lastMoveWasMine = false
              
              @Published var showBlunderAlert = false
              @Published var blunderAlertText = ""
              
              @Published var currentOpeningName: String? = nil
              @Published var currentOpeningECO: String? = nil
              @Published var isTablebasePosition = false
              @Published var tablebaseCategory: String = ""
              
              @Published var isMatchMode = false
              
              var bestMove: TopMove? { topMoves.first }
              var effectivePlayerColor: String { manualPlayerColor ?? detectedPlayerColor }
              var isMyTurn: Bool { effectivePlayerColor == sideToMove }
              
              private let fenBuilder = FenBuilder()
              private var previousEvalWhitePOV: Double? = nil
              private var previousFEN: String = ""
              private var previousBestMove: String? = nil
              private var lastSuccessfulFEN = ""
              private var analysisTask: Task<Void, Never>?
              private var debounceTask: Task<Void, Never>?
              private var moveHistoryUCI: [String] = []
              private var lastKnownPly: Int = -1
              
              // ---- Color detection stabilization ----
              // bottomColor (read from the board's visual orientation) is the
              // most reliable signal. We cross-check with the king heuristic and
              // require a couple of consistent samples before committing, so the
              // detected color never flickers during navigation/board flipping.
              private var pendingColor: String? = nil
              private var pendingColorCount = 0
              private let colorCommitThreshold = 2
              
              weak var recorder: GameRecorder?
              
              func setManualColor(_ c: String?) {
                  manualPlayerColor = c
                  pendingColor = nil; pendingColorCount = 0
                  if !currentFEN.isEmpty { lastSuccessfulFEN = ""; analyze(fen: currentFEN) }
              }
              
              func flipColor() {
                  setManualColor(effectivePlayerColor == "w" ? "b" : "w")
                  HapticManager.selection()
              }
              
              func toggleMatchMode() {
                  isMatchMode.toggle()
                  if isMatchMode { HapticManager.matchModeAlert() }
                  if !currentFEN.isEmpty { lastSuccessfulFEN = ""; analyze(fen: currentFEN) }
              }
              
              func resetFenTracker() {
                  fenBuilder.reset()
                  moveHistoryUCI = []
                  lastKnownPly = -1
                  lastSuccessfulFEN = ""
                  previousEvalWhitePOV = nil
                  previousFEN = ""
                  previousBestMove = nil
                  currentOpeningName = nil
                  currentOpeningECO = nil
                  isTablebasePosition = false
                  Task { await AnalysisCache.shared.clear() }
                  recorder?.startNewGame()
              }
              
              struct BoardPayload {
                  let grid: String, sideToMove: String
                  let flipped: Bool, flippedConfident: Bool
                  let lastMoveUCI: String, plyCount: Int
                  let bottomColor: String
              }
              
              private func updateDetectedColor(_ bottomColor: String, flipped: Bool, flippedConfident: Bool) {
                  guard manualPlayerColor == nil else { return }
                  
                  // Best signal: bottomColor (a real visual read from the board).
                  var candidate: String? = nil
                  var sourceConfidence: Bool = false
                  
                  if !bottomColor.isEmpty {
                      candidate = bottomColor
                      sourceConfidence = true
                  } else if flippedConfident {
                      candidate = flipped ? "b" : "w"
                      sourceConfidence = true
                  }
                  
                  guard let cand = candidate else { return }
                  if !sourceConfidence { return }
                  
                  // Hysteresis: only commit after N consistent samples, or
                  // instantly when both signals agree.
                  if let pending = pendingColor, pending == cand {
                      pendingColorCount += 1
                  } else {
                      pendingColor = cand
                      pendingColorCount = 1
                  }
                  
                  let agree = flippedConfident && (flipped ? "b" : "w") == cand
                  if pendingColorCount >= colorCommitThreshold || agree {
                      if detectedPlayerColor != cand {
                          detectedPlayerColor = cand
                          // Color changed => previous eval/quality context invalid
                          previousEvalWhitePOV = nil
                          previousFEN = ""
                          previousBestMove = nil
                      }
                      pendingColor = nil
                      pendingColorCount = 0
                  }
              }
              
              func ingest(_ p: BoardPayload) {
                  // Check if helper is completely hidden
                  if AppSettings.shared.isHelperCompletelyHidden { return }
                  
                  sideToMove = p.sideToMove
                  lastMoveUCI = p.lastMoveUCI
                  plyCount = p.plyCount
                  
                  // Color detection using improved orientation logic
                    updateDetectedColor(p.bottomColor, flipped: p.flipped, flippedConfident: p.flippedConfident)
                  
                  // Track move history
                  if p.plyCount > lastKnownPly && !p.lastMoveUCI.isEmpty {
                      moveHistoryUCI.append(p.lastMoveUCI)
                      lastKnownPly = p.plyCount
                  }
                  
                  // Reset on new game
                  if p.plyCount == 0 || p.plyCount < lastKnownPly - 2 {
                      resetFenTracker()
                      lastKnownPly = p.plyCount
                  }
                  
                  // Build FEN
                  let chars = Array(p.grid)
                  guard chars.count == 64 else { return }
                  var grid: [[Character]] = Array(repeating: Array(repeating: ".", count: 8), count: 8)
                  for r in 0..<8 { for c in 0..<8 { grid[r][c] = chars[r * 8 + c] } }
                  
                  // grid arrives in absolute coordinates (white back rank = row 7)
                  // from reader.js, so no flip is needed here for FEN building.
                  
                  let fen = fenBuilder.build(grid: grid, sideToMove: p.sideToMove, plyCount: p.plyCount)
                  if FenValidator.validate(fen) != nil { return }
                  
                  if fen != currentFEN {
                      previousFEN = currentFEN
                      currentFEN = fen
                      topMoves = []
                      evaluation = "—"
                      winChance = 50
                      errorMessage = ""
                      sourcesUsed = ""
                      engineConfidence = 0
                      currentOpeningName = nil
                      currentOpeningECO = nil
                      isTablebasePosition = false
                      
                      analyze(fen: fen)
                  }
              }
              
              private func analyze(fen: String) {
                  debounceTask?.cancel()
                  debounceTask = Task { [weak self] in
                      try? await Task.sleep(nanoseconds: 100_000_000)  // 100ms debounce
                      if Task.isCancelled { return }
                      await self?.runAnalysis(fen: fen)
                  }
              }
              
              private func runAnalysis(fen: String) async {
                  if fen == lastSuccessfulFEN && !isMatchMode { return }
                  
                  analysisTask?.cancel()
                  isThinking = true
                  errorMessage = ""
                  
                  analysisTask = Task { [weak self] in
                      guard let self = self else { return }
                      do {
                          let analysis = try await EngineService.analyzePosition(fen: fen, isMatchMode: self.isMatchMode) { partial in
                              guard fen == self.currentFEN else { return }
                              self.topMoves = partial.topMoves
                              if let best = partial.bestMove {
                                  self.evaluation = best.evalString
                                  self.winChance = best.winChance
                                  self.depth = best.depth
                              }
                              self.sourcesUsed = partial.sourcesUsed
                              self.engineConfidence = partial.confidence
                              self.currentOpeningName = partial.openingName
                              self.currentOpeningECO = partial.openingECO
                              if partial.tablebaseResult != nil {
                                  self.isTablebasePosition = true
                                  self.tablebaseCategory = partial.tablebaseResult?.category.rawValue.uppercased() ?? ""
                              }
                          }
                          
                          if Task.isCancelled { return }
                          guard fen == self.currentFEN else { return }
                          
                          self.topMoves = analysis.topMoves
                          self.evaluation = analysis.bestMove?.evalString ?? "—"
                          self.winChance = analysis.bestMove?.winChance ?? 50
                          self.depth = analysis.depth
                          self.sourcesUsed = analysis.sourcesUsed
                          self.engineConfidence = analysis.confidence
                          self.isThinking = false
                          self.isOffline = false
                          self.errorMessage = ""
                          self.lastSuccessfulFEN = fen
                          
                          // Compute move quality
                          let wpov = self.evalWhitePOV(analysis.bestMove)
                          self.computeQuality(cur: wpov)
                          
                          // Record move
                          if !self.previousFEN.isEmpty && !self.lastMoveUCI.isEmpty {
                              let prevCP = self.previousEvalWhitePOV.map { Int(($0 * 100).rounded()) }
                              let currCP = analysis.bestMove?.evaluationCp
                              self.recorder?.recordMove(
                                  previousFen: self.previousFEN, previousEval: prevCP,
                                  currentFen: fen, currentEval: currCP,
                                  lastMoveUCI: self.lastMoveUCI, wasMyMove: self.lastMoveWasMine,
                                  bestMoveUCI: self.previousBestMove, plyCount: self.plyCount
                              )
                              
                              // Blunder alert
                              if self.lastMoveWasMine && self.lastMoveCentipawnLoss >= 100 {
                                  self.blunderAlertText = "\(self.lastMoveQuality.rawValue) −\(self.lastMoveCentipawnLoss)cp"
                                  self.showBlunderAlert = true
                                  HapticManager.blunderWarning()
                                  Task {
                                      try? await Task.sleep(nanoseconds: 3_000_000_000)
                                      await MainActor.run { self.showBlunderAlert = false }
                                  }
                              }
                          }
                          
                          self.previousBestMove = analysis.bestMove?.uci
                          self.previousEvalWhitePOV = wpov
                          
                      } catch {
                          if Task.isCancelled { return }
                          guard fen == self.currentFEN else { return }
                          
                          self.isThinking = false
                          self.topMoves = []
                          self.evaluation = "—"
                          
                          if let e = error as? EngineError {
                              switch e {
                              case .networkOffline, .allEnginesFailed:
                                  self.isOffline = true
                                  self.errorMessage = "Offline"
                              case .badFen(let m):
                                  self.errorMessage = "Bad FEN: \(m)"
                              case .cancelled:
                                  break
                              }
                          } else {
                              self.isOffline = true
                              self.errorMessage = "Error"
                          }
                      }
                  }
              }
              
              private func evalWhitePOV(_ m: TopMove?) -> Double {
                  guard let m = m else { return 0 }
                  if let mate = m.mateIn, mate != 0 { return mate > 0 ? 30 : -30 }
                  let cp = Double(m.evaluationCp ?? 0) / 100.0
                  return sideToMove == "w" ? cp : -cp
              }
              
              private func computeQuality(cur: Double) {
                  guard let prev = previousEvalWhitePOV, !lastMoveUCI.isEmpty else {
                      lastMoveQuality = .none
                      lastMoveCentipawnLoss = 0
                      return
                  }
                  
                  let mul: Double = (sideToMove == "w") ? -1 : 1
                  let loss = (prev - cur) * mul
                  let cp = Int((loss * 100).rounded())
                  lastMoveCentipawnLoss = max(0, cp)
                  
                  let mover = (sideToMove == "w") ? "b" : "w"
                  lastMoveWasMine = (mover == effectivePlayerColor)
                  
                  switch cp {
                  case ..<(-30): lastMoveQuality = .brilliant
                  case (-30)...15: lastMoveQuality = .best
                  case 16...49: lastMoveQuality = .good
                  case 50...99: lastMoveQuality = .inaccuracy
                  case 100...299: lastMoveQuality = .mistake
                  default: lastMoveQuality = .blunder
                  }
              }
          }
          '''

          files["Sources/AIAssistantViewModel.swift"] = r'''
          import Foundation
          import SwiftUI

          @MainActor
          final class AIAssistantViewModel: ObservableObject {
              @Published var currentExplanation = ""
              @Published var isLoadingExplanation = false
              @Published var explanationError = ""
              @Published var currentExplainedMove = ""
              @Published var chatMessages: [ChatEntry] = []
              @Published var isLoadingChat = false
              @Published var chatInput = ""
              @Published var threatAnalysis = ""
              @Published var isLoadingThreats = false
              @Published var isPuzzleDetected = false
              @Published var puzzleHint = ""
              
              struct ChatEntry: Identifiable, Equatable {
                  let id = UUID()
                  let role: String
                  let text: String
              }
              
              private var cache: [String: String] = [:]
              private var task: Task<Void, Never>?
              
              func explainMove(fen: String, uci: String, san: String, eval: String, ranking: Int, totalMoves: Int, isArabic: Bool) {
                  let key = "\(fen)|\(uci)|\(isArabic)"
                  if let cached = cache[key] { currentExplanation = cached; currentExplainedMove = san; return }
                  
                  currentExplanation = ""; currentExplainedMove = san; isLoadingExplanation = true; explanationError = ""
                  task?.cancel()
                  task = Task {
                      do {
                          let r = try await GroqService.explainMove(fen: fen, uci: uci, san: san, eval: eval, isArabic: isArabic, ranking: ranking, totalMoves: totalMoves)
                          if Task.isCancelled { return }
                          currentExplanation = r; cache[key] = r; isLoadingExplanation = false
                      } catch {
                          if Task.isCancelled { return }
                          explanationError = error.localizedDescription; isLoadingExplanation = false
                      }
                  }
              }
              
              func explainPuzzle(fen: String, bestMove: String, isArabic: Bool) {
                  currentExplanation = ""; currentExplainedMove = "🧩 " + (isArabic ? "فرصة" : "Tactic"); isLoadingExplanation = true
                  task?.cancel()
                  task = Task {
                      do {
                          let r = try await GroqService.explainPuzzle(fen: fen, bestMove: bestMove, isArabic: isArabic)
                          if Task.isCancelled { return }
                          currentExplanation = r; isLoadingExplanation = false
                      } catch {
                          if Task.isCancelled { return }
                          explanationError = error.localizedDescription; isLoadingExplanation = false
                      }
                  }
              }
              
              func sendChat(fen: String, isArabic: Bool) {
                  let q = chatInput.trimmingCharacters(in: .whitespaces)
                  guard !q.isEmpty else { return }
                  chatInput = ""; chatMessages.append(ChatEntry(role: "user", text: q)); isLoadingChat = true
                  Task {
                      do {
                          let r = try await GroqService.askAboutPosition(fen: fen, question: q, isArabic: isArabic)
                          chatMessages.append(ChatEntry(role: "ai", text: r)); isLoadingChat = false
                      } catch {
                          chatMessages.append(ChatEntry(role: "ai", text: "⚠️ \(error.localizedDescription)")); isLoadingChat = false
                      }
                  }
              }
              
              func analyzeThreats(fen: String, isArabic: Bool) {
                  threatAnalysis = ""; isLoadingThreats = true
                  Task {
                      do {
                          let r = try await GroqService.analyzeThreats(fen: fen, isArabic: isArabic)
                          threatAnalysis = r; isLoadingThreats = false
                      } catch {
                          threatAnalysis = "⚠️ \(error.localizedDescription)"; isLoadingThreats = false
                      }
                  }
              }
              
              func checkForPuzzle(topMoves: [TopMove]) {
                  guard topMoves.count >= 2 else { isPuzzleDetected = false; puzzleHint = ""; return }
                  let gap = topMoves[0].rankScore - topMoves[1].rankScore
                  if gap >= 150 || topMoves[0].mateIn != nil {
                      isPuzzleDetected = true
                      puzzleHint = topMoves[0].mateIn != nil ? "M\(abs(topMoves[0].mateIn!))" : "+\(Int(gap))cp"
                  } else {
                      isPuzzleDetected = false; puzzleHint = ""
                  }
              }
              
              func clearChat() { chatMessages.removeAll() }
              func clearExplanation() { currentExplanation = ""; currentExplainedMove = "" }
          }
          '''

