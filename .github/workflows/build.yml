      # ============================================================
      #  Resources/reader.js (chess.com DOM reader)
      # ============================================================
      - name: Write reader.js
        run: |
          cat > Resources/reader.js <<'JS_EOF'
          (function () {
            if (window.__ch_v3) return;
            window.__ch_v3 = true;
            const PIECE_MAP = { wp:'P',wn:'N',wb:'B',wr:'R',wq:'Q',wk:'K',
                                bp:'p',bn:'n',bb:'b',br:'r',bq:'q',bk:'k' };
            const PIECE_NAMES = { king:'K',queen:'Q',rook:'R',bishop:'B',knight:'N',pawn:'P' };

            function findBoard() {
              return document.querySelector('wc-chess-board, chess-board, cg-board, .board-layout-chessboard');
            }
            function readGrid(board) {
              const grid = Array.from({length:8},()=>Array(8).fill('.'));
              const nodes = board.querySelectorAll('.piece, piece, [data-piece]');
              if (!nodes.length) return null;
              nodes.forEach(n=>{
                let piece=null, file=null, rank=null;
                const cls = (n.className||'').toString();
                cls.split(/\s+/).forEach(c=>{ if(PIECE_MAP[c]) piece=PIECE_MAP[c]; });
                if(!piece){
                  const dp = n.getAttribute && n.getAttribute('data-piece');
                  if(dp && PIECE_MAP[dp]) piece = PIECE_MAP[dp];
                }
                if(!piece){
                  const parts = cls.toLowerCase().split(/\s+/);
                  const color = parts.find(p=>p==='white'||p==='black');
                  const name  = parts.find(p=>PIECE_NAMES[p]);
                  if(color && name){
                    const letter = PIECE_NAMES[name];
                    piece = color==='white'?letter:letter.toLowerCase();
                  }
                }
                cls.split(/\s+/).forEach(c=>{
                  const m = /^square-(\d)(\d)$/.exec(c);
                  if(m){ file=+m[1]; rank=+m[2]; }
                });
                if(file===null){
                  const ds = n.getAttribute && n.getAttribute('data-square');
                  if(ds && ds.length===2){
                    file = ds.charCodeAt(0)-96;
                    rank = parseInt(ds[1],10);
                  }
                }
                if(file===null){
                  const st = (n.getAttribute && n.getAttribute('style')) || '';
                  const m = /translate\(\s*(-?\d+(?:\.\d+)?)%?\s*,\s*(-?\d+(?:\.\d+)?)%?/.exec(st);
                  if(m){
                    const col = Math.round(parseFloat(m[1])/12.5);
                    const row = Math.round(parseFloat(m[2])/12.5);
                    if(col>=0&&col<=7&&row>=0&&row<=7){ file=col+1; rank=8-row; }
                  }
                }
                if(piece&&file&&rank&&rank>=1&&rank<=8&&file>=1&&file<=8){
                  grid[8-rank][file-1]=piece;
                }
              });
              return grid;
            }

            function detectFlipped(board) {
              const signals = [];
              let el = board;
              for(let i=0;i<6&&el;i++){
                if(el.classList && el.classList.contains('flipped')){ signals.push(true); break; }
                el = el.parentElement;
              }
              if(board.hasAttribute('flipped')) signals.push(true);
              const o = board.getAttribute('orientation');
              if(o==='black') signals.push(true);
              if(o==='white') signals.push(false);
              if(signals.length===0) return null;
              const t = signals.filter(x=>x===true).length;
              const f = signals.filter(x=>x===false).length;
              if(t===f) return null;
              return t>f;
            }

            function detectPly() {
              const pn = document.querySelectorAll('[data-ply]');
              if(pn.length){
                let m=-1;
                pn.forEach(n=>{ const p=parseInt(n.getAttribute('data-ply'),10);
                                if(!isNaN(p)&&p>m) m=p; });
                if(m>=0) return m;
              }
              return -1;
            }

            let prevGrid=null, lastPayload='', lastSide='w';
            function diff(prev,curr){
              if(!prev||!curr) return null;
              const changes=[];
              for(let r=0;r<8;r++) for(let c=0;c<8;c++)
                if(prev[r][c]!==curr[r][c]) changes.push({r,c,before:prev[r][c],after:curr[r][c]});
              if(changes.length<2||changes.length>4) return null;
              const to = changes.find(x=>x.after!=='.'&&x.after!==x.before);
              const from = changes.find(x=>x.before!=='.'&&x.after==='.');
              if(!to||!from) return null;
              const f = String.fromCharCode(97+from.c)+(8-from.r);
              const t = String.fromCharCode(97+to.c)+(8-to.r);
              const moved = to.after===to.after.toUpperCase()?'w':'b';
              return { uci: f+t, movedColor: moved };
            }

            function tick(){
              const board = findBoard(); if(!board) return;
              const grid = readGrid(board); if(!grid) return;
              let side=null, conf='low';
              const ply = detectPly();
              if(ply>=0){ side = (ply%2===0)?'w':'b'; conf='high'; }
              const mv = diff(prevGrid, grid);
              if(mv && !side){ side = (mv.movedColor==='w')?'b':'w'; conf='low'; }
              if(!side) side = lastSide;
              lastSide = side;
              const flipRaw = detectFlipped(board);
              const flipped = flipRaw===null?false:flipRaw;
              const gridStr = grid.map(r=>r.join('')).join('');
              const payload = { grid:gridStr, sideToMove:side, flipped:flipped,
                                flippedConfident: flipRaw!==null,
                                lastMoveUCI: mv?mv.uci:'', plyCount: ply,
                                detectionConfidence: conf };
              const key = JSON.stringify(payload);
              if(key!==lastPayload){
                lastPayload = key;
                try { window.webkit.messageHandlers.fenBridge.postMessage(payload); } catch(_){}
              }
              prevGrid = grid;
            }

            window.__ch_startReader = function(){
              if(window.__ch_timer) return;
              window.__ch_timer = setInterval(tick, 500);
            };
            const mo = new MutationObserver(()=>tick());
            try { mo.observe(document.documentElement,{childList:true,subtree:true,attributes:true}); } catch(_){}
            window.__ch_startReader();
          })();
          JS_EOF

