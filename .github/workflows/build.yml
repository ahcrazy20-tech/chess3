          '''

          files["Sources/AnalysisCache.swift"] = r'''
          import Foundation
          actor AnalysisCache {
              static let shared = AnalysisCache()
              private struct Entry { let moves: [TopMove]; let depth: Int; let sources: String; let confidence: Int; let timestamp: Date }
              private var cache: [String: Entry] = [:]
              private var order: [String] = []
              private let maxSize = 1000
              func get(fen: String) -> (moves: [TopMove], depth: Int, sources: String, confidence: Int)? {
                  guard let e = cache[fen] else { return nil }
                  // Cache valid for 30 minutes
                  if Date().timeIntervalSince(e.timestamp) > 1800 { cache.removeValue(forKey: fen); return nil }
                  order.removeAll { $0 == fen }; order.append(fen)
                  return (e.moves, e.depth, e.sources, e.confidence)
              }
              func set(fen: String, moves: [TopMove], depth: Int, sources: String, confidence: Int) {
                  cache[fen] = Entry(moves: moves, depth: depth, sources: sources, confidence: confidence, timestamp: Date())
                  order.removeAll { $0 == fen }; order.append(fen)
                  while order.count > maxSize { let o = order.removeFirst(); cache.removeValue(forKey: o) }
              }
              func clear() { cache.removeAll(); order.removeAll() }
              func count() -> Int { cache.count }
          }
          '''

          files["Sources/HapticManager.swift"] = r'''
          import UIKit
          enum HapticManager {
              static func moveReady() { UIImpactFeedbackGenerator(style: .light).impactOccurred(intensity: 0.6) }
              static func blunderWarning() { UINotificationFeedbackGenerator().notificationOccurred(.warning) }
              static func success() { UINotificationFeedbackGenerator().notificationOccurred(.success) }
              static func selection() { UISelectionFeedbackGenerator().selectionChanged() }
              static func tacticalOpportunity() {
                  UINotificationFeedbackGenerator().notificationOccurred(.success)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.1) { UIImpactFeedbackGenerator(style: .heavy).impactOccurred() }
              }
              static func matchModeAlert() {
                  UIImpactFeedbackGenerator(style: .heavy).impactOccurred()
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.15) { UIImpactFeedbackGenerator(style: .heavy).impactOccurred() }
              }
          }
          '''

          files["Sources/VoiceManager.swift"] = r'''
          import Foundation
          import AVFoundation
          @MainActor
          final class VoiceManager: ObservableObject {
              static let shared = VoiceManager()
              private let synth = AVSpeechSynthesizer()
              @Published var isEnabled: Bool = false
              private init() { try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .voicePrompt, options: [.mixWithOthers, .duckOthers]) }
              func speakMove(uci: String, san: String, isArabic: Bool) {
                  let piece = detectPiece(san: san, isArabic: isArabic)
                  let toSquare = uci.count >= 4 ? String(uci.dropFirst(2).prefix(2)) : uci
                  let text = isArabic ? "\(piece) إلى \(arabicSquare(toSquare))" : "\(piece) to \(toSquare)"
                  speak(text: text, isArabic: isArabic)
              }
              func speak(text: String, isArabic: Bool) {
                  synth.stopSpeaking(at: .immediate)
                  let u = AVSpeechUtterance(string: text)
                  u.voice = AVSpeechSynthesisVoice(language: isArabic ? "ar-SA" : "en-US")
                  u.rate = 0.5; u.volume = 1.0
                  synth.speak(u)
              }
              func stop() { synth.stopSpeaking(at: .immediate) }
              private func detectPiece(san: String, isArabic: Bool) -> String {
                  switch san.first {
                  case "K": return isArabic ? "الملك" : "King"
                  case "Q": return isArabic ? "الوزير" : "Queen"
                  case "R": return isArabic ? "القلعة" : "Rook"
                  case "B": return isArabic ? "الفيل" : "Bishop"
                  case "N": return isArabic ? "الحصان" : "Knight"
                  case "O": return san.hasPrefix("O-O-O") ? (isArabic ? "تبييت طويل" : "Long castle") : (isArabic ? "تبييت قصير" : "Short castle")
                  default: return isArabic ? "بيدق" : "Pawn"
                  }
              }
              private func arabicSquare(_ sq: String) -> String {
                  guard let f = sq.first, let r = sq.last else { return sq }
                  let files = ["a": "أ", "b": "ب", "c": "ج", "d": "د", "e": "هـ", "f": "و", "g": "ز", "h": "ح"]
                  return "\(files[String(f)] ?? String(f))\(r)"
              }
          }
          '''

          files["Sources/GameRecorder.swift"] = r'''
          import Foundation
          import SwiftUI
          @MainActor
          final class GameRecorder: ObservableObject {
              struct MoveRecord: Identifiable, Codable {
                  let id: UUID; let ply: Int; let uci: String; let san: String
                  let fenBefore: String; let fenAfter: String
                  let evalBefore: Int?; let evalAfter: Int?
                  let wasMyMove: Bool; let quality: String
                  let bestAlternative: String?; let cpLoss: Int; let timestamp: Date
              }
              @Published var moves: [MoveRecord] = []
              @Published var gameId: UUID = UUID()
              @Published var currentAccuracy: Double = 100.0
              @Published var myMoveCount = 0
              @Published var brilliantCount = 0
              @Published var bestCount = 0
              @Published var goodCount = 0
              @Published var inaccuracyCount = 0
              @Published var mistakeCount = 0
              @Published var blunderCount = 0
              
              func recordMove(previousFen: String, previousEval: Int?, currentFen: String, currentEval: Int?, lastMoveUCI: String, wasMyMove: Bool, bestMoveUCI: String?, plyCount: Int) {
                  guard !lastMoveUCI.isEmpty else { return }
                  var cpLoss = 0
                  if let prev = previousEval, let curr = currentEval {
                      cpLoss = max(0, (prev - curr) * (wasMyMove ? 1 : -1))
                  }
                  let quality: String
                  switch cpLoss {
                  case ..<(-30): quality = "brilliant"
                  case (-30)...15: quality = "best"
                  case 16...49: quality = "good"
                  case 50...99: quality = "inaccuracy"
                  case 100...299: quality = "mistake"
                  default: quality = "blunder"
                  }
                  let finalQuality = (bestMoveUCI == lastMoveUCI) ? "best" : quality
                  moves.append(MoveRecord(id: UUID(), ply: plyCount, uci: lastMoveUCI, san: lastMoveUCI, fenBefore: previousFen, fenAfter: currentFen, evalBefore: previousEval, evalAfter: currentEval, wasMyMove: wasMyMove, quality: finalQuality, bestAlternative: (bestMoveUCI == lastMoveUCI ? nil : bestMoveUCI), cpLoss: cpLoss, timestamp: Date()))
                  if wasMyMove {
                      myMoveCount += 1
                      switch finalQuality {
                      case "brilliant": brilliantCount += 1
                      case "best": bestCount += 1
                      case "good": goodCount += 1
                      case "inaccuracy": inaccuracyCount += 1
                      case "mistake": mistakeCount += 1
                      case "blunder": blunderCount += 1
                      default: break
                      }
                      recomputeAccuracy()
                  }
              }
              func startNewGame() {
                  moves = []; gameId = UUID(); currentAccuracy = 100.0; myMoveCount = 0
                  brilliantCount = 0; bestCount = 0; goodCount = 0
                  inaccuracyCount = 0; mistakeCount = 0; blunderCount = 0
              }
              // IMPROVED: separate brilliant from best, clearer weights
              private func recomputeAccuracy() {
                  guard myMoveCount > 0 else { currentAccuracy = 100.0; return }
                  let total = brilliantCount * 100 + bestCount * 95 + goodCount * 80 + inaccuracyCount * 60 + mistakeCount * 40 + blunderCount * 15
                  currentAccuracy = Double(total) / Double(myMoveCount)
              }
              private let storeKey = "chess_helper_game_history"
              func saveCurrentGame() {
                  guard !moves.isEmpty else { return }
                  var history = loadHistory()
                  history.insert(GameHistoryEntry(id: gameId, date: Date(), moves: moves, accuracy: currentAccuracy), at: 0)
                  if history.count > 50 { history = Array(history.prefix(50)) }
                  if let data = try? JSONEncoder().encode(history) { UserDefaults.standard.set(data, forKey: storeKey) }
              }
              func loadHistory() -> [GameHistoryEntry] {
                  guard let data = UserDefaults.standard.data(forKey: storeKey), let h = try? JSONDecoder().decode([GameHistoryEntry].self, from: data) else { return [] }
                  return h
              }
              func clearHistory() { UserDefaults.standard.removeObject(forKey: storeKey) }
          }
          struct GameHistoryEntry: Identifiable, Codable { let id: UUID; let date: Date; let moves: [GameRecorder.MoveRecord]; let accuracy: Double }
          '''

          for path, content in files.items():
              content = textwrap.dedent(content).strip() + "\n"
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f: f.write(content)
              print(f"  ✅ {path}")
          print(f"\nWrote {len(files)} Swift files (Part 1)")
          PYEOF

