          # ========== EngineService - UPDATED with Opening Book + Tablebase ==========
          files["Sources/EngineService.swift"] = r'''
          import Foundation
          struct TopMove: Identifiable, Equatable {
              let id = UUID()
              let rank: Int; let uci: String; let san: String
              let evaluationCp: Int?; let mateIn: Int?; let depth: Int
              let source: String; let votes: Int
              var evalString: String {
                  if let m = mateIn, m != 0 { return "M\(abs(m))" }
                  if let cp = evaluationCp { return String(format: "%+.2f", Double(cp)/100.0) }
                  return "—"
              }
              var winChance: Double {
                  if let m = mateIn, m != 0 { return m > 0 ? 99 : 1 }
                  guard let cp = evaluationCp else { return 50 }
                  return 50 + 50 * tanh(Double(cp)/400.0)
              }
              var rankScore: Double {
                  if let m = mateIn, m != 0 { return m > 0 ? 100000 - Double(m) : -100000 - Double(m) }
                  return Double(evaluationCp ?? 0)
              }
          }
          struct EngineAnalysis {
              let topMoves: [TopMove]; let bestMove: TopMove?
              let depth: Int; let sourcesUsed: String
              let confidence: Int; let debugFen: String
              let openingName: String?
              let tablebaseResult: TablebaseResult?
          }
          enum EngineError: Error, LocalizedError {
              case badFen(String), networkOffline, allEnginesFailed, cancelled
              var errorDescription: String? {
                  switch self {
                  case .badFen(let m): return "Bad FEN: \(m)"
                  case .networkOffline: return "No internet"
                  case .allEnginesFailed: return "All engines offline"
                  case .cancelled: return "Cancelled"
                  }
              }
          }
          enum EngineService {
              // MARK: - Opening Book Check (INSTANT)
              static func checkOpeningBook(fen: String) async -> OpeningInfo? {
                  await OpeningBook.shared.load()
                  return await OpeningBook.shared.lookup(fen: fen)
              }
              
              // MARK: - Tablebase Check (for endgames)
              static func checkTablebase(fen: String) async -> TablebaseResult? {
                  return await TablebaseService.probe(fen: fen)
              }
              
              // MARK: - Cloud APIs
              static func callLichessCloud(fen: String, multiPv: Int = 3) async -> [TopMove]? {
                  var comps = URLComponents(string: "https://lichess.org/api/cloud-eval")!
                  comps.queryItems = [URLQueryItem(name: "fen", value: fen), URLQueryItem(name: "multiPv", value: "\(multiPv)")]
                  guard let url = comps.url else { return nil }
                  var req = URLRequest(url: url); req.timeoutInterval = 4
                  req.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  do {
                      let (data, resp) = try await URLSession.shared.data(for: req)
                      guard let http = resp as? HTTPURLResponse else { return nil }
                      if http.statusCode == 404 { return [] }
                      guard http.statusCode == 200 else { return nil }
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      let depth = (json["depth"] as? Int) ?? 20
                      guard let pvs = json["pvs"] as? [[String: Any]] else { return [] }
                      var moves: [TopMove] = []
                      for (idx, pv) in pvs.prefix(multiPv).enumerated() {
                          let ms = (pv["moves"] as? String) ?? ""
                          let fm = String(ms.split(separator: " ").first ?? "")
                          guard !fm.isEmpty else { continue }
                          guard MoveValidator.isPlausibleMove(uci: fm, fen: fen) else { continue }
                          let cp = pv["cp"] as? Int; let mate = pv["mate"] as? Int
                          moves.append(TopMove(rank: idx + 1, uci: fm, san: fm, evaluationCp: cp, mateIn: (mate == 0 ? nil : mate), depth: depth, source: "lc", votes: 1))
                      }
                      return moves
                  } catch { return nil }
              }
              
              static func callChessApi(fen: String, deep: Bool = false) async -> TopMove? {
                  guard let url = URL(string: "https://chess-api.com/v1") else { return nil }
                  var req = URLRequest(url: url); req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  req.timeoutInterval = deep ? 12 : 5
                  let body: [String: Any] = ["fen": fen, "depth": deep ? 18 : 13, "maxThinkingTime": deep ? 800 : 200]
                  guard let hb = try? JSONSerialization.data(withJSONObject: body) else { return nil }
                  req.httpBody = hb
                  do {
                      let (data, _) = try await URLSession.shared.data(for: req)
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      let uci = (json["move"] as? String) ?? ""; guard !uci.isEmpty else { return nil }
                      guard MoveValidator.isPlausibleMove(uci: uci, fen: fen) else { return nil }
                      let san = (json["san"] as? String) ?? uci
                      let eval = json["eval"] as? Double; let mate = json["mate"] as? Int
                      let cp = eval.map { Int(($0 * 100).rounded()) }; let d = (json["depth"] as? Int) ?? 13
                      return TopMove(rank: 1, uci: uci, san: san, evaluationCp: cp, mateIn: (mate == 0 ? nil : mate), depth: d, source: "cA", votes: 1)
                  } catch { return nil }
              }
              
              static func callStockfishOnline(fen: String, deep: Bool = false) async -> TopMove? {
                  var comps = URLComponents(string: "https://stockfish.online/api/s/v2.php")!
                  comps.queryItems = [URLQueryItem(name: "fen", value: fen), URLQueryItem(name: "depth", value: deep ? "15" : "13")]
                  guard let url = comps.url else { return nil }
                  var req = URLRequest(url: url); req.timeoutInterval = deep ? 12 : 5
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  do {
                      let (data, _) = try await URLSession.shared.data(for: req)
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      if let s = json["success"] as? Bool, !s { return nil }
                      let bf = (json["bestmove"] as? String) ?? ""
                      let parts = bf.split(separator: " ").map(String.init)
                      var uci = ""
                      for (i, p) in parts.enumerated() where p == "bestmove" && i+1 < parts.count { uci = parts[i+1]; break }
                      if uci.isEmpty { uci = parts.first ?? "" }
                      guard !uci.isEmpty, MoveValidator.isPlausibleMove(uci: uci, fen: fen) else { return nil }
                      let ev = json["evaluation"] as? Double; let mate = json["mate"] as? Int
                      let cp: Int? = ev.map { Int(($0 * 100).rounded()) }; let d = (json["depth"] as? Int) ?? 13
                      return TopMove(rank: 1, uci: uci, san: uci, evaluationCp: cp, mateIn: (mate == 0 ? nil : mate), depth: d, source: "sf", votes: 1)
                  } catch { return nil }
              }
              
              // MARK: - Main Analysis (with Opening Book + Tablebase + Engines)
              static func analyzeStreaming(fen: String, moveHistory: [String], deep: Bool = false,
                                            onUpdate: @escaping @MainActor (EngineAnalysis) -> Void) async throws -> EngineAnalysis {
                  if let issue = FenValidator.validate(fen) { throw EngineError.badFen(issue) }
                  
                  // 1. Check Opening Book FIRST (instant!)
                  let openingInfo = await checkOpeningBook(fen: fen)
                  if let opening = openingInfo {
                      // Return opening book moves immediately
                      let bookMoves = opening.moves.prefix(3).enumerated().map { idx, move in
                          TopMove(rank: idx + 1, uci: move, san: move, evaluationCp: 0, mateIn: nil, depth: 99, source: "book", votes: 3)
                      }
                      if !bookMoves.isEmpty {
                          let a = EngineAnalysis(topMoves: Array(bookMoves), bestMove: bookMoves.first, depth: 99,
                                                  sourcesUsed: "📖 book", confidence: 3, debugFen: fen,
                                                  openingName: "\(opening.eco): \(opening.name)", tablebaseResult: nil)
                          await MainActor.run { onUpdate(a) }
                          return a
                      }
                  }
                  
                  // 2. Check Tablebase for endgames (≤7 pieces)
                  let pieceCount = FenValidator.countPieces(fen)
                  var tbResult: TablebaseResult? = nil
                  if pieceCount <= 7 {
                      tbResult = await checkTablebase(fen: fen)
                      if let tb = tbResult, let bestMove = tb.bestMove {
                          let evalCp: Int
                          switch tb.category {
                          case .win: evalCp = 10000
                          case .loss: evalCp = -10000
                          case .draw, .unknown: evalCp = 0
                          }
                          let tbMove = TopMove(rank: 1, uci: bestMove, san: bestMove, evaluationCp: evalCp,
                                               mateIn: tb.dtm, depth: 99, source: "TB", votes: 3)
                          let a = EngineAnalysis(topMoves: [tbMove], bestMove: tbMove, depth: 99,
                                                  sourcesUsed: "🏁 tablebase", confidence: 3, debugFen: fen,
                                                  openingName: nil, tablebaseResult: tb)
                          await MainActor.run { onUpdate(a) }
                          return a
                      }
                  }
                  
                  // 3. Check Cache
                  if !deep, let cached = await AnalysisCache.shared.get(fen: fen) {
                      let cm = cached.moves.enumerated().map { (i, m) in
                          TopMove(rank: i + 1, uci: m.uci, san: m.san, evaluationCp: m.evaluationCp, mateIn: m.mateIn, depth: m.depth, source: "cache", votes: m.votes)
                      }
                      let a = EngineAnalysis(topMoves: cm, bestMove: cm.first, depth: cached.depth, sourcesUsed: "cache", confidence: cached.confidence, debugFen: fen, openingName: nil, tablebaseResult: nil)
                      await MainActor.run { onUpdate(a) }
                      return a
                  }
                  
                  // 4. Call Cloud APIs in parallel
                  async let lr = callLichessCloud(fen: fen, multiPv: deep ? 5 : 3)
                  async let cr = callChessApi(fen: fen, deep: deep)
                  async let sr = callStockfishOnline(fen: fen, deep: deep)
                  
                  let lichess = await lr; try Task.checkCancellation()
                  let cA = await cr; try Task.checkCancellation()
                  let sf = await sr; try Task.checkCancellation()
                  
                  // 5. Merge results with voting
                  var mv: [String: (move: TopMove, votes: Int, sources: [String])] = [:]
                  if let lm = lichess { for m in lm {
                      if var e = mv[m.uci] { e.votes += 1; e.sources.append("lc"); mv[m.uci] = e }
                      else { mv[m.uci] = (m, 1, ["lc"]) }
                  }}
                  if let m = cA {
                      if var e = mv[m.uci] { e.votes += 1; e.sources.append("cA"); mv[m.uci] = e }
                      else { mv[m.uci] = (m, 1, ["cA"]) }
                  }
                  if let m = sf {
                      if var e = mv[m.uci] { e.votes += 1; e.sources.append("sf"); mv[m.uci] = e }
                      else { mv[m.uci] = (m, 1, ["sf"]) }
                  }
                  
                  guard !mv.isEmpty else {
                      if lichess == nil && cA == nil && sf == nil { throw EngineError.networkOffline }
                      throw EngineError.allEnginesFailed
                  }
                  
                  let sorted = mv.values.sorted { a, b in
                      if a.votes != b.votes { return a.votes > b.votes }
                      return a.move.rankScore > b.move.rankScore
                  }
                  let limit = deep ? 5 : 3
                  let final: [TopMove] = sorted.prefix(limit).enumerated().map { (idx, e) in
                      TopMove(rank: idx + 1, uci: e.move.uci, san: e.move.san, evaluationCp: e.move.evaluationCp, mateIn: e.move.mateIn, depth: e.move.depth, source: e.sources.joined(separator: "+"), votes: e.votes)
                  }
                  let topV = final.first?.votes ?? 1
                  let allS = Array(Set(mv.values.flatMap { $0.sources })).sorted().joined(separator: "+")
                  let bestD = final.map { $0.depth }.max() ?? 13
                  
                  let analysis = EngineAnalysis(topMoves: final, bestMove: final.first, depth: bestD, sourcesUsed: allS, confidence: min(topV, 3), debugFen: fen, openingName: nil, tablebaseResult: nil)
                  
                  if !deep {
                      await AnalysisCache.shared.set(fen: fen, moves: final, depth: bestD, sources: allS, confidence: min(topV, 3))
                  }
                  
                  await MainActor.run { onUpdate(analysis) }
                  return analysis
              }
          }
