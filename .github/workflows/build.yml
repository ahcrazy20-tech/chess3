          files["Sources/KeychainStore.swift"] = r'''
          import Foundation
          import Security

          /// Secure API key storage using iOS Keychain.
          enum KeychainStore {
              static let groqKeyAccount = "chess_helper_groq_api_key"
              static let service = "com.chesshelper.app"

              static func save(_ value: String, account: String) -> Bool {
                  let data = value.data(using: .utf8)!
                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: service,
                      kSecAttrAccount as String: account
                  ]
                  SecItemDelete(query as CFDictionary)
                  var newItem = query
                  newItem[kSecValueData as String] = data
                  let status = SecItemAdd(newItem as CFDictionary, nil)
                  return status == errSecSuccess
              }

              static func load(account: String) -> String? {
                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: service,
                      kSecAttrAccount as String: account,
                      kSecReturnData as String: true,
                      kSecMatchLimit as String: kSecMatchLimitOne
                  ]
                  var item: CFTypeRef?
                  let status = SecItemCopyMatching(query as CFDictionary, &item)
                  guard status == errSecSuccess, let data = item as? Data else { return nil }
                  return String(data: data, encoding: .utf8)
              }

              static func delete(account: String) {
                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: service,
                      kSecAttrAccount as String: account
                  ]
                  SecItemDelete(query as CFDictionary)
              }
          }
          '''

          files["Sources/GroqService.swift"] = r'''
          import Foundation

          /// Groq AI API service for chess move explanation and chat.
          /// Uses Llama 3.3 70B - fast and smart.
          enum GroqService {

              struct ChatMessage: Codable {
                  let role: String  // "system" | "user" | "assistant"
                  let content: String
              }

              enum GroqError: Error, LocalizedError {
                  case noKey
                  case invalidKey
                  case networkError(String)
                  case rateLimited
                  case parseError

                  var errorDescription: String? {
                      switch self {
                      case .noKey: return "No Groq API key. Add it in Settings."
                      case .invalidKey: return "Invalid API key. Check Settings."
                      case .networkError(let m): return "Network: \(m)"
                      case .rateLimited: return "Too many requests. Wait a moment."
                      case .parseError: return "Bad response from AI"
                      }
                  }
              }

              /// Call Groq chat completion API
              static func chat(messages: [ChatMessage], temperature: Double = 0.3) async throws -> String {
                  guard let apiKey = KeychainStore.load(account: KeychainStore.groqKeyAccount),
                        !apiKey.isEmpty else {
                      throw GroqError.noKey
                  }

                  guard let url = URL(string: "https://api.groq.com/openai/v1/chat/completions") else {
                      throw GroqError.networkError("Bad URL")
                  }

                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue("Bearer \(apiKey)", forHTTPHeaderField: "Authorization")
                  req.timeoutInterval = 30

                  let body: [String: Any] = [
                      "model": "llama-3.3-70b-versatile",
                      "messages": messages.map { ["role": $0.role, "content": $0.content] },
                      "temperature": temperature,
                      "max_tokens": 500,
                      "top_p": 0.9
                  ]

                  req.httpBody = try JSONSerialization.data(withJSONObject: body)

                  let (data, resp) = try await URLSession.shared.data(for: req)

                  guard let http = resp as? HTTPURLResponse else {
                      throw GroqError.networkError("No response")
                  }

                  if http.statusCode == 401 { throw GroqError.invalidKey }
                  if http.statusCode == 429 { throw GroqError.rateLimited }
                  guard (200..<300).contains(http.statusCode) else {
                      throw GroqError.networkError("HTTP \(http.statusCode)")
                  }

                  guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                        let choices = json["choices"] as? [[String: Any]],
                        let first = choices.first,
                        let message = first["message"] as? [String: Any],
                        let content = message["content"] as? String else {
                      throw GroqError.parseError
                  }

                  return content.trimmingCharacters(in: .whitespacesAndNewlines)
              }

              /// Explain a specific move in the current position
              static func explainMove(fen: String, uci: String, san: String,
                                       eval: String, isArabic: Bool,
                                       ranking: Int, totalMoves: Int) async throws -> String {
                  let systemPrompt: String
                  let userPrompt: String

                  if isArabic {
                      systemPrompt = """
                      أنت مدرب شطرنج محترف بمستوى Grandmaster. مهمتك شرح النقلات بالعربية.
                      كن دقيق، مختصر، ومفيد. استخدم مصطلحات شطرنج عربية بسيطة.
                      """
                      userPrompt = """
                      الموقف (FEN): \(fen)
                      النقلة #\(ranking) من أصل \(totalMoves): \(san) (\(uci))
                      التقييم: \(eval)

                      اشرحلي:
                      1. لماذا هذه النقلة جيدة؟
                      2. ما هي الخطة الاستراتيجية؟
                      3. ما هي التهديدات المحتملة من الخصم؟
                      4. أي نصائح تكتيكية؟

                      اجعل الشرح واضح ومفصل في 4-6 أسطر.
                      """
                  } else {
                      systemPrompt = """
                      You are a Grandmaster-level chess coach. Explain moves clearly and professionally.
                      Be precise, insightful, and educational.
                      """
                      userPrompt = """
                      Position (FEN): \(fen)
                      Move #\(ranking) of \(totalMoves): \(san) (\(uci))
                      Evaluation: \(eval)

                      Explain:
                      1. Why is this move good?
                      2. What is the strategic plan?
                      3. What threats to watch from opponent?
                      4. Any tactical tips?

                      Provide a detailed explanation in 4-6 lines.
                      """
                  }

                  return try await chat(messages: [
                      ChatMessage(role: "system", content: systemPrompt),
                      ChatMessage(role: "user", content: userPrompt)
                  ], temperature: 0.4)
              }

              /// Free-form chat about the current position
              static func askAboutPosition(fen: String, question: String, isArabic: Bool,
                                            history: [ChatMessage] = []) async throws -> String {
                  let systemPrompt: String
                  if isArabic {
                      systemPrompt = """
                      أنت مدرب شطرنج محترف. تعرف الموقف الحالي (FEN): \(fen)
                      أجب على أسئلة اللاعب بشكل مفصل ومفيد بالعربية.
                      استخدم لغة بسيطة ومصطلحات شطرنج معروفة.
                      """
                  } else {
                      systemPrompt = """
                      You are a professional chess coach. You know the current position (FEN): \(fen)
                      Answer the player's questions in detail and clearly.
                      """
                  }

                  var messages: [ChatMessage] = [
                      ChatMessage(role: "system", content: systemPrompt)
                  ]
                  messages.append(contentsOf: history)
                  messages.append(ChatMessage(role: "user", content: question))

                  return try await chat(messages: messages, temperature: 0.7)
              }
          }
          '''

          files["Sources/AIAssistantViewModel.swift"] = r'''
          import Foundation
          import SwiftUI

          @MainActor
          final class AIAssistantViewModel: ObservableObject {
              @Published var currentExplanation: String = ""
              @Published var isLoadingExplanation = false
              @Published var explanationError: String = ""
              @Published var currentExplainedMove: String = ""

              @Published var chatMessages: [ChatEntry] = []
              @Published var isLoadingChat = false
              @Published var chatInput: String = ""

              struct ChatEntry: Identifiable, Equatable {
                  let id = UUID()
                  let role: String  // "user" or "ai"
                  let text: String
                  let timestamp: Date = Date()
              }

              private var explanationCache: [String: String] = [:]  // key: fen+uci
              private var explanationTask: Task<Void, Never>?

              /// Explain a specific move (with caching)
              func explainMove(fen: String, uci: String, san: String, eval: String,
                               ranking: Int, totalMoves: Int, isArabic: Bool) {
                  let cacheKey = "\(fen)|\(uci)|\(isArabic ? "ar" : "en")"

                  // Cache hit
                  if let cached = explanationCache[cacheKey] {
                      currentExplanation = cached
                      currentExplainedMove = san
                      explanationError = ""
                      isLoadingExplanation = false
                      return
                  }

                  currentExplanation = ""
                  currentExplainedMove = san
                  explanationError = ""
                  isLoadingExplanation = true

                  explanationTask?.cancel()
                  explanationTask = Task { [weak self] in
                      guard let self = self else { return }
                      do {
                          let result = try await GroqService.explainMove(
                              fen: fen, uci: uci, san: san, eval: eval,
                              isArabic: isArabic, ranking: ranking, totalMoves: totalMoves
                          )
                          if Task.isCancelled { return }
                          await MainActor.run {
                              self.currentExplanation = result
                              self.explanationCache[cacheKey] = result
                              self.isLoadingExplanation = false
                          }
                      } catch {
                          if Task.isCancelled { return }
                          await MainActor.run {
                              self.explanationError = error.localizedDescription
                              self.isLoadingExplanation = false
                          }
                      }
                  }
              }

              func clearExplanation() {
                  currentExplanation = ""
                  currentExplainedMove = ""
                  explanationError = ""
              }

              /// Send a chat question
              func sendChat(fen: String, isArabic: Bool) {
                  let question = chatInput.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !question.isEmpty else { return }
                  chatInput = ""
                  chatMessages.append(ChatEntry(role: "user", text: question))
                  isLoadingChat = true

                  // Build history for context
                  let historyMessages: [GroqService.ChatMessage] = chatMessages.suffix(6).map { entry in
                      GroqService.ChatMessage(
                          role: entry.role == "user" ? "user" : "assistant",
                          content: entry.text
                      )
                  }
                  let historyForApi = Array(historyMessages.dropLast())  // exclude the just-added one

                  Task { [weak self] in
                      guard let self = self else { return }
                      do {
                          let result = try await GroqService.askAboutPosition(
                              fen: fen, question: question, isArabic: isArabic,
                              history: historyForApi
                          )
                          await MainActor.run {
                              self.chatMessages.append(ChatEntry(role: "ai", text: result))
                              self.isLoadingChat = false
                          }
                      } catch {
                          await MainActor.run {
                              self.chatMessages.append(ChatEntry(role: "ai", text: "⚠️ \(error.localizedDescription)"))
                              self.isLoadingChat = false
                          }
                      }
                  }
              }

              func clearChat() {
                  chatMessages.removeAll()
              }
          }
          '''

          files["Sources/StealthConfig.swift"] = r'''
          import Foundation
          enum StealthConfig {
              static let bridgeName: String = randomName(prefix: "_", length: 6)
              static let readerFlag: String = randomName(prefix: "_", length: 8)
              static let startFuncName: String = randomName(prefix: "_", length: 8)
              private static let userAgents = [
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.6 Mobile/15E148 Safari/604.1",
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 17_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.1 Mobile/15E148 Safari/604.1",
              ]
              static func randomUserAgent() -> String { userAgents.randomElement()! }
              static func readerInterval() -> Int { Int.random(in: 500...900) }
              private static func randomName(prefix: String, length: Int) -> String {
