                                          .padding(.horizontal, 4).background(cc.opacity(0.25)).foregroundColor(cc).cornerRadius(3)
                                  }
                              }
                              Text(best.san.isEmpty ? best.uci : best.san)
                                  .font(.system(size: overlayPos.isCompact ? 22 : 28, weight: .black, design: .rounded))
                                  .foregroundColor(cc).minimumScaleFactor(0.7).lineLimit(1)
                              Text(best.uci).font(.caption2.monospaced()).foregroundColor(.secondary)
                          }
                          Spacer()
                          VStack(alignment: .trailing, spacing: 1) {
                              Text(best.evalString).font(.callout.bold().monospaced()).foregroundColor(cc)
                              Text("d\(best.depth)").font(.caption2.monospaced()).foregroundColor(.secondary)
                              Button {
                                  VoiceManager.shared.speakMove(uci: best.uci, san: best.san, isArabic: language.isArabic)
                                  HapticManager.selection()
                              } label: {
                                  Image(systemName: "speaker.wave.2.fill").font(.caption).foregroundColor(.blue)
