          import Foundation
          enum FenValidator {
              static func validate(_ fen: String) -> String? {
                  let parts = fen.split(separator: " ").map(String.init)
                  guard parts.count >= 4 else { return "not enough FEN fields" }
                  let ranks = parts[0].split(separator: "/").map(String.init)
                  guard ranks.count == 8 else { return "not 8 ranks" }
                  var wK = 0, bK = 0, total = 0
                  for rank in ranks {
                      var count = 0
                      for ch in rank {
                          if let d = ch.wholeNumberValue { count += d }
                          else { count += 1; total += 1; if ch == "K" { wK += 1 }; if ch == "k" { bK += 1 } }
                      }
                      if count != 8 { return "rank has \(count) squares" }
                  }
                  if wK != 1 { return "\(wK) white kings" }
                  if bK != 1 { return "\(bK) black kings" }
                  if total < 4 { return "only \(total) pieces" }
                  if total > 32 { return "\(total) pieces" }
                  return nil
              }
          }
