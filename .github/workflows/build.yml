          import Foundation

          struct TopMove: Identifiable, Equatable {
              let id = UUID()
              let rank: Int
              let uci: String
              let san: String
              let evaluationCp: Int?
              let mateIn: Int?
              let depth: Int
              let source: String
              let votes: Int
              var evalString: String {
                  if let m = mateIn, m != 0 { return "M\(abs(m))" }
                  if let cp = evaluationCp { return String(format: "%+.2f", Double(cp)/100.0) }
                  return "—"
              }
              var winChance: Double {
                  if let m = mateIn, m != 0 { return m > 0 ? 99 : 1 }
                  guard let cp = evaluationCp else { return 50 }
                  return 50 + 50 * tanh(Double(cp)/400.0)
              }
              var rankScore: Double {
                  if let m = mateIn, m != 0 { return m > 0 ? 100000 - Double(m) : -100000 - Double(m) }
                  return Double(evaluationCp ?? 0)
              }
          }

          struct EngineAnalysis {
              let topMoves: [TopMove]
              let bestMove: TopMove?
              let depth: Int
              let sourcesUsed: String
              let confidence: Int
              let debugFen: String
          }

          enum EngineError: Error, LocalizedError {
              case badFen(String)
              case networkOffline
              case allEnginesFailed
              case cancelled
              var errorDescription: String? {
                  switch self {
                  case .badFen(let msg): return "Bad FEN: \(msg)"
                  case .networkOffline: return "No internet"
                  case .allEnginesFailed: return "All engines offline"
                  case .cancelled: return "Cancelled"
                  }
              }
          }

          enum EngineService {
              static func callLichessCloud(fen: String, multiPv: Int = 3) async -> [TopMove]? {
                  var comps = URLComponents(string: "https://lichess.org/api/cloud-eval")!
                  comps.queryItems = [
                      URLQueryItem(name: "fen", value: fen),
                      URLQueryItem(name: "multiPv", value: "\(multiPv)")
                  ]
                  guard let url = comps.url else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 5
                  req.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  do {
                      let (data, resp) = try await URLSession.shared.data(for: req)
                      guard let http = resp as? HTTPURLResponse else { return nil }
                      if http.statusCode == 404 { return [] }
                      guard http.statusCode == 200 else { return nil }
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      let depth = (json["depth"] as? Int) ?? 20
                      guard let pvs = json["pvs"] as? [[String: Any]] else { return [] }
                      var moves: [TopMove] = []
                      for (idx, pv) in pvs.prefix(multiPv).enumerated() {
                          let movesStr = (pv["moves"] as? String) ?? ""
                          let firstMove = String(movesStr.split(separator: " ").first ?? "")
                          guard !firstMove.isEmpty else { continue }
                          let cp = pv["cp"] as? Int
                          let mate = pv["mate"] as? Int
                          moves.append(TopMove(rank: idx + 1, uci: firstMove, san: firstMove,
                                               evaluationCp: cp, mateIn: (mate == 0 ? nil : mate),
                                               depth: depth, source: "lc", votes: 1))
                      }
                      return moves
                  } catch { return nil }
              }

              static func callChessApi(fen: String, deep: Bool = false) async -> TopMove? {
                  guard let url = URL(string: "https://chess-api.com/v1") else { return nil }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  req.timeoutInterval = deep ? 15 : 6
                  req.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                  let body: [String: Any] = [
                      "fen": fen,
                      "depth": deep ? 18 : 13,
                      "maxThinkingTime": deep ? 800 : 200
                  ]
                  guard let httpBody = try? JSONSerialization.data(withJSONObject: body) else { return nil }
                  req.httpBody = httpBody
                  do {
                      let (data, _) = try await URLSession.shared.data(for: req)
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      let uci = (json["move"] as? String) ?? ""
                      guard !uci.isEmpty else { return nil }
                      let san = (json["san"] as? String) ?? uci
                      let eval = json["eval"] as? Double
                      let mate = json["mate"] as? Int
                      let cp = eval.map { Int(($0 * 100).rounded()) }
                      let d = (json["depth"] as? Int) ?? (deep ? 18 : 13)
                      return TopMove(rank: 1, uci: uci, san: san,
                                     evaluationCp: cp, mateIn: (mate == 0 ? nil : mate),
                                     depth: d, source: "cA", votes: 1)
                  } catch { return nil }
              }

              static func callStockfishOnline(fen: String, deep: Bool = false) async -> TopMove? {
                  var comps = URLComponents(string: "https://stockfish.online/api/s/v2.php")!
                  comps.queryItems = [
                      URLQueryItem(name: "fen", value: fen),
                      URLQueryItem(name: "depth", value: deep ? "15" : "13")
                  ]
                  guard let url = comps.url else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = deep ? 15 : 6
                  req.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  do {
                      let (data, _) = try await URLSession.shared.data(for: req)
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      if let success = json["success"] as? Bool, !success { return nil }
                      let bestField = (json["bestmove"] as? String) ?? ""
                      let parts = bestField.split(separator: " ").map(String.init)
                      var uci = ""
                      for (i, p) in parts.enumerated() where p == "bestmove" && i+1 < parts.count {
                          uci = parts[i+1]; break
                      }
                      if uci.isEmpty { uci = parts.first ?? "" }
                      guard !uci.isEmpty else { return nil }
                      let evalDouble = json["evaluation"] as? Double
                      let mate = json["mate"] as? Int
                      let cp: Int? = evalDouble.map { Int(($0 * 100).rounded()) }
                      let d = (json["depth"] as? Int) ?? 13
                      return TopMove(rank: 1, uci: uci, san: uci, evaluationCp: cp,
                                     mateIn: (mate == 0 ? nil : mate), depth: d, source: "sf", votes: 1)
                  } catch { return nil }
              }

              static func analyzeStreaming(fen: String, moveHistory: [String], deep: Bool = false,
                                            onUpdate: @escaping @MainActor (EngineAnalysis) -> Void) async throws -> EngineAnalysis {
                  if let issue = FenValidator.validate(fen) { throw EngineError.badFen(issue) }
                  if !deep, let cached = await AnalysisCache.shared.get(fen: fen) {
                      let cachedMoves = cached.moves.enumerated().map { (i, m) in
                          TopMove(rank: i + 1, uci: m.uci, san: m.san,
                                  evaluationCp: m.evaluationCp, mateIn: m.mateIn,
                                  depth: m.depth, source: "cache", votes: m.votes)
                      }
                      let a = EngineAnalysis(topMoves: cachedMoves, bestMove: cachedMoves.first,
                                             depth: cached.depth, sourcesUsed: "cache",
                                             confidence: cached.confidence, debugFen: fen)
                      await MainActor.run { onUpdate(a) }
                      return a
                  }

                  async let lichessResult = callLichessCloud(fen: fen, multiPv: deep ? 5 : 3)
                  async let chessApiResult = callChessApi(fen: fen, deep: deep)
                  async let stockfishResult = callStockfishOnline(fen: fen, deep: deep)
                  let lichess = await lichessResult
                  try Task.checkCancellation()
                  let cA = await chessApiResult
                  try Task.checkCancellation()
                  let sf = await stockfishResult
                  try Task.checkCancellation()

                  var moveVotes: [String: (move: TopMove, votes: Int, sources: [String])] = [:]
                  if let lcMoves = lichess {
                      for m in lcMoves {
                          if var existing = moveVotes[m.uci] {
                              existing.votes += 1
                              existing.sources.append("lc")
                              moveVotes[m.uci] = existing
                          } else {
                              moveVotes[m.uci] = (m, 1, ["lc"])
                          }
                      }
                  }
                  if let m = cA {
                      if var existing = moveVotes[m.uci] {
                          existing.votes += 1
                          existing.sources.append("cA")
                          moveVotes[m.uci] = existing
                      } else {
                          moveVotes[m.uci] = (m, 1, ["cA"])
                      }
                  }
                  if let m = sf {
                      if var existing = moveVotes[m.uci] {
                          existing.votes += 1
                          existing.sources.append("sf")
                          moveVotes[m.uci] = existing
                      } else {
                          moveVotes[m.uci] = (m, 1, ["sf"])
                      }
                  }
                  guard !moveVotes.isEmpty else {
                      if lichess == nil && cA == nil && sf == nil { throw EngineError.networkOffline }
                      throw EngineError.allEnginesFailed
                  }
                  let sortedEntries = moveVotes.values.sorted { a, b in
                      if a.votes != b.votes { return a.votes > b.votes }
                      return a.move.rankScore > b.move.rankScore
                  }
                  let limit = deep ? 5 : 3
                  let finalMoves: [TopMove] = sortedEntries.prefix(limit).enumerated().map { (idx, entry) in
                      TopMove(rank: idx + 1, uci: entry.move.uci, san: entry.move.san,
                              evaluationCp: entry.move.evaluationCp, mateIn: entry.move.mateIn,
                              depth: entry.move.depth,
                              source: entry.sources.joined(separator: "+"),
                              votes: entry.votes)
                  }
                  let topVotes = finalMoves.first?.votes ?? 1
                  let allSources = Array(Set(moveVotes.values.flatMap { $0.sources })).sorted().joined(separator: "+")
                  let bestDepth = finalMoves.map { $0.depth }.max() ?? 13
                  let evalsAreIdentical = finalMoves.count >= 2 &&
                      finalMoves.allSatisfy { $0.evaluationCp == finalMoves.first?.evaluationCp }
                  let shouldCache = !evalsAreIdentical && !deep
                  let analysis = EngineAnalysis(topMoves: finalMoves, bestMove: finalMoves.first,
                                                depth: bestDepth, sourcesUsed: allSources,
                                                confidence: min(topVotes, 3), debugFen: fen)
                  if shouldCache {
                      await AnalysisCache.shared.set(fen: fen, moves: finalMoves, depth: bestDepth,
                                                     sources: allSources, confidence: min(topVotes, 3))
                  }
                  await MainActor.run { onUpdate(analysis) }
                  return analysis
              }
          }
