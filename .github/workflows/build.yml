          import Foundation

          struct TablebaseResult {
              enum Category: String {
                  case win = "win"
                  case draw = "draw"
                  case loss = "loss"
                  case unknown = "unknown"
              }
              
              let category: Category
              let dtm: Int?  // Distance to mate (if available)
              let dtz: Int?  // Distance to zeroing (50-move rule)
              let bestMove: String?
              let wdl: Int?  // Win/Draw/Loss score
          }

          enum TablebaseService {
              private static let baseURL = "https://tablebase.lichess.ovh/standard"
              private static var cache: [String: TablebaseResult] = [:]
              
              static func probe(fen: String) async -> TablebaseResult? {
                  // Check cache first
                  let cacheKey = normalizeFen(fen)
                  if let cached = cache[cacheKey] {
                      return cached
                  }
                  
                  // Only query if 7 or fewer pieces
                  let pieceCount = FenValidator.countPieces(fen)
                  guard pieceCount <= 7 else { return nil }
                  
                  guard var comps = URLComponents(string: baseURL) else { return nil }
                  comps.queryItems = [URLQueryItem(name: "fen", value: fen)]
                  
                  guard let url = comps.url else { return nil }
                  
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 5
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  
                  do {
                      let (data, resp) = try await URLSession.shared.data(for: req)
                      guard let http = resp as? HTTPURLResponse, http.statusCode == 200 else { return nil }
                      
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      
                      let result = parseResult(json)
                      cache[cacheKey] = result
                      
                      // Limit cache size
                      if cache.count > 1000 {
                          cache.removeAll()
                      }
                      
                      return result
                  } catch {
                      return nil
                  }
              }
              
              private static func parseResult(_ json: [String: Any]) -> TablebaseResult {
                  let categoryStr = (json["category"] as? String) ?? "unknown"
                  let category: TablebaseResult.Category
                  switch categoryStr {
                  case "win": category = .win
                  case "cursed-win", "blessed-loss": category = .draw
                  case "draw": category = .draw
                  case "loss": category = .loss
                  default: category = .unknown
                  }
                  
                  let dtm = json["dtm"] as? Int
                  let dtz = json["dtz"] as? Int
                  let wdl = json["wdl"] as? Int
                  
                  var bestMove: String? = nil
                  if let moves = json["moves"] as? [[String: Any]], let first = moves.first {
                      bestMove = first["uci"] as? String
                  }
                  
                  return TablebaseResult(
                      category: category,
                      dtm: dtm,
                      dtz: dtz,
                      bestMove: bestMove,
                      wdl: wdl
                  )
              }
              
              private static func normalizeFen(_ fen: String) -> String {
                  let parts = fen.split(separator: " ").map(String.init)
                  if parts.count >= 4 {
                      return "\(parts[0]) \(parts[1]) \(parts[2]) \(parts[3])"
                  }
                  return fen
              }
              
              static func clearCache() {
                  cache.removeAll()
              }
          }
          '''

