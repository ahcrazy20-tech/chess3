                          }
                          Section("Auto-hide (always on)") {
                              Label("On background", systemImage: "iphone.slash")
                              Label("On screen recording", systemImage: "record.circle")
                              Label("On screenshot", systemImage: "camera.viewfinder")
                              Label("After 5 min idle", systemImage: "clock.arrow.circlepath")
                              Toggle("Minimal mode (tiny dot)", isOn: $stealth.minimalMode)
                          }
                          Section("Status") {
                              LabeledContent("Visible", value: stealth.overlayVisible ? "Yes" : "No")
                              LabeledContent("Recorded", value: stealth.isBeingRecorded ? "Yes" : "No")
                              if !stealth.lastHideReason.isEmpty {
                                  LabeledContent("Last hide", value: stealth.lastHideReason)
                              }
                              Button("Show overlay") { stealth.show() }
                              Button("Hide overlay", role: .destructive) { stealth.hide(reason: "manual") }
                          }
                          Section("About") {
                              LabeledContent("Version", value: "3.1.0 (31)")
                              LabeledContent("Engine", value: "Stockfish (stockfish.online)")
                          }
                      }
                      .navigationTitle("Settings")
                  }
              }
          }
          '''

          files["Sources/EngineViewModel.swift"] = r'''
          import Foundation
          import SwiftUI

          enum MoveQuality: String {
              case brilliant = "!! Brilliant", best = "! Best", good = "Good"
              case inaccuracy = "?! Inaccuracy", mistake = "? Mistake", blunder = "?? Blunder", none = ""
              var color: Color {
                  switch self {
                  case .brilliant: return .cyan
                  case .best: return .green
                  case .good: return .green.opacity(0.7)
                  case .inaccuracy: return .yellow
                  case .mistake: return .orange
                  case .blunder: return .red
                  case .none: return .clear
                  }
              }
          }

          enum DetectionConfidence: String { case high, medium, low, unknown }

          @MainActor
          final class EngineViewModel: ObservableObject {
              @Published var currentFEN = ""
              @Published var topMoves: [TopMove] = []
              @Published var evaluation = "—"
              @Published var winChance: Double = 50
              @Published var depth = 0
              @Published var isThinking = false
              @Published var errorMessage = ""
              @Published var detectedPlayerColor = "w"
              @Published var manualPlayerColor: String? = nil
              @Published var sideToMove = "w"
              @Published var lastMoveUCI = ""
              @Published var plyCount = -1
              @Published var confidence: DetectionConfidence = .unknown
              @Published var lastMoveQuality: MoveQuality = .none
              @Published var lastMoveCentipawnLoss = 0
              @Published var lastMoveWasMine = false
              @Published var enabled = true

              var bestMove: TopMove? { topMoves.first }
              var effectivePlayerColor: String { manualPlayerColor ?? detectedPlayerColor }
              var isMyTurn: Bool { effectivePlayerColor == sideToMove }

              private var previousEvalWhitePOV: Double? = nil
              private var lastAnalyzedFEN = ""
              private var analysisTask: Task<Void, Never>?
              private var debounceTask: Task<Void, Never>?
              private var decoyTask: Task<Void, Never>?
              private var movesSinceDecoy = 0

              func setManualColor(_ c: String?) {
                  manualPlayerColor = c
                  if !currentFEN.isEmpty { queueAnalyze(fen: currentFEN, immediate: true) }
              }
              func flipColor() { setManualColor(effectivePlayerColor == "w" ? "b" : "w") }

              struct BoardPayload {
                  let grid: String, sideToMove: String
                  let flipped: Bool, flippedConfident: Bool
                  let lastMoveUCI: String, plyCount: Int, detectionConfidence: String
              }

              func ingest(_ p: BoardPayload) {
                  guard enabled else { return }
                  sideToMove = p.sideToMove
                  lastMoveUCI = p.lastMoveUCI
                  plyCount = p.plyCount
                  confidence = DetectionConfidence(rawValue: p.detectionConfidence) ?? .unknown
                  // TRUST the board detection when confident.
                  // If the auto-detected color disagrees with the manual override,
                  // clear the manual override — the board doesn't lie.
                  if p.flippedConfident {
                      let detected = p.flipped ? "b" : "w"
                      detectedPlayerColor = detected
                      if let m = manualPlayerColor, m != detected {
                          manualPlayerColor = nil
                      }
                  }
                  let board = buildFENBoard(from: p.grid, flipped: p.flipped)
                  let castling = deriveCastling(from: p.grid, flipped: p.flipped)
                  let full = max(1, (p.plyCount / 2) + 1)
                  let fen = "\(board) \(p.sideToMove) \(castling) - 0 \(full)"
                  if fen != currentFEN { currentFEN = fen; queueAnalyze(fen: fen) }
              }

              private func queueAnalyze(fen: String, immediate: Bool = false) {
                  debounceTask?.cancel()
                  debounceTask = Task { [weak self] in
                      if !immediate { try? await Task.sleep(nanoseconds: 400_000_000) }
                      if Task.isCancelled { return }
                      await self?.run(fen: fen)
                  }
              }

              private func run(fen: String) async {
                  guard fen != lastAnalyzedFEN else { return }
                  lastAnalyzedFEN = fen
                  analysisTask?.cancel()
                  isThinking = true
                  errorMessage = ""
                  let ud = UserDefaults.standard
                  let d = ud.integer(forKey: "engineDepth") > 0 ? ud.integer(forKey: "engineDepth") : 13
                  let v = ud.integer(forKey: "engineVariants") > 0 ? ud.integer(forKey: "engineVariants") : 3
                  let decoyEnabled = ud.object(forKey: "decoyRequests") as? Bool ?? true

                  analysisTask = Task { [weak self] in
                      guard let self = self else { return }
                      do {
                          let a = try await EngineService.analyze(fen: fen, depth: d, variants: v)
                          if Task.isCancelled { return }
                          await MainActor.run {
                              self.topMoves = a.topMoves
                              self.evaluation = a.bestMove?.evalString ?? "—"
                              self.winChance = a.bestMove?.winChance ?? 50
                              self.depth = a.depth
                              self.isThinking = false
                              let wpov = self.evalWhitePOV(a.bestMove)
                              self.computeQuality(cur: wpov)
                              self.previousEvalWhitePOV = wpov
                          }
                          if decoyEnabled {
                              self.movesSinceDecoy += 1
                              let threshold = Int.random(in: 5...9)
                              if self.movesSinceDecoy >= threshold {
                                  self.movesSinceDecoy = 0
                                  self.decoyTask?.cancel()
                                  self.decoyTask = Task {
                                      try? await Task.sleep(nanoseconds: UInt64.random(in: 2_000_000_000...8_000_000_000))
                                      await EngineService.fireDecoyRequest()
                                  }
                              }
                          }
                      } catch {
                          if Task.isCancelled { return }
                          await MainActor.run {
                              self.errorMessage = "\(error.localizedDescription)"
                              self.isThinking = false
                          }
                      }
                  }
              }

              private func evalWhitePOV(_ m: TopMove?) -> Double {
                  guard let m = m else { return 0 }
                  if let mate = m.mateIn, mate != 0 { return mate > 0 ? 30 : -30 }
                  let cp = Double(m.evaluationCp ?? 0) / 100.0
                  return sideToMove == "w" ? cp : -cp
              }

              private func computeQuality(cur: Double) {
                  guard let prev = previousEvalWhitePOV, !lastMoveUCI.isEmpty else {
                      lastMoveQuality = .none; lastMoveCentipawnLoss = 0; return
                  }
                  let mul: Double = (sideToMove == "w") ? -1 : 1
                  let loss = (prev - cur) * mul
                  let cp = Int((loss * 100).rounded())
                  lastMoveCentipawnLoss = max(0, cp)
                  let mover = (sideToMove == "w") ? "b" : "w"
                  lastMoveWasMine = (mover == effectivePlayerColor)
                  switch cp {
                  case ..<(-30): lastMoveQuality = .brilliant
                  case (-30)...15: lastMoveQuality = .best
                  case 16...49: lastMoveQuality = .good
                  case 50...99: lastMoveQuality = .inaccuracy
                  case 100...299: lastMoveQuality = .mistake
                  default: lastMoveQuality = .blunder
                  }
              }

              private func buildFENBoard(from g: String, flipped: Bool) -> String {
                  var c = Array(g); guard c.count == 64 else { return "8/8/8/8/8/8/8/8" }
                  if flipped {
                      var f: [Character] = Array(repeating: ".", count: 64)
                      for r in 0..<8 { for x in 0..<8 { f[r*8+x] = c[(7-r)*8+(7-x)] } }
                      c = f
                  }
                  var rows: [String] = []
                  for r in 0..<8 {
                      var row = ""; var empty = 0
                      for f in 0..<8 {
                          let ch = c[r*8+f]
                          if ch == "." { empty += 1 }
                          else { if empty > 0 { row += "\(empty)"; empty = 0 }; row.append(ch) }
                      }
                      if empty > 0 { row += "\(empty)" }
                      rows.append(row)
                  }
                  return rows.joined(separator: "/")
              }

              private func deriveCastling(from g: String, flipped: Bool) -> String {
                  var c = Array(g); guard c.count == 64 else { return "-" }
                  if flipped {
                      var f: [Character] = Array(repeating: ".", count: 64)
                      for r in 0..<8 { for x in 0..<8 { f[r*8+x] = c[(7-r)*8+(7-x)] } }
                      c = f
                  }
                  func p(_ file: Int, _ row: Int) -> Character { c[row*8+file] }
                  var s = ""
                  let wk = p(4,7) == "K"
                  if wk && p(7,7) == "R" { s += "K" }
                  if wk && p(0,7) == "R" { s += "Q" }
                  let bk = p(4,0) == "k"
                  if bk && p(7,0) == "r" { s += "k" }
                  if bk && p(0,0) == "r" { s += "q" }
                  return s.isEmpty ? "-" : s
              }
          }
