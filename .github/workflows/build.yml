              private var actionButtons: some View {
                  HStack(spacing: 6) {
                      // Ask AI button - triggers explanation of best move
                      Button {
                          if let best = engine.bestMove {
                              aiPos.isVisible = true
                              aiPos.isChatMode = false
                              aiVM.explainMove(
                                  fen: engine.currentFEN,
                                  uci: best.uci, san: best.san,
                                  eval: best.evalString,
                                  ranking: best.rank,
                                  totalMoves: engine.topMoves.count,
                                  isArabic: language.isArabic
                              )
                          }
                      } label: {
                          HStack(spacing: 4) {
                              Image(systemName: "sparkles").font(.caption2)
                              Text(language.isArabic ? "اسأل AI" : "Ask AI").font(.caption2.bold())
                          }
                          .padding(.horizontal, 8).padding(.vertical, 5)
                          .background(Color.purple.opacity(0.3))
                          .foregroundColor(.purple)
                          .cornerRadius(6)
                      }
                      // Deep Analyze button
                      Button { engine.deepAnalyze() } label: {
                          HStack(spacing: 4) {
                              if engine.isDeepAnalyzing {
                                  ProgressView().scaleEffect(0.5)
                              } else {
                                  Image(systemName: "brain.head.profile").font(.caption2)
                              }
                              Text(language.isArabic ? "تحليل عميق" : "Deep").font(.caption2.bold())
                          }
                          .padding(.horizontal, 8).padding(.vertical, 5)
                          .background(Color.cyan.opacity(0.3))
                          .foregroundColor(.cyan)
                          .cornerRadius(6)
                      }
                      .disabled(engine.isDeepAnalyzing)
                      // Chat button
                      Button {
                          aiPos.isVisible = true
                          aiPos.isChatMode = true
                      } label: {
                          HStack(spacing: 4) {
                              Image(systemName: "bubble.left.and.bubble.right.fill").font(.caption2)
                              Text(language.isArabic ? "دردشة" : "Chat").font(.caption2.bold())
                          }
                          .padding(.horizontal, 8).padding(.vertical, 5)
                          .background(Color.blue.opacity(0.3))
                          .foregroundColor(.blue)
                          .cornerRadius(6)
                      }
                      Spacer()
                  }
                  .padding(.horizontal, 8).padding(.vertical, 4)
              }

              private func rankColor(_ rank: Int, votes: Int) -> Color {
                  if votes >= 3 { return .green }
                  if votes >= 2 { return .yellow }
                  switch rank {
                  case 1: return .orange
                  case 2: return .white.opacity(0.85)
                  default: return .white.opacity(0.7)
                  }
              }
              private func deltaFromBest(_ move: TopMove) -> String? {
                  guard let best = engine.bestMove, best.id != move.id else { return nil }
                  let delta = Int(best.rankScore - move.rankScore)
                  if delta <= 0 { return nil }
                  return "-\(delta)"
              }
              private func moveRow(rank: Int, move: TopMove) -> some View {
                  let rc = rankColor(rank, votes: move.votes)
                  return HStack(spacing: 5) {
                      Text("#\(rank)").font(.caption2.bold().monospaced()).foregroundColor(rc).frame(width: 18)
                      Text(move.san.isEmpty ? move.uci : move.san)
                          .font(.caption.bold()).foregroundColor(rc)
                      Spacer()
                      Text("\(move.votes)v")
                          .font(.caption2.bold().monospaced())
                          .foregroundColor(rc.opacity(0.9))
                      if let d = deltaFromBest(move) {
                          Text(d).font(.caption2.monospaced()).foregroundColor(.orange)
                      }
                      Text(move.evalString).font(.caption2.bold().monospaced()).foregroundColor(rc)
                      // Small AI button for each move
                      Button {
                          aiPos.isVisible = true
                          aiPos.isChatMode = false
                          aiVM.explainMove(
                              fen: engine.currentFEN,
                              uci: move.uci, san: move.san,
                              eval: move.evalString,
                              ranking: rank,
                              totalMoves: engine.topMoves.count,
                              isArabic: language.isArabic
                          )
                      } label: {
                          Image(systemName: "sparkles").font(.caption2).foregroundColor(.purple)
                      }
                  }
                  .padding(.horizontal, 6).padding(.vertical, 2)
              }

              @ViewBuilder private var lastMoveSection: some View {
                  HStack(spacing: 4) {
                      Text(engine.lastMoveWasMine ? (language.isArabic ? "أنت:" : "You:") : (language.isArabic ? "الخصم:" : "Opp:")).font(.caption2).foregroundColor(.secondary)
                      Text(engine.lastMoveUCI).font(.caption2.monospaced()).foregroundColor(.white.opacity(0.85))
                      Spacer()
                      Text(engine.lastMoveQuality.rawValue).font(.caption2.bold())
                          .padding(.horizontal, 4).padding(.vertical, 1)
                          .background(engine.lastMoveQuality.color.opacity(0.25))
                          .foregroundColor(engine.lastMoveQuality.color).cornerRadius(3)
                  }
                  .padding(.horizontal, 10).padding(.bottom, 4)
              }

              @ViewBuilder private var errorSection: some View {
                  HStack(spacing: 4) {
                      Image(systemName: "exclamationmark.triangle.fill").foregroundColor(.orange).font(.caption2)
                      Text(engine.errorMessage).font(.caption2).foregroundColor(.orange).lineLimit(2)
                  }
                  .padding(.horizontal, 10).padding(.bottom, 4)
              }
          }
