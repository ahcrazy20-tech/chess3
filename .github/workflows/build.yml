      # ============================================================
      #  Build the app
      # ============================================================
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (ChessKitEngine)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ChessHelper.xcodeproj \
            -scheme ChessHelper

      - name: Build unsigned ChessHelper.app
        run: |
          set -eo pipefail
          xcodebuild \
            -project ChessHelper.xcodeproj \
            -scheme ChessHelper \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build

      - name: Package as unsigned .ipa
        run: |
          set -eo pipefail
          APP_PATH="$(find build/Build/Products -type d -name 'ChessHelper.app' | head -n 1)"
          echo "App bundle: $APP_PATH"
          [ -n "$APP_PATH" ] || { echo "❌ ChessHelper.app not found"; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr ChessHelper-unsigned.ipa Payload
          ls -lh ChessHelper-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-unsigned-ipa
          path: ChessHelper-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Attach IPA to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChessHelper-unsigned.ipa
          generate_release_notes: true
