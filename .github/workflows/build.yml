              // MARK: - Aggregation
              private static func medianInt(_ vals: [Int]) -> Int? {
                  guard !vals.isEmpty else { return nil }
                  let s = vals.sorted()
                  let mid = s.count / 2
                  return s.count % 2 == 1 ? s[mid] : (s[mid - 1] + s[mid]) / 2
              }
              private static func robustMedian(_ vals: [Int], tolerance: Int = 150) -> Int? {
                  guard !vals.isEmpty else { return nil }
                  var v = vals
                  var m = medianInt(v)!
                  if v.count >= 3 {
                      let filtered = v.filter { abs($0 - m) <= tolerance }
                      if filtered.count >= 2 { v = filtered; m = medianInt(v)! }
                  }
                  return m
