          files["Sources/StealthManager.swift"] = r'''
          import SwiftUI
          import UIKit
          import Combine
          @MainActor
          final class StealthManager: ObservableObject {
              @Published var overlayVisible = true
              @Published var minimalMode = false
              @Published var isBeingRecorded = false
              @Published var lastHideReason = ""
              private var cancellables = Set<AnyCancellable>()
              init() {
                  NotificationCenter.default.publisher(for: UIScreen.capturedDidChangeNotification)
                      .sink { [weak self] _ in
                          guard let self = self else { return }
                          let c = UIScreen.main.isCaptured; self.isBeingRecorded = c
                          if c { self.hide(reason: "screen recording") }
                      }.store(in: &cancellables)
                  NotificationCenter.default.publisher(for: UIApplication.userDidTakeScreenshotNotification)
                      .sink { [weak self] _ in self?.hide(reason: "screenshot") }
                      .store(in: &cancellables)
                  NotificationCenter.default.publisher(for: .stealthPanic)
                      .sink { [weak self] _ in self?.toggleOverlay() }
                      .store(in: &cancellables)
                  isBeingRecorded = UIScreen.main.isCaptured
              }
              func toggleOverlay() { overlayVisible.toggle(); lastHideReason = overlayVisible ? "" : "shake" }
              func hide(reason: String) { overlayVisible = false; lastHideReason = reason }
              func show() { overlayVisible = true; lastHideReason = "" }
              func toggleMinimalMode() { minimalMode.toggle() }
          }
          extension UIWindow {
              open override func motionEnded(_ motion: UIEvent.EventSubtype, with event: UIEvent?) {
                  if motion == .motionShake { NotificationCenter.default.post(name: .stealthPanic, object: nil) }
                  super.motionEnded(motion, with: event)
              }
          }
          extension Notification.Name { static let stealthPanic = Notification.Name("StealthPanicGesture") }
          '''

          files["Sources/VoiceManager.swift"] = r'''
          import Foundation
          import AVFoundation
          @MainActor
          final class VoiceManager: ObservableObject {
              static let shared = VoiceManager()
              private let synth = AVSpeechSynthesizer()
              @Published var isEnabled: Bool = false
              private init() {
                  configureAudio()
              }
              private func configureAudio() {
                  do {
                      try AVAudioSession.sharedInstance().setCategory(.playback, mode: .voicePrompt, options: [.mixWithOthers, .duckOthers])
                      try AVAudioSession.sharedInstance().setActive(true)
                  } catch {
                      print("Audio session error: \(error)")
                  }
              }
              func speakMove(uci: String, san: String, isArabic: Bool) {
                  let text: String
                  if isArabic {
                      text = describeInArabic(uci: uci, san: san)
                  } else {
                      text = describeInEnglish(uci: uci, san: san)
                  }
                  speak(text: text, isArabic: isArabic)
              }
              func speak(text: String, isArabic: Bool) {
                  synth.stopSpeaking(at: .immediate)
                  let utterance = AVSpeechUtterance(string: text)
                  utterance.voice = AVSpeechSynthesisVoice(language: isArabic ? "ar-SA" : "en-US")
                  utterance.rate = 0.5
                  utterance.pitchMultiplier = 1.0
                  utterance.volume = 1.0
                  synth.speak(utterance)
              }
              func stop() {
                  synth.stopSpeaking(at: .immediate)
              }
              private func describeInArabic(uci: String, san: String) -> String {
                  let piece = detectPiece(san: san, isArabic: true)
                  let toSquare = extractSquare(uci: uci)
                  let squareArabic = arabicSquare(toSquare)
                  return "\(piece) إلى \(squareArabic)"
              }
              private func describeInEnglish(uci: String, san: String) -> String {
                  let piece = detectPiece(san: san, isArabic: false)
                  let toSquare = extractSquare(uci: uci)
                  return "\(piece) to \(toSquare)"
              }
              private func detectPiece(san: String, isArabic: Bool) -> String {
                  let first = san.first ?? "P"
                  switch first {
                  case "K": return isArabic ? "الملك" : "King"
                  case "Q": return isArabic ? "الوزير" : "Queen"
                  case "R": return isArabic ? "القلعة" : "Rook"
                  case "B": return isArabic ? "الفيل" : "Bishop"
                  case "N": return isArabic ? "الحصان" : "Knight"
                  case "O":
                      if san.hasPrefix("O-O-O") { return isArabic ? "تبييت طويل" : "Long castle" }
                      return isArabic ? "تبييت قصير" : "Short castle"
                  default:
                      return isArabic ? "الجندي" : "Pawn"
                  }
              }
              private func extractSquare(uci: String) -> String {
                  guard uci.count >= 4 else { return uci }
                  return String(uci.dropFirst(2).prefix(2))
              }
              private func arabicSquare(_ sq: String) -> String {
                  guard let file = sq.first, let rank = sq.last else { return sq }
                  let fileAr: String
                  switch file {
                  case "a": fileAr = "أ"
                  case "b": fileAr = "ب"
                  case "c": fileAr = "ج"
                  case "d": fileAr = "د"
                  case "e": fileAr = "هـ"
                  case "f": fileAr = "و"
                  case "g": fileAr = "ز"
                  case "h": fileAr = "ح"
                  default: fileAr = String(file)
                  }
                  return "\(fileAr)\(rank)"
              }
          }
          '''

