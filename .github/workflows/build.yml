              }
              
              private func queueAnalyze(fen: String, immediate: Bool = false) {
                  debounceTask?.cancel(); retryTask?.cancel()
                  debounceTask = Task { [weak self] in
                      if !immediate { try? await Task.sleep(nanoseconds: 150_000_000) }
                      if Task.isCancelled { return }
                      await self?.run(fen: fen, deep: false)
                  }
              }
              
              private func run(fen: String, deep: Bool) async {
                  if !deep && fen == lastSuccessfulFEN { return }
                  analysisTask?.cancel(); isThinking = true; errorMessage = ""
                  analysisTask = Task { [weak self] in
                      guard let self = self else { return }
                      do {
                          let a = try await EngineService.analyzeStreaming(fen: fen, moveHistory: self.moveHistoryUCI, deep: deep) { partial in
                              guard fen == self.currentFEN else { return }
                              self.topMoves = partial.topMoves
                              if let best = partial.bestMove {
                                  self.evaluation = best.evalString; self.winChance = best.winChance; self.depth = best.depth
                              }
                              self.sourcesUsed = partial.sourcesUsed; self.engineConfidence = partial.confidence
                              self.currentOpeningName = partial.openingName
                              if let tb = partial.tablebaseResult {
                                  self.isTablebasePosition = true
                                  self.tablebaseCategory = tb.category.rawValue.uppercased()
                              }
                          }
                          if Task.isCancelled { return }
                          guard fen == self.currentFEN else { return }
                          await MainActor.run {
                              self.topMoves = a.topMoves
                              self.evaluation = a.bestMove?.evalString ?? "—"
                              self.winChance = a.bestMove?.winChance ?? 50; self.depth = a.depth
                              self.sourcesUsed = a.sourcesUsed; self.engineConfidence = a.confidence
                              self.isThinking = false; self.isDeepAnalyzing = false; self.isOffline = false
                              self.errorMessage = ""; self.lastSuccessfulFEN = fen
                              self.currentOpeningName = a.openingName
                              if let tb = a.tablebaseResult {
                                  self.isTablebasePosition = true
                                  self.tablebaseCategory = tb.category.rawValue.uppercased()
                              }
                              let wpov = self.evalWhitePOV(a.bestMove)
                              self.computeQuality(cur: wpov)
                              if !self.previousFEN.isEmpty && !self.lastMoveUCI.isEmpty {
                                  let prevCP = self.previousEvalWhitePOV.map { Int(($0 * 100).rounded()) }
                                  let currCP = a.bestMove?.evaluationCp
                                  self.recorder?.recordMove(previousFen: self.previousFEN, previousEval: prevCP, currentFen: fen, currentEval: currCP, lastMoveUCI: self.lastMoveUCI, wasMyMove: self.lastMoveWasMine, bestMoveUCI: self.previousBestMove, plyCount: self.plyCount)
                                  if self.lastMoveWasMine && self.lastMoveCentipawnLoss >= 100 {
                                      self.blunderAlertText = "\(self.lastMoveQuality.rawValue) −\(self.lastMoveCentipawnLoss)cp"
                                      self.showBlunderAlert = true
                                      HapticManager.blunderWarning()
                                      Task { try? await Task.sleep(nanoseconds: 3_000_000_000); await MainActor.run { self.showBlunderAlert = false } }
                                  }
                              }
                              self.previousBestMove = a.bestMove?.uci
                              self.previousEvalWhitePOV = wpov
                          }
                      } catch {
                          if Task.isCancelled { return }
                          guard fen == self.currentFEN else { return }
                          await MainActor.run {
                              self.isThinking = false; self.isDeepAnalyzing = false
                              self.topMoves = []; self.evaluation = "—"; self.sourcesUsed = ""; self.engineConfidence = 0
                              if let e = error as? EngineError {
                                  switch e {
                                  case .networkOffline: self.isOffline = true; self.errorMessage = "Offline"; self.scheduleRetry(fen: fen)
                                  case .allEnginesFailed: self.isOffline = true; self.errorMessage = "Engines down"; self.scheduleRetry(fen: fen)
                                  case .badFen(let m): self.errorMessage = "Bad FEN: \(m)"
                                  case .cancelled: break
                                  }
                              } else { self.isOffline = true; self.errorMessage = "Error"; self.scheduleRetry(fen: fen) }
                          }
                      }
                  }
              }
              
              private func scheduleRetry(fen: String) {
                  retryTask?.cancel()
                  retryTask = Task { [weak self] in
                      try? await Task.sleep(nanoseconds: 5_000_000_000)
                      guard let self = self, !Task.isCancelled, fen == self.currentFEN, self.topMoves.isEmpty else { return }
                      await self.run(fen: fen, deep: false)
                  }
              }
              
              private func evalWhitePOV(_ m: TopMove?) -> Double {
                  guard let m = m else { return 0 }
                  if let mate = m.mateIn, mate != 0 { return mate > 0 ? 30 : -30 }
                  let cp = Double(m.evaluationCp ?? 0) / 100.0
                  return sideToMove == "w" ? cp : -cp
              }
              
              private func computeQuality(cur: Double) {
                  guard let prev = previousEvalWhitePOV, !lastMoveUCI.isEmpty else { lastMoveQuality = .none; lastMoveCentipawnLoss = 0; return }
                  let mul: Double = (sideToMove == "w") ? -1 : 1
                  let loss = (prev - cur) * mul
                  let cp = Int((loss * 100).rounded())
                  lastMoveCentipawnLoss = max(0, cp)
                  let mover = (sideToMove == "w") ? "b" : "w"
                  lastMoveWasMine = (mover == effectivePlayerColor)
                  switch cp {
                  case ..<(-30): lastMoveQuality = .brilliant
                  case (-30)...15: lastMoveQuality = .best
                  case 16...49: lastMoveQuality = .good
                  case 50...99: lastMoveQuality = .inaccuracy
                  case 100...299: lastMoveQuality = .mistake
                  default: lastMoveQuality = .blunder
                  }
                  if lastMoveWasMine && cp >= 100 { HapticManager.blunderWarning() }
              }
          }
          '''

