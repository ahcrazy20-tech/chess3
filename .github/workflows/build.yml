                      ("rnbqkb1r/pppppppp/5n2/6B1/3P4/8/PPP1PPPP/RN1QKBNR b", "Trompowsky Attack", "A45", ["e6", "Ne4", "c5"], 0.52, 65),
                      ("rnbqkb1r/ppp1pppp/5n2/3p4/3P4/5NB1/PPP1PPPP/RN1QKB1R b", "Torre Attack", "D03", ["e6", "Ne4", "Nbd7"], 0.51, 60),
                      // ===== English / flank =====
                      ("rnbqkbnr/pppppppp/8/8/2P5/8/PP1PPPPP/RNBQKBNR b", "English Opening", "A10", ["e5", "c5", "Nf6", "e6", "g6"], 0.52, 78),
                      ("rnbqkbnr/pppp1ppp/8/4p3/2P5/8/PP1PPPPP/RNBQKBNR w", "English: Reversed Sicilian", "A20", ["Nc3", "g3", "Nf3", "d3"], 0.51, 75),
                      ("rnbqkbnr/pp1ppppp/8/2p5/2P5/8/PP1PPPPP/RNBQKBNR w", "English: Symmetrical", "A30", ["Nc3", "Nf3", "g3", "d4"], 0.51, 72),
                      ("rnbqkbnr/pppppppp/8/8/8/5N2/PPPPPPPP/RNBQKB1R b", "Réti Opening", "A04", ["d5", "Nf6", "c5", "g6"], 0.51, 72),
                      ("rnbqkbnr/pppppppp/8/8/5P2/8/PPPPP1PP/RNBQKBNR b", "Bird's Opening", "A02", ["d5", "Nf6", "e5", "g6"], 0.49, 55),
                      ("rnbqkbnr/ppppp1pp/8/5p2/3P4/8/PPP1PPPP/RNBQKBNR w", "Dutch Defense", "A80", ["c4", "g3", "Nf3", "Nc3"], 0.53, 65),
                      ("rnbqk2r/ppp1bppp/4pn2/3p4/2PP4/6P1/PP2PPBP/RNBQK1NR w", "Dutch: Stonewall", "A90", ["Nf3", "O-O", "c5"], 0.51, 58),
                  ]
                  for o in openings {
                      let key = normalizeFen(o.fen)
                      book[key] = OpeningInfo(name: o.name, eco: o.eco, moves: o.moves, winRate: o.winRate, popularity: o.pop)
                  }
              }

              func lookup(fen: String) -> OpeningInfo? {
                  let key = normalizeFen(fen)
                  return book[key]
              }

              // Match on board + side only (ignore castling & en passant) so the
              // opening is recognized through transpositions.
              private func normalizeFen(_ fen: String) -> String {
                  let parts = fen.split(separator: " ").map(String.init)
                  if parts.count >= 2 { return "\(parts[0]) \(parts[1])" }
                  return parts.first ?? fen
              }

              func getSuggestedMoves(fen: String) -> [String] { return lookup(fen: fen)?.moves ?? [] }
              func getOpeningName(fen: String) -> String? { return lookup(fen: fen)?.name }
              func getECO(fen: String) -> String? { return lookup(fen: fen)?.eco }
          }
