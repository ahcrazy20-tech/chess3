                          Image(systemName: expanded ? "chevron.down" : "chevron.up").font(.caption2)
                      }
                  }.padding(.horizontal, 10).padding(.vertical, 6)
              }
              
              @ViewBuilder private var bestMoveSection: some View {
                  if let best = engine.bestMove {
                      let cc = confidenceColor
                      HStack(spacing: 10) {
                          VStack(alignment: .leading, spacing: 1) {
                              HStack(spacing: 3) {
                                  Image(systemName: iconForSource(best.source)).font(.caption2).foregroundColor(cc)
