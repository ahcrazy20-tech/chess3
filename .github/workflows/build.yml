              static func callTablebase(fen: String) async -> TablebaseResult? {
                  var comps = URLComponents(string: "https://tablebase.lichess.ovh/standard")!
                  comps.queryItems = [URLQueryItem(name: "fen", value: fen)]
                  guard let url = comps.url else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 5
                  req.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  do {
                      let (data, resp) = try await URLSession.shared.data(for: req)
                      guard let http = resp as? HTTPURLResponse, http.statusCode == 200 else { return nil }
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      let checkmate = (json["checkmate"] as? Bool) ?? false
                      let category = (json["category"] as? String) ?? ""
                      guard let ms = json["moves"] as? [[String: Any]], !ms.isEmpty else { return nil }
                      var moves: [TablebaseMove] = []
                      for m in ms {
                          guard let uci = m["uci"] as? String else { continue }
                          moves.append(TablebaseMove(uci: uci, wdl: (m["wdl"] as? Int) ?? 0, category: (m["category"] as? String) ?? ""))
