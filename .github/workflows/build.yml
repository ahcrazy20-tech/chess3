                              Text("\(m.ply).").font(.caption.monospaced()).foregroundColor(.secondary).frame(width: 25)
                              Text(m.uci).font(.caption.bold()).foregroundColor(m.wasMyMove ? .white : .gray)
                              Spacer()
                              Text(m.quality == "brilliant" ? "!!" : (m.quality == "best" ? "!" : (m.quality == "good" ? "✓" : (m.quality == "inaccuracy" ? "?!" : (m.quality == "mistake" ? "?" : (m.quality == "blunder" ? "??" : ""))))))
                                  .font(.caption.bold()).foregroundColor(qualityColor(m.quality))
                          }.padding(.vertical, 1)
                      }}
                  }.padding().background(Color.gray.opacity(0.15)).cornerRadius(12)
              }
              
              private func qualityColor(_ q: String) -> Color {
                  switch q { case "brilliant": return .cyan; case "best": return .green; case "good": return .green.opacity(0.7); case "inaccuracy": return .yellow; case "mistake": return .orange; case "blunder": return .red; default: return .gray }
              }
              
              private var actionButtons: some View {
                  HStack(spacing: 8) {
