                  }.padding().background(Color.gray.opacity(0.15)).cornerRadius(12)
              }
              
              private var aiReviewButton: some View {
                  Button { requestReview() } label: {
                      HStack {
                          if isLoadingReview { ProgressView().scaleEffect(0.7) }
                          else { Image(systemName: "sparkles") }
