              }
              
              private var header: some View {
                  HStack(spacing: 6) {
                      Image(systemName: "sparkles").font(.caption).foregroundColor(.purple)
                      Text("AI").font(.caption.bold()).foregroundColor(.purple)
                      Spacer()
                      if !aiVM.currentExplanation.isEmpty && !aiPos.isChatMode {
                          Button { VoiceManager.shared.speak(text: aiVM.currentExplanation, isArabic: language.isArabic) } label: {
                              Image(systemName: "speaker.wave.2.fill").font(.caption).foregroundColor(.blue)
                          }
                      }
                      Button { withAnimation { aiPos.isChatMode.toggle() } } label: {
                          Image(systemName: aiPos.isChatMode ? "text.bubble.fill" : "bubble.left.and.bubble.right.fill").font(.caption).foregroundColor(.blue)
                      }
                      Button { aiPos.isVisible = false } label: {
                          Image(systemName: "xmark.circle.fill").font(.caption).foregroundColor(.red.opacity(0.7))
                      }
                  }.padding(.horizontal, 10).padding(.vertical, 6).background(Color.purple.opacity(0.15))
              }
              
              private var explanationContent: some View {
                  ScrollView {
                      VStack(alignment: .leading, spacing: 6) {
                          if !aiVM.currentExplainedMove.isEmpty {
                              HStack { Image(systemName: "star.fill").font(.caption).foregroundColor(.purple); Text(aiVM.currentExplainedMove).font(.callout.bold()).foregroundColor(.purple) }
                          }
                          if aiVM.isLoadingExplanation { HStack { ProgressView().scaleEffect(0.7); Text(language.isArabic ? "جاري التحليل..." : "Analyzing...").font(.caption).foregroundColor(.secondary) } }
                          else if !aiVM.explanationError.isEmpty { Text("⚠️ \(aiVM.explanationError)").font(.caption).foregroundColor(.orange) }
                          else if !aiVM.currentExplanation.isEmpty { Text(aiVM.currentExplanation).font(.callout).foregroundColor(.white.opacity(0.9)).fixedSize(horizontal: false, vertical: true) }
                          else { Text(language.isArabic ? "اضغط 'AI' للحصول على شرح" : "Tap 'AI' for explanation").font(.caption).foregroundColor(.secondary) }
                      }.padding(10)
                  }.frame(maxHeight: 280)
              }
              
              private var chatContent: some View {
                  VStack(spacing: 0) {
                      ScrollViewReader { proxy in
                          ScrollView {
                              VStack(alignment: .leading, spacing: 8) {
                                  if aiVM.chatMessages.isEmpty { Text(language.isArabic ? "اسأل AI!" : "Ask AI!").font(.caption).foregroundColor(.secondary).padding(12) }
                                  ForEach(aiVM.chatMessages) { msg in
                                      HStack {
                                          if msg.role == "user" { Spacer() }
                                          Text(msg.text).font(.caption).padding(.horizontal, 10).padding(.vertical, 6)
                                              .background(msg.role == "user" ? Color.blue.opacity(0.3) : Color.purple.opacity(0.2))
                                              .foregroundColor(.white.opacity(0.9)).cornerRadius(8)
                                              .frame(maxWidth: 240, alignment: msg.role == "user" ? .trailing : .leading)
                                          if msg.role == "ai" { Spacer() }
                                      }.id(msg.id)
                                  }
                                  if aiVM.isLoadingChat { HStack { ProgressView().scaleEffect(0.6); Text("...").font(.caption2).foregroundColor(.secondary) }.padding(.horizontal, 10) }
                              }.padding(6)
                          }.frame(maxHeight: 280)
                          .onChange(of: aiVM.chatMessages.count) { _ in if let last = aiVM.chatMessages.last { withAnimation { proxy.scrollTo(last.id, anchor: .bottom) } } }
                      }
                      HStack(spacing: 6) {
                          TextField(language.isArabic ? "سؤالك..." : "Your question...", text: $aiVM.chatInput)
                              .font(.caption).padding(.horizontal, 8).padding(.vertical, 6).background(Color.black.opacity(0.3)).cornerRadius(8).focused($chatFocused)
                              .onSubmit { aiVM.sendChat(fen: engine.currentFEN, isArabic: language.isArabic) }
