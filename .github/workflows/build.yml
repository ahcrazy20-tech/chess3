                      // Color flip button
                      Button { engine.flipColor() } label: {
                          HStack(spacing: 2) {
                              Circle().fill(engine.effectivePlayerColor == "w" ? .white : .black).frame(width: 10, height: 10).overlay(Circle().stroke(Color.gray, lineWidth: 0.5))
                              Image(systemName: "arrow.triangle.2.circlepath").font(.system(size: 8)).foregroundColor(.blue)
                          }.padding(4).background(Color.blue.opacity(0.2)).cornerRadius(4)
                      }
                      
                      // Match mode toggle
                      Button { engine.toggleMatchMode() } label: {
                          Image(systemName: engine.isMatchMode ? "flame.fill" : "flame").font(.caption)
                              .foregroundColor(engine.isMatchMode ? .orange : .gray)
                              .padding(4).background(engine.isMatchMode ? Color.orange.opacity(0.2) : Color.clear).cornerRadius(4)
                      }
                      
                      Text(engine.isMyTurn ? (language.isArabic ? "دورك" : "YOU") : (language.isArabic ? "انتظر" : "WAIT"))
                          .font(.caption2.bold()).foregroundColor(engine.isMyTurn ? .green : .secondary)
                      
                      Button { stealth.hide(reason: "manual") } label: {
                          Image(systemName: "xmark.circle.fill").font(.caption).foregroundColor(.red.opacity(0.7))
