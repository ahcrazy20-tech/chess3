              func lookup(fen: String) -> OpeningInfo? {
                  let normalized = normalizeFenForLookup(fen)
                  return book[normalized]
              }
              
              private func normalizeFenForLookup(_ fen: String) -> String {
                  // Only use board position, side to move, and castling rights for lookup
                  let parts = fen.split(separator: " ").map(String.init)
                  if parts.count >= 3 {
                      return "\(parts[0]) \(parts[1]) \(parts[2])"
                  }
                  return parts.first ?? fen
              }
              
              func getSuggestedMoves(fen: String) -> [String] {
                  if let info = lookup(fen: fen) {
                      return info.moves
                  }
                  return []
              }
