          import Foundation

          enum GroqService {
              struct ChatMessage: Codable { let role: String; let content: String }
              
              enum GroqError: Error, LocalizedError {
                  case noKey, invalidKey, networkError(String), rateLimited, parseError, timeout
                  var errorDescription: String? {
                      switch self {
                      case .noKey: return "No API key"
                      case .invalidKey: return "Invalid API key"
                      case .networkError(let m): return m
                      case .rateLimited: return "Rate limited"
                      case .parseError: return "Parse error"
                      case .timeout: return "Timeout"
                      }
                  }
              }
              
              static func chat(messages: [ChatMessage], temperature: Double = 0.3) async throws -> String {
                  guard let key = KeychainStore.load(account: KeychainStore.groqKeyAccount), !key.isEmpty else { throw GroqError.noKey }
                  guard let url = URL(string: "https://api.groq.com/openai/v1/chat/completions") else { throw GroqError.networkError("Bad URL") }
                  
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue("Bearer \(key)", forHTTPHeaderField: "Authorization")
                  req.timeoutInterval = 15
                  
                  let body: [String: Any] = [
                      "model": "llama-3.3-70b-versatile",
                      "messages": messages.map { ["role": $0.role, "content": $0.content] },
                      "temperature": temperature,
                      "max_tokens": 600
                  ]
                  req.httpBody = try JSONSerialization.data(withJSONObject: body)
                  
                  let (data, resp) = try await URLSession.shared.data(for: req)
                  guard let http = resp as? HTTPURLResponse else { throw GroqError.networkError("No response") }
                  if http.statusCode == 401 { throw GroqError.invalidKey }
                  if http.statusCode == 429 { throw GroqError.rateLimited }
                  guard (200..<300).contains(http.statusCode) else { throw GroqError.networkError("HTTP \(http.statusCode)") }
                  guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                        let choices = json["choices"] as? [[String: Any]],
                        let first = choices.first,
                        let message = first["message"] as? [String: Any],
                        let content = message["content"] as? String else { throw GroqError.parseError }
                  return content.trimmingCharacters(in: .whitespacesAndNewlines)
              }
              
              static func explainMove(fen: String, uci: String, san: String, eval: String, isArabic: Bool, ranking: Int, totalMoves: Int) async throws -> String {
                  let sys = isArabic ? "أنت مدرب شطرنج محترف. اشرح بوضوح." : "You are a chess coach. Explain clearly."
                  let usr = isArabic ?
                      "الموقف: \(fen)\nالنقلة: \(san)\nالتقييم: \(eval)\n\nاشرح لماذا هذه النقلة جيدة. 4-5 أسطر." :
                      "Position: \(fen)\nMove: \(san)\nEval: \(eval)\n\nExplain why this move is good. 4-5 lines."
                  return try await chat(messages: [ChatMessage(role: "system", content: sys), ChatMessage(role: "user", content: usr)], temperature: 0.4)
              }
              
              static func askAboutPosition(fen: String, question: String, isArabic: Bool) async throws -> String {
                  let sys = isArabic ? "أنت مدرب شطرنج. الموقف: \(fen)" : "You are a chess coach. Position: \(fen)"
                  return try await chat(messages: [ChatMessage(role: "system", content: sys), ChatMessage(role: "user", content: question)], temperature: 0.5)
              }
              
              static func analyzeThreats(fen: String, isArabic: Bool) async throws -> String {
                  let sys = isArabic ? "حلل تهديدات الموقف باختصار." : "Analyze position threats concisely."
                  let usr = isArabic ? "الموقف: \(fen)\n\nما هي التهديدات؟ 3-4 أسطر." : "Position: \(fen)\n\nWhat are the threats? 3-4 lines."
                  return try await chat(messages: [ChatMessage(role: "system", content: sys), ChatMessage(role: "user", content: usr)], temperature: 0.3)
              }
              
              static func explainPuzzle(fen: String, bestMove: String, isArabic: Bool) async throws -> String {
                  let sys = isArabic ? "أنت مدرب شطرنج تكتيكي." : "You are a tactical chess coach."
                  let usr = isArabic ?
                      "الموقف: \(fen)\nأفضل نقلة: \(bestMove)\n\nاشرح هذا التكتيك. 4-5 أسطر." :
                      "Position: \(fen)\nBest move: \(bestMove)\n\nExplain this tactic. 4-5 lines."
                  return try await chat(messages: [ChatMessage(role: "system", content: sys), ChatMessage(role: "user", content: usr)], temperature: 0.3)
              }
              
              static func reviewGame(movesUCI: [String], accuracy: Double, blunders: Int, mistakes: Int, isArabic: Bool) async throws -> String {
                  let sys = isArabic ? "راجع اللعبة بأسلوب مشجع." : "Review the game encouragingly."
                  let moves = movesUCI.prefix(40).enumerated().map { "\($0.offset + 1). \($0.element)" }.joined(separator: " ")
                  let usr = isArabic ?
                      "اللعبة: \(moves)\nالدقة: \(Int(accuracy))%\nأخطاء فادحة: \(blunders)\nأخطاء: \(mistakes)\n\n5-6 أسطر." :
                      "Game: \(moves)\nAccuracy: \(Int(accuracy))%\nBlunders: \(blunders)\nMistakes: \(mistakes)\n\n5-6 lines."
                  return try await chat(messages: [ChatMessage(role: "system", content: sys), ChatMessage(role: "user", content: usr)], temperature: 0.5)
              }
          }
          '''

