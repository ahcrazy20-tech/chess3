name: Build ChessHelper v6.5 - Maximum Accuracy

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clean & prepare
        run: |
          rm -rf Sources Resources ChessHelper.xcodeproj build Payload
          mkdir -p Sources Resources

      - name: Write project.yml
        run: |
          cat > project.yml <<'EOF'
          name: ChessHelper
          options:
            bundleIdPrefix: com.chesshelper
            deploymentTarget: { iOS: "16.0" }
            createIntermediateGroups: true
          settings:
            base:
              MARKETING_VERSION: "6.5.0"
              CURRENT_PROJECT_VERSION: "65"
              SWIFT_VERSION: "5.9"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              TARGETED_DEVICE_FAMILY: "1,2"
          targets:
            ChessHelper:
              type: application
              platform: iOS
              sources: [ { path: Sources }, { path: Resources } ]
              info:
                path: Resources/Info.plist
                properties:
                  CFBundleDisplayName: Chess Helper
                  CFBundleShortVersionString: $(MARKETING_VERSION)
                  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.chesshelper.app
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  PROVISIONING_PROFILE_SPECIFIER: ""
          EOF

      - name: Generate Swift source files (Part 1 - Core)
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, textwrap
          files = {}

