          import Foundation
          enum GroqService {
              struct ChatMessage: Codable {
                  let role: String
                  let content: String
              }
              enum GroqError: Error, LocalizedError {
                  case noKey
                  case invalidKey
                  case networkError(String)
                  case rateLimited
                  case parseError
                  case timeout
                  var errorDescription: String? {
                      switch self {
                      case .noKey:
                          return "No Groq API key. Add it in Settings."
                      case .invalidKey:
                          return "Invalid API key."
                      case .networkError(let m):
                          return "Network: \(m)"
                      case .rateLimited:
                          return "Too many requests. Try again later."
                      case .parseError:
                          return "Bad AI response"
                      case .timeout:
                          return "Request timeout. Check your connection."
                      }
                  }
              }
              static func chat(messages: [ChatMessage], temperature: Double = 0.3) async throws -> String {
                  guard let apiKey = KeychainStore.load(account: KeychainStore.groqKeyAccount), !apiKey.isEmpty else {
                      throw GroqError.noKey
                  }
                  guard let url = URL(string: "https://api.groq.com/openai/v1/chat/completions") else {
                      throw GroqError.networkError("Bad URL")
                  }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue("Bearer \(apiKey)", forHTTPHeaderField: "Authorization")
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  req.timeoutInterval = 12
                  let body: [String: Any] = [
                      "model": "llama-3.3-70b-versatile",
                      "messages": messages.map { ["role": $0.role, "content": $0.content] },
                      "temperature": temperature,
                      "max_tokens": 500,
                      "top_p": 0.9
                  ]
                  req.httpBody = try JSONSerialization.data(withJSONObject: body)
                  var lastError: Error?
                  for attempt in 0..<2 {
                      do {
                          let (data, resp) = try await URLSession.shared.data(for: req)
                          guard let http = resp as? HTTPURLResponse else {
                              throw GroqError.networkError("No response")
                          }
                          if http.statusCode == 401 {
                              throw GroqError.invalidKey
                          }
                          if http.statusCode == 429 {
                              throw GroqError.rateLimited
                          }
                          guard (200..<300).contains(http.statusCode) else {
                              throw GroqError.networkError("HTTP \(http.statusCode)")
                          }
                          guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                                let choices = json["choices"] as? [[String: Any]],
                                let first = choices.first,
                                let message = first["message"] as? [String: Any],
                                let content = message["content"] as? String else {
                              throw GroqError.parseError
                          }
                          return content.trimmingCharacters(in: .whitespacesAndNewlines)
                      } catch let error as URLError where error.code == .timedOut {
                          lastError = GroqError.timeout
                          if attempt < 1 {
                              try? await Task.sleep(nanoseconds: UInt64(pow(2.0, Double(attempt)) * 1_000_000_000))
                              continue
                          }
                      } catch {
                          lastError = error
                          if attempt < 1 && shouldRetry(error) {
                              try? await Task.sleep(nanoseconds: 1_000_000_000)
                              continue
                          }
                      }
                      break
                  }
                  throw lastError ?? GroqError.networkError("Unknown error")
              }
              private static func shouldRetry(_ error: Error) -> Bool {
                  if let urlError = error as? URLError {
                      return urlError.code == .timedOut ||
                             urlError.code == .networkConnectionLost ||
                             urlError.code == .notConnectedToInternet
                  }
                  if let groqError = error as? GroqError {
                      switch groqError {
                      case .timeout, .networkError:
                          return true
                      case .rateLimited:
                          return false
                      default:
                          return false
                      }
                  }
                  return false
              }
