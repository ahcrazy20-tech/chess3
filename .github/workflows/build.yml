          files["Sources/AIAssistantViewModel.swift"] = r'''
          import Foundation
          import SwiftUI
          @MainActor
          final class AIAssistantViewModel: ObservableObject {
              @Published var currentExplanation: String = ""
              @Published var isLoadingExplanation = false
              @Published var explanationError: String = ""
              @Published var currentExplainedMove: String = ""
              @Published var chatMessages: [ChatEntry] = []
              @Published var isLoadingChat = false
              @Published var chatInput: String = ""
              @Published var threatAnalysis: String = ""
              @Published var isLoadingThreats = false
              @Published var isPuzzleDetected = false
              @Published var puzzleHint: String = ""
              struct ChatEntry: Identifiable, Equatable {
                  let id = UUID()
                  let role: String
                  let text: String
              }
              private var explanationCache: [String: String] = [:]
              private var explanationTask: Task<Void, Never>?
              func explainMove(fen: String, uci: String, san: String, eval: String, ranking: Int, totalMoves: Int, isArabic: Bool) {
                  let cacheKey = "\(fen)|\(uci)|\(isArabic ? "ar" : "en")"
                  if let cached = explanationCache[cacheKey] {
                      currentExplanation = cached; currentExplainedMove = san
                      explanationError = ""; isLoadingExplanation = false; return
                  }
                  currentExplanation = ""; currentExplainedMove = san
                  explanationError = ""; isLoadingExplanation = true
                  explanationTask?.cancel()
                  explanationTask = Task { [weak self] in
                      guard let self = self else { return }
                      do {
                          let r = try await GroqService.explainMove(fen: fen, uci: uci, san: san, eval: eval, isArabic: isArabic, ranking: ranking, totalMoves: totalMoves)
                          if Task.isCancelled { return }
                          await MainActor.run {
                              self.currentExplanation = r
                              self.explanationCache[cacheKey] = r
                              self.isLoadingExplanation = false
                          }
                      } catch {
                          if Task.isCancelled { return }
                          await MainActor.run { self.explanationError = error.localizedDescription; self.isLoadingExplanation = false }
                      }
                  }
              }
              func explainPuzzle(fen: String, bestMove: String, isArabic: Bool) {
                  currentExplanation = ""
                  currentExplainedMove = "🧩 " + (isArabic ? "فرصة تكتيكية" : "Tactical Opportunity")
                  explanationError = ""
                  isLoadingExplanation = true
                  explanationTask?.cancel()
                  explanationTask = Task { [weak self] in
                      guard let self = self else { return }
                      do {
                          let r = try await GroqService.explainPuzzle(fen: fen, bestMove: bestMove, isArabic: isArabic)
                          if Task.isCancelled { return }
                          await MainActor.run {
                              self.currentExplanation = r
                              self.isLoadingExplanation = false
                          }
                      } catch {
                          if Task.isCancelled { return }
                          await MainActor.run { self.explanationError = error.localizedDescription; self.isLoadingExplanation = false }
                      }
                  }
              }
              func clearExplanation() { currentExplanation = ""; currentExplainedMove = ""; explanationError = "" }
              func sendChat(fen: String, isArabic: Bool) {
                  let q = chatInput.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !q.isEmpty else { return }
                  chatInput = ""
                  chatMessages.append(ChatEntry(role: "user", text: q))
                  isLoadingChat = true
                  let hist: [GroqService.ChatMessage] = chatMessages.suffix(6).dropLast().map {
                      GroqService.ChatMessage(role: $0.role == "user" ? "user" : "assistant", content: $0.text)
                  }
                  Task { [weak self] in
                      guard let self = self else { return }
                      do {
                          let r = try await GroqService.askAboutPosition(fen: fen, question: q, isArabic: isArabic, history: hist)
                          await MainActor.run { self.chatMessages.append(ChatEntry(role: "ai", text: r)); self.isLoadingChat = false }
                      } catch {
                          await MainActor.run { self.chatMessages.append(ChatEntry(role: "ai", text: "⚠️ \(error.localizedDescription)")); self.isLoadingChat = false }
                      }
                  }
              }
              func clearChat() { chatMessages.removeAll() }
              func analyzeThreats(fen: String, isArabic: Bool) {
                  threatAnalysis = ""; isLoadingThreats = true
                  Task { [weak self] in
                      guard let self = self else { return }
                      do {
                          let r = try await GroqService.analyzeThreats(fen: fen, isArabic: isArabic)
                          await MainActor.run { self.threatAnalysis = r; self.isLoadingThreats = false }
                      } catch {
                          await MainActor.run { self.threatAnalysis = "⚠️ \(error.localizedDescription)"; self.isLoadingThreats = false }
                      }
                  }
              }
              func checkForPuzzle(topMoves: [TopMove]) {
                  guard topMoves.count >= 2 else { isPuzzleDetected = false; puzzleHint = ""; return }
                  let best = topMoves[0]; let second = topMoves[1]
                  let gap = best.rankScore - second.rankScore
                  if gap >= 150 || best.mateIn != nil {
                      isPuzzleDetected = true
                      if let mate = best.mateIn { puzzleHint = "🧩 M\(abs(mate))!" }
                      else { puzzleHint = "🧩 +\(Int(gap))cp!" }
                  } else {
                      isPuzzleDetected = false; puzzleHint = ""
                  }
              }
          }
          '''

          files["Sources/AnalysisCache.swift"] = r'''
          import Foundation
          actor AnalysisCache {
              static let shared = AnalysisCache()
              private struct Entry { let moves: [TopMove]; let depth: Int; let sources: String; let confidence: Int }
              private var cache: [String: Entry] = [:]
              private var order: [String] = []
              func get(fen: String) -> (moves: [TopMove], depth: Int, sources: String, confidence: Int)? {
                  guard let e = cache[fen] else { return nil }
                  order.removeAll { $0 == fen }; order.append(fen)
                  return (e.moves, e.depth, e.sources, e.confidence)
              }
              func set(fen: String, moves: [TopMove], depth: Int, sources: String, confidence: Int) {
                  cache[fen] = Entry(moves: moves, depth: depth, sources: sources, confidence: confidence)
                  order.removeAll { $0 == fen }; order.append(fen)
                  while order.count > 200 { let o = order.removeFirst(); cache.removeValue(forKey: o) }
              }
              func clear() { cache.removeAll(); order.removeAll() }
              func count() -> Int { cache.count }
          }
          '''

          files["Sources/AppLanguage.swift"] = r'''
          import Foundation
          import SwiftUI
          @MainActor
          final class AppLanguage: ObservableObject {
              enum Lang: String, CaseIterable {
                  case arabic = "ar"
                  case english = "en"
                  var display: String { self == .arabic ? "العربية" : "English" }
                  var voiceCode: String { self == .arabic ? "ar-SA" : "en-US" }
              }
              @Published var current: Lang {
                  didSet { UserDefaults.standard.set(current.rawValue, forKey: "app_language") }
              }
              init() {
                  let saved = UserDefaults.standard.string(forKey: "app_language") ?? "en"
                  self.current = Lang(rawValue: saved) ?? .english
              }
              var isArabic: Bool { current == .arabic }
          }
          '''

