                      let f1 = await callLichessCloud(fen: fen, multiPv: 5)
                      let f2 = await callChessApi(fen: fen, deep: deep)
                      let f3 = await callStockfishOnline(fen: fen, deep: deep)
                      if let r = f1, !r.isEmpty { sources.append(("lc", r, 1)) }
                      if let r = f2 { sources.append(("cA", [r], 1)) }
                      if let r = f3 { sources.append(("sf", [r], 1)) }
                      guard !sources.isEmpty else { throw EngineError.allEnginesFailed }
                  }

                  // 2. Aggregate with weighted votes + median eval (outliers rejected)
                  var agg: [String: AggEntry] = [:]
                  for s in sources {
                      for m in s.moves {
                          var a = agg[m.uci] ?? AggEntry()
                          a.votes += s.weight
                          a.srcs.insert(s.key)
                          if let mate = m.mateIn { a.mates.append(mate) }
                          else if let cp = m.evaluationCp { a.evals.append(cp) }
                          if !m.san.isEmpty && m.san != m.uci { a.san = m.san }
                          a.depth = max(a.depth, m.depth)
