                      if recorder.moves.isEmpty {
                          Text(language.isArabic ? "لا توجد نقلات بعد" : "No moves yet")
                              .font(.caption).foregroundColor(.secondary).padding()
                      } else {
                          ForEach(recorder.moves) { move in moveRow(move) }
                      }
                  }
                  .padding()
                  .background(Color.gray.opacity(0.15))
                  .cornerRadius(12)
              }
              private func moveRow(_ move: GameRecorder.MoveRecord) -> some View {
                  HStack {
                      Text("\(move.ply).").font(.caption.monospaced()).foregroundColor(.secondary).frame(width: 30)
                      Text(move.san.isEmpty ? move.uci : move.san)
                          .font(.callout.bold())
                          .foregroundColor(move.wasMyMove ? .white : .gray)
                      Spacer()
                      qualityBadge(move.quality)
                      if move.cpLoss >= 30 {
                          Text("-\(move.cpLoss)").font(.caption2.monospaced()).foregroundColor(.orange)
                      }
                      if let alt = move.bestAlternative, alt != move.uci {
                          Text("→ \(alt)").font(.caption2.monospaced()).foregroundColor(.green)
                      }
                  }
                  .padding(.vertical, 2)
              }
              private func qualityBadge(_ q: String) -> some View {
                  let (label, color): (String, Color) = {
                      switch q {
                      case "brilliant": return ("!!", .cyan)
                      case "best": return ("⭐", .green)
                      case "good": return ("✓", .green.opacity(0.7))
                      case "inaccuracy": return ("?!", .yellow)
                      case "mistake": return ("?", .orange)
                      case "blunder": return ("??", .red)
                      default: return ("", .gray)
                      }
                  }()
                  return Text(label)
                      .font(.caption.bold())
                      .foregroundColor(color)
                      .padding(.horizontal, 6).padding(.vertical, 2)
                      .background(color.opacity(0.2))
                      .cornerRadius(4)
              }
