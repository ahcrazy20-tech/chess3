name: Build ChessHelper v5.2

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Clean & prepare
        run: |
          rm -rf Sources Resources ChessHelper.xcodeproj build Payload
          mkdir -p Sources Resources

      - name: Write project.yml
        run: |
          cat > project.yml <<'EOF'
          name: ChessHelper
          options:
            bundleIdPrefix: com.chesshelper
            deploymentTarget: { iOS: "16.0" }
            createIntermediateGroups: true
          settings:
            base:
              MARKETING_VERSION: "5.2.0"
              CURRENT_PROJECT_VERSION: "52"
              SWIFT_VERSION: "5.9"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              TARGETED_DEVICE_FAMILY: "1,2"
          targets:
            ChessHelper:
              type: application
              platform: iOS
              sources: [ { path: Sources }, { path: Resources } ]
              info:
                path: Resources/Info.plist
                properties:
                  CFBundleDisplayName: Chess Helper
                  CFBundleShortVersionString: $(MARKETING_VERSION)
                  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.chesshelper.app
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  PROVISIONING_PROFILE_SPECIFIER: ""
          EOF

      - name: Generate all Swift source files
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, textwrap
          files = {}

          files["Sources/AIAssistantPanel.swift"] = r'''
