                      let cm = cached.moves.enumerated().map { (i, m) in
                          TopMove(rank: i + 1, uci: m.uci, san: m.san, evaluationCp: m.evaluationCp, mateIn: m.mateIn, depth: m.depth, source: "cache", votes: m.votes)
