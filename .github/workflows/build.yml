          import SwiftUI
          @MainActor
          final class OverlayPosition: ObservableObject {
              @Published var offset: CGSize = .zero
              @Published var isCompact: Bool = false
              @Published var transparency: Double = 0.85
              private let xK = "ov_x_v53", yK = "ov_y_v53", cK = "ov_c_v53", tK = "ov_t_v53"
              init() {
                  let x = UserDefaults.standard.double(forKey: xK)
                  let y = UserDefaults.standard.double(forKey: yK)
                  offset = CGSize(width: x, height: y)
                  isCompact = UserDefaults.standard.bool(forKey: cK)
                  let t = UserDefaults.standard.double(forKey: tK)
                  transparency = t > 0 ? t : 0.85
              }
              func save() {
                  UserDefaults.standard.set(offset.width, forKey: xK)
                  UserDefaults.standard.set(offset.height, forKey: yK)
                  UserDefaults.standard.set(isCompact, forKey: cK)
                  UserDefaults.standard.set(transparency, forKey: tK)
              }
              func reset() { offset = .zero; isCompact = false; transparency = 0.85; save() }
          }
          @MainActor
          final class AIOverlayPosition: ObservableObject {
              @Published var offset: CGSize = CGSize(width: 0, height: -220)
              @Published var isVisible: Bool = false
              @Published var isChatMode: Bool = false
              private let xK = "ai_x_v53", yK = "ai_y_v53"
              init() {
                  let x = UserDefaults.standard.double(forKey: xK)
                  let y = UserDefaults.standard.double(forKey: yK)
                  if x != 0 || y != 0 { offset = CGSize(width: x, height: y) }
              }
              func save() {
                  UserDefaults.standard.set(offset.width, forKey: xK)
                  UserDefaults.standard.set(offset.height, forKey: yK)
              }
              func reset() { offset = CGSize(width: 0, height: -220); save() }
          }
          '''

