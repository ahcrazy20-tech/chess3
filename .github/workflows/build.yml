                              .background(Color.red.opacity(0.3))
                              .cornerRadius(8)
                      }
                  }
              }
              private func requestAIReview() {
                  guard !recorder.moves.isEmpty else { return }
                  isLoadingReview = true
                  aiReviewText = ""
                  let movesUCI = recorder.moves.map { $0.uci }
                  Task {
                      do {
                          let r = try await GroqService.reviewGame(
                              movesUCI: movesUCI,
                              accuracy: recorder.currentAccuracy,
                              blunders: recorder.blunderCount,
                              mistakes: recorder.mistakeCount,
                              isArabic: language.isArabic
                          )
                          await MainActor.run {
                              aiReviewText = r
                              isLoadingReview = false
                          }
                      } catch {
                          await MainActor.run {
                              aiReviewText = "⚠️ \(error.localizedDescription)"
                              isLoadingReview = false
                          }
                      }
                  }
