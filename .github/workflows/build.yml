                      .padding(.horizontal, 10).padding(.vertical, 6)
                      .background(cc.opacity(0.15))
                      .overlay(RoundedRectangle(cornerRadius: 6).stroke(cc.opacity(0.4), lineWidth: 1))
                      .padding(.horizontal, 6).padding(.vertical, 3)
                  }
              }
              
              private var confidenceColor: Color {
                  if engine.bestMove?.source.contains("📖") == true { return .purple }
                  if engine.bestMove?.source.contains("🏁") == true { return .cyan }
                  switch engine.engineConfidence { case 3: return .green; case 2: return .yellow; case 1: return .orange; default: return .gray }
              }
              
              private func iconForSource(_ s: String) -> String {
                  if s.contains("📖") { return "book.fill" }
                  if s.contains("🏁") { return "crown.fill" }
                  if s.contains("💾") { return "memorychip" }
                  return "star.fill"
              }
              
              private func labelForSource(_ s: String) -> String {
                  if s.contains("📖") { return "BOOK" }
                  if s.contains("🏁") { return "TB" }
                  if s.contains("💾") { return "CACHE" }
                  return language.isArabic ? "الأفضل" : "BEST"
              }
              
              private var movesSection: some View {
                  VStack(alignment: .leading, spacing: 2) {
                      Divider().opacity(0.3)
                      ForEach(Array(engine.topMoves.enumerated()), id: \.element.id) { idx, m in
                          let rc = rankColor(idx + 1, votes: m.votes, source: m.source)
                          HStack(spacing: 5) {
                              Text("#\(idx+1)").font(.caption2.bold().monospaced()).foregroundColor(rc).frame(width: 18)
                              Text(m.san.isEmpty ? m.uci : m.san).font(.caption.bold()).foregroundColor(rc)
                              Spacer()
                              if m.votes > 0 { Text("\(m.votes)v").font(.caption2.monospaced()).foregroundColor(rc.opacity(0.8)) }
                              Text(m.evalString).font(.caption2.bold().monospaced()).foregroundColor(rc)
                              Button {
                                  aiPos.isVisible = true; aiPos.isChatMode = false
                                  aiVM.explainMove(fen: engine.currentFEN, uci: m.uci, san: m.san, eval: m.evalString, ranking: idx + 1, totalMoves: engine.topMoves.count, isArabic: language.isArabic)
                              } label: {
                                  Image(systemName: "sparkles").font(.caption2).foregroundColor(.purple)
                              }
                          }.padding(.horizontal, 6).padding(.vertical, 2)
                      }
                  }.padding(.horizontal, 6).padding(.vertical, 3)
              }
              
              private var actionButtons: some View {
                  HStack(spacing: 6) {
                      Button {
                          if let best = engine.bestMove {
                              aiPos.isVisible = true; aiPos.isChatMode = false
                              aiVM.explainMove(fen: engine.currentFEN, uci: best.uci, san: best.san, eval: best.evalString, ranking: 1, totalMoves: engine.topMoves.count, isArabic: language.isArabic)
                          }
                      } label: {
                          HStack(spacing: 4) { Image(systemName: "sparkles").font(.caption2); Text("AI").font(.caption2.bold()) }
                              .padding(.horizontal, 8).padding(.vertical, 5).background(Color.purple.opacity(0.3)).foregroundColor(.purple).cornerRadius(6)
                      }
                      Button { aiPos.isVisible = true; aiPos.isChatMode = true } label: {
                          HStack(spacing: 4) { Image(systemName: "bubble.left.fill").font(.caption2); Text(language.isArabic ? "دردشة" : "Chat").font(.caption2.bold()) }
                              .padding(.horizontal, 8).padding(.vertical, 5).background(Color.blue.opacity(0.3)).foregroundColor(.blue).cornerRadius(6)
                      }
                      Spacer()
                  }.padding(.horizontal, 8).padding(.vertical, 4)
              }
              
              private func rankColor(_ rank: Int, votes: Int, source: String) -> Color {
                  if source.contains("📖") { return .purple }
                  if source.contains("🏁") { return .cyan }
                  if votes >= 3 { return .green }
                  if votes >= 2 { return .yellow }
                  switch rank { case 1: return .orange; case 2: return .white.opacity(0.85); default: return .white.opacity(0.7) }
              }
              
              @ViewBuilder private var lastMoveSection: some View {
                  HStack(spacing: 4) {
                      Text(engine.lastMoveWasMine ? (language.isArabic ? "أنت:" : "You:") : (language.isArabic ? "الخصم:" : "Opp:")).font(.caption2).foregroundColor(.secondary)
                      Text(engine.lastMoveUCI).font(.caption2.monospaced()).foregroundColor(.white.opacity(0.85))
                      Spacer()
                      Text(engine.lastMoveQuality.rawValue).font(.caption2.bold())
                          .padding(.horizontal, 4).padding(.vertical, 1)
                          .background(engine.lastMoveQuality.color.opacity(0.25))
                          .foregroundColor(engine.lastMoveQuality.color).cornerRadius(3)
                  }.padding(.horizontal, 10).padding(.bottom, 4)
              }
          }
