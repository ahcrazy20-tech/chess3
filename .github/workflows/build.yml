                  guard !agg.isEmpty else { throw EngineError.allEnginesFailed }

                  let sorted = agg.sorted { x, y in
                      if x.value.votes != y.value.votes { return x.value.votes > y.value.votes }
                      return rankScore(x.value) > rankScore(y.value)
                  }
                  let limit = deep ? 5 : 3
                  let final: [TopMove] = sorted.prefix(limit).enumerated().map { (idx, e) in
                      let mate: Int? = e.value.mates.isEmpty ? nil : medianInt(e.value.mates)
                      let cp: Int? = e.value.mates.isEmpty ? robustMedian(e.value.evals) : nil
                      return TopMove(rank: idx + 1, uci: e.key,
                                     san: e.value.san.isEmpty ? e.key : e.value.san,
                                     evaluationCp: cp, mateIn: (mate == 0 ? nil : mate),
                                     depth: e.value.depth,
                                     source: e.value.srcs.sorted().joined(separator: "+"),
                                     votes: e.value.votes)
                  }
                  let bestD = final.map { $0.depth }.max() ?? 13
                  let allS = sources.map { $0.key }.joined(separator: "+")
                  let identical = final.count >= 2 && final.allSatisfy { $0.evaluationCp == final.first?.evaluationCp }
                  let analysis = EngineAnalysis(topMoves: final, bestMove: final.first, depth: bestD,
                                                sourcesUsed: allS, confidence: min(final.first?.votes ?? 1, 3), debugFen: fen)
                  if !identical && !deep {
                      await AnalysisCache.shared.set(fen: fen, moves: final, depth: bestD, sources: allS, confidence: min(final.first?.votes ?? 1, 3))
                  }
                  await MainActor.run { onUpdate(analysis) }
                  return analysis
              }
          }
