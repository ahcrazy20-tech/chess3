          import Foundation
          import Security
          enum KeychainStore {
              static let groqKeyAccount = "chess_helper_groq_api_key"
              static let service = "com.chesshelper.app"
              static func save(_ value: String, account: String) -> Bool {
                  let data = value.data(using: .utf8)!
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service, kSecAttrAccount as String: account]
                  SecItemDelete(query as CFDictionary)
                  var newItem = query
                  newItem[kSecValueData as String] = data
                  return SecItemAdd(newItem as CFDictionary, nil) == errSecSuccess
              }
              static func load(account: String) -> String? {
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service, kSecAttrAccount as String: account, kSecReturnData as String: true, kSecMatchLimit as String: kSecMatchLimitOne]
                  var item: CFTypeRef?
                  guard SecItemCopyMatching(query as CFDictionary, &item) == errSecSuccess, let data = item as? Data else { return nil }
                  return String(data: data, encoding: .utf8)
              }
              static func delete(account: String) {
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service, kSecAttrAccount as String: account]
                  SecItemDelete(query as CFDictionary)
              }
          }
          '''

          files["Sources/LocalEngine.swift"] = r'''
          import Foundation
          import WebKit
          import UIKit

          /// Local Stockfish engine running inside a hidden WKWebView.
          /// Loads stockfish.js from CDN on first use, then stays warm & cached, giving
          /// much deeper/faster analysis than the cloud APIs — and works offline after
          /// the first load. Runs entirely on-device (no API key, no rate limits).
          struct LocalEngineResult {
              let bestMove: String
              let ponder: String?
              let evaluation: Int      // centipawns (side to move POV)
              let mateIn: Int?
              let depth: Int
              let pv: [String]
          }

          @MainActor
          final class LocalEngine: NSObject, ObservableObject {
              static let shared = LocalEngine()

              @Published var isReady = false
              @Published var isAnalyzing = false
              @Published var currentDepth = 0
              @Published var lastResult: LocalEngineResult?

              private var webView: WKWebView?
              private var analysisCallback: ((LocalEngineResult) -> Void)?
              private var bestMoveCallback: ((String) -> Void)?

              override private init() { super.init() }

              func initialize() {
                  guard webView == nil else { return }
                  let config = WKWebViewConfiguration()
                  let cc = WKUserContentController()
                  cc.add(self, name: StealthConfig.engineBridge)
                  config.userContentController = cc
                  config.websiteDataStore = .default()
                  config.defaultWebpagePreferences.allowsContentJavaScript = true

                  let wv = WKWebView(frame: CGRect(x: 0, y: 0, width: 320, height: 200), configuration: config)
                  wv.isHidden = true
                  // Attach to the app window so its JS timers/Worker keep running
                  // (a detached webview gets throttled and the engine never responds).
                  attachToWindow(wv)

                  let html = createEngineHTML()
                  wv.loadHTMLString(html, baseURL: nil)
                  webView = wv

                  DispatchQueue.main.asyncAfter(deadline: .now() + 2.5) { [weak self] in
                      self?.isReady = true
                  }
              }

              private func attachToWindow(_ wv: WKWebView) {
                  guard let scene = UIApplication.shared.connectedScenes
                          .compactMap({ $0 as? UIWindowScene })
                          .first(where: { $0.activationState == .foregroundActive }),
                        let window = scene.windows.first else { return }
                  window.addSubview(wv)
                  wv.frame = CGRect(x: -400, y: -400, width: 320, height: 200)
                  wv.layer.zPosition = -999
              }

              func analyze(fen: String, depth: Int = 20, multiPV: Int = 3, onResult: @escaping (LocalEngineResult) -> Void) {
                  guard isReady, let wv = webView else { return }
                  isAnalyzing = true
                  currentDepth = 0
                  analysisCallback = onResult
                  let js = "analyzePosition('\(fen)', \(depth), \(multiPV));"
                  wv.evaluateJavaScript(js, completionHandler: nil)
              }

              func stop() {
                  guard let wv = webView else { return }
                  wv.evaluateJavaScript("stopAnalysis();", completionHandler: nil)
                  isAnalyzing = false
              }

              private func createEngineHTML() -> String {
                  // Load stockfish.js from a CDN. After the first successful load the
                  // browser caches it, so subsequent launches work offline.
                  return """
                  <!DOCTYPE html>
                  <html><head>
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <script>
                  var engine = null, analyzing = false, lastInfo = {};
                  function initEngine(){
                    try {
                      engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
                      engine.onmessage = function(e){ processEngineLine(e.data); };
                      engine.postMessage('uci');
                      engine.postMessage('setoption name Threads value 1');
                      engine.postMessage('setoption name Hash value 64');
                      engine.postMessage('setoption name MultiPV value 3');
                      engine.postMessage('isready');
                      setTimeout(function(){ sendToSwift({type:'ready'}); }, 1500);
                    } catch(e){ sendToSwift({type:'error', message:e.toString()}); }
                  }
                  function processEngineLine(line){
                    if(typeof line !== 'string'){ try{ line = line.data || ''; }catch(e){} }
                    if(typeof line !== 'string') return;
                    if(line.indexOf('bestmove') === 0){
                      var parts = line.split(' ');
                      sendToSwift({ type:'bestmove', bestMove: parts[1]||'', ponder: parts[3]||null,
                        depth: lastInfo.depth||0, eval: lastInfo.cp||0, mate: lastInfo.mate||null, pv: lastInfo.pv||[] });
                      analyzing = false;
                    } else if(line.indexOf('info depth') !== -1){
                      lastInfo = parseInfo(line);
                      sendToSwift({ type:'info', depth: lastInfo.depth, eval: lastInfo.cp, mate: lastInfo.mate, pv: lastInfo.pv });
                    }
                  }
                  function parseInfo(line){
                    var info = {};
                    var m;
                    if((m=line.match(/depth (\\d+)/))) info.depth=parseInt(m[1]);
                    if((m=line.match(/score cp (-?\\d+)/))) info.cp=parseInt(m[1]);
                    if((m=line.match(/score mate (-?\\d+)/))) info.mate=parseInt(m[1]);
                    if((m=line.match(/pv (.+)/))) info.pv=m[1].split(' ');
                    return info;
                  }
                  function analyzePosition(fen, depth, multiPV){
                    if(!engine) return;
                    analyzing = true; lastInfo = {};
                    engine.postMessage('stop');
                    engine.postMessage('setoption name MultiPV value ' + multiPV);
                    engine.postMessage('position fen ' + fen);
                    engine.postMessage('go depth ' + depth);
                  }
                  function stopAnalysis(){ if(engine) engine.postMessage('stop'); analyzing=false; }
                  function sendToSwift(obj){ try { window.webkit.messageHandlers.\(StealthConfig.engineBridge).postMessage(obj); } catch(e){} }
                  window.onload = initEngine;
                  </script>
                  </head><body></body></html>
                  """
              }
          }

          extension LocalEngine: WKScriptMessageHandler {
              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  guard let dict = message.body as? [String: Any] else { return }
                  let type = dict["type"] as? String ?? ""
                  switch type {
                  case "ready":
                      self.isReady = true
                  case "info":
                      self.currentDepth = dict["depth"] as? Int ?? 0
                  case "bestmove":
                      let bestMove = dict["bestMove"] as? String ?? ""
                      let ponder = dict["ponder"] as? String
                      let depth = dict["depth"] as? Int ?? 0
                      let evalVal = dict["eval"] as? Int ?? 0
                      let mate = dict["mate"] as? Int
                      let pv = dict["pv"] as? [String] ?? []
                      let result = LocalEngineResult(bestMove: bestMove, ponder: ponder,
                                                     evaluation: evalVal, mateIn: mate,
                                                     depth: depth, pv: pv)
                      self.lastResult = result
                      self.isAnalyzing = false
                      self.analysisCallback?(result)
                      self.bestMoveCallback?(bestMove)
                      self.analysisCallback = nil
                      self.bestMoveCallback = nil
                  case "error":
                      print("LocalEngine error: \(dict["message"] ?? "unknown")")
                  default:
                      break
                  }
              }
          }
          '''

          files["Sources/MoveValidator.swift"] = r'''
          import Foundation
          enum MoveValidator {
              static func parseFen(_ fen: String) -> [[Character]]? {
                  let parts = fen.split(separator: " ").map(String.init)
                  guard let boardPart = parts.first else { return nil }
                  let ranks = boardPart.split(separator: "/").map(String.init)
                  guard ranks.count == 8 else { return nil }
                  var grid: [[Character]] = Array(repeating: Array(repeating: ".", count: 8), count: 8)
                  for (rIdx, rank) in ranks.enumerated() {
                      var col = 0
                      for ch in rank {
                          if let empty = ch.wholeNumberValue {
                              col += empty
                          } else {
                              if col < 8 { grid[rIdx][col] = ch }
                              col += 1
                          }
                      }
                  }
                  return grid
              }
              static func squareToCoord(_ square: String) -> (row: Int, col: Int)? {
                  guard square.count >= 2 else { return nil }
                  let chars = Array(square)
                  let fileChar = chars[0]
                  guard let fileScalar = fileChar.asciiValue, fileScalar >= 97, fileScalar <= 104 else { return nil }
                  let col = Int(fileScalar) - 97
                  guard let rankDigit = chars[1].wholeNumberValue, rankDigit >= 1, rankDigit <= 8 else { return nil }
                  let row = 8 - rankDigit
                  return (row, col)
              }
              static func isPlausibleMove(uci: String, fen: String) -> Bool {
                  guard uci.count >= 4 else { return false }
                  guard let grid = parseFen(fen) else { return false }
                  let parts = fen.split(separator: " ").map(String.init)
                  guard parts.count >= 2 else { return false }
                  let sideToMove = parts[1]
                  let fromStr = String(uci.prefix(2))
                  let toStr = String(uci.dropFirst(2).prefix(2))
                  guard let from = squareToCoord(fromStr) else { return false }
                  guard let to = squareToCoord(toStr) else { return false }
                  let fromPiece = grid[from.row][from.col]
                  guard fromPiece != "." else { return false }
                  let isWhitePiece = fromPiece.isUppercase
                  let isWhiteTurn = sideToMove == "w"
                  if isWhitePiece != isWhiteTurn { return false }
                  let toPiece = grid[to.row][to.col]
                  if toPiece != "." {
                      let toIsWhite = toPiece.isUppercase
                      if toIsWhite == isWhitePiece { return false }
                  }
                  return true
              }
          }
          '''

