          import SwiftUI
          struct HelperOverlay: View {
              @ObservedObject var engine: EngineViewModel
              @ObservedObject var stealth: StealthManager
              @ObservedObject var overlayPos: OverlayPosition
              @ObservedObject var aiVM: AIAssistantViewModel
              @ObservedObject var aiPos: AIOverlayPosition
              @ObservedObject var language: AppLanguage
              @State private var expanded = true

              private var maxWidth: CGFloat { overlayPos.isCompact ? 280 : 360 }

              var body: some View {
                  if stealth.minimalMode {
                      dot
                  } else {
                      panel.frame(maxWidth: maxWidth)
                  }
              }

              private var dot: some View {
                  Button { stealth.toggleMinimalMode() } label: {
                      Circle().fill(dotColor)
                          .frame(width: 24, height: 24)
                          .overlay(Circle().stroke(Color.white.opacity(0.4), lineWidth: 1))
                          .shadow(radius: 3)
                  }
              }
              private var dotColor: Color {
                  if engine.isOffline { return .red }
                  if engine.isMyTurn { return .green }
                  return .gray
              }

              private var panel: some View {
                  VStack(spacing: 0) {
                      header
                      if expanded {
                          if engine.isOffline { offlineBanner }
                          bestMoveHighlight
                          if !overlayPos.isCompact { movesSection }
                          actionButtons
                          if !overlayPos.isCompact && engine.lastMoveQuality != .none {
                              lastMoveSection
                          }
                          if !engine.errorMessage.isEmpty && !engine.isOffline { errorSection }
                      }
                  }
                  .background(.ultraThinMaterial)
                  .cornerRadius(12)
                  .overlay(RoundedRectangle(cornerRadius: 12).stroke(borderColor, lineWidth: 1))
                  .shadow(color: .black.opacity(0.4), radius: 8, y: 3)
              }

              private var borderColor: Color {
                  if engine.isOffline { return Color.red.opacity(0.5) }
                  return Color.white.opacity(0.15)
              }

              private var header: some View {
                  HStack(spacing: 8) {
                      Image(systemName: "hand.draw.fill").font(.caption2).foregroundColor(.white.opacity(0.5))
                      Circle().fill(engine.isOffline ? Color.red : Color.green).frame(width: 6, height: 6)
                      Text("Helper").font(.caption.bold())
                      if engine.isThinking { ProgressView().scaleEffect(0.5) }
                      Spacer()
                      Text(engine.isMyTurn ? (language.isArabic ? "دورك" : "Your turn") : (language.isArabic ? "انتظر" : "Wait"))
                          .font(.caption2.bold())
                          .foregroundColor(engine.isMyTurn ? .green : .secondary)
                      Button { stealth.hide(reason: "manual") } label: {
                          Image(systemName: "xmark.circle.fill").font(.caption).foregroundColor(.red.opacity(0.7))
                      }
                      Button { withAnimation { expanded.toggle() } } label: {
                          Image(systemName: expanded ? "chevron.down" : "chevron.up").font(.caption2)
                      }
                  }
                  .padding(.horizontal, 10).padding(.vertical, 6)
                  .contentShape(Rectangle())
              }

              private var offlineBanner: some View {
                  HStack(spacing: 4) {
                      Image(systemName: "wifi.slash").font(.caption2).foregroundColor(.red)
                      Text(language.isArabic ? "غير متصل" : "OFFLINE").font(.caption2.bold()).foregroundColor(.red)
                      Spacer()
                      ProgressView().scaleEffect(0.5)
                  }
                  .padding(.horizontal, 10).padding(.vertical, 3)
                  .background(Color.red.opacity(0.15))
              }

              @ViewBuilder private var bestMoveHighlight: some View {
                  if let best = engine.bestMove {
                      HStack(spacing: 10) {
                          VStack(alignment: .leading, spacing: 1) {
                              HStack(spacing: 3) {
                                  Image(systemName: "star.fill").font(.caption2).foregroundColor(confidenceColor)
                                  Text(language.isArabic ? "الأفضل" : "BEST").font(.caption2.bold()).foregroundColor(confidenceColor)
                                  confidenceBadge
                              }
                              Text(best.san.isEmpty ? best.uci : best.san)
                                  .font(.system(size: overlayPos.isCompact ? 22 : 28, weight: .black, design: .rounded))
                                  .foregroundColor(confidenceColor)
                                  .minimumScaleFactor(0.7).lineLimit(1)
                              Text(best.uci).font(.caption2.monospaced()).foregroundColor(.secondary)
                          }
                          Spacer()
                          VStack(alignment: .trailing, spacing: 1) {
                              Text(best.evalString)
                                  .font(.callout.bold().monospaced())
                                  .foregroundColor(confidenceColor)
                              Text("d\(best.depth)")
                                  .font(.caption2.monospaced()).foregroundColor(.secondary)
                              Text(engine.sourcesUsed)
                                  .font(.caption2.monospaced())
                                  .foregroundColor(.secondary).lineLimit(1)
                          }
                      }
                      .padding(.horizontal, 10).padding(.vertical, 6)
                      .background(confidenceColor.opacity(0.15))
                      .overlay(RoundedRectangle(cornerRadius: 6).stroke(confidenceColor.opacity(0.4), lineWidth: 1))
                      .padding(.horizontal, 6).padding(.vertical, 3)
                  }
              }

              private var confidenceColor: Color {
                  switch engine.engineConfidence {
                  case 3: return .green
                  case 2: return .yellow
                  case 1: return .orange
                  default: return .gray
                  }
              }
              private var confidenceLabel: String {
                  switch engine.engineConfidence {
                  case 3: return "3/3"
                  case 2: return "2/3"
                  case 1: return "1/3"
                  default: return "?"
                  }
              }
              private var confidenceBadge: some View {
                  Text(confidenceLabel)
                      .font(.caption2.bold().monospaced())
                      .padding(.horizontal, 4).padding(.vertical, 0)
                      .background(confidenceColor.opacity(0.25))
                      .foregroundColor(confidenceColor)
                      .cornerRadius(3)
              }

              private var movesSection: some View {
                  VStack(alignment: .leading, spacing: 2) {
                      Divider().opacity(0.3)
                      ForEach(Array(engine.topMoves.enumerated()), id: \.element.id) { idx, m in
                          moveRow(rank: idx + 1, move: m)
                      }
                  }
                  .padding(.horizontal, 6).padding(.vertical, 3)
              }

