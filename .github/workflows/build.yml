                      Button { recorder.startNewGame(); aiReviewText = "" } label: { Label(language.isArabic ? "جديدة" : "New", systemImage: "arrow.clockwise").frame(maxWidth: .infinity).padding().background(Color.red.opacity(0.3)).cornerRadius(8) }
                  }
              }
              
              private func requestReview() {
                  guard !recorder.moves.isEmpty else { return }
                  isLoadingReview = true; aiReviewText = ""
                  Task {
                      do {
                          let r = try await GroqService.reviewGame(movesUCI: recorder.moves.map { $0.uci }, accuracy: recorder.currentAccuracy, blunders: recorder.blunderCount, mistakes: recorder.mistakeCount, isArabic: language.isArabic)
                          aiReviewText = r
                      } catch { aiReviewText = "⚠️ \(error.localizedDescription)" }
                      isLoadingReview = false
                  }
              }
          }

          struct HistoryView: View {
              @ObservedObject var recorder: GameRecorder
              @ObservedObject var language: AppLanguage
              @Environment(\.dismiss) var dismiss
              @State private var history: [GameHistoryEntry] = []
              var body: some View {
                  NavigationStack {
                      List {
                          if history.isEmpty { Text(language.isArabic ? "لا ألعاب" : "No games").foregroundColor(.secondary) }
                          else { ForEach(history) { e in
                              VStack(alignment: .leading, spacing: 4) {
                                  HStack { Text(e.date, style: .date).font(.caption); Spacer(); Text("\(Int(e.accuracy))%").font(.caption.bold()).foregroundColor(.green) }
                                  Text("\(e.moves.count) moves").font(.caption2).foregroundColor(.secondary)
                              }
                          }}
                      }
                      .navigationTitle(language.isArabic ? "السجل" : "History")
                      .toolbar {
                          ToolbarItem(placement: .topBarTrailing) { Button(language.isArabic ? "مسح" : "Clear", role: .destructive) { recorder.clearHistory(); history = [] } }
                          ToolbarItem(placement: .topBarLeading) { Button(language.isArabic ? "إغلاق" : "Close") { dismiss() } }
                      }
                      .onAppear { history = recorder.loadHistory() }
                  }
              }
          }
          '''

          for path, content in files.items():
              content = textwrap.dedent(content).strip() + "\n"
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f: f.write(content)
              print(f"  ✅ {path}")
          print(f"\nWrote Settings & Review")
          PYEOF

      - name: Generate Swift files (Part 10 - WebView)
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, textwrap
          files = {}

          files["Sources/ChessWebView.swift"] = r'''
          import SwiftUI
          import WebKit

          struct ChessWebView: UIViewRepresentable {
              @ObservedObject var engine: EngineViewModel
              @ObservedObject var router: AppRouter
              
              func makeCoordinator() -> Coordinator { Coordinator(engine: engine) }
              
              func makeUIView(context: Context) -> WKWebView {
                  let cc = WKUserContentController()
                  
                  if let js = Bundle.main.loadResource(named: "reader", ext: "js") {
                      let script = js.replacingOccurrences(of: "__BRIDGE_NAME__", with: StealthConfig.bridgeName)
                          .replacingOccurrences(of: "__READER_FLAG__", with: StealthConfig.readerFlag)
                          .replacingOccurrences(of: "__START_FUNC__", with: StealthConfig.startFuncName)
                          .replacingOccurrences(of: "__READER_INTERVAL__", with: "\(StealthConfig.readerInterval())")
                      cc.addUserScript(WKUserScript(source: script, injectionTime: .atDocumentEnd, forMainFrameOnly: false))
                  }
                  
                  if let css = Bundle.main.loadResource(named: "adblock_css", ext: "css") {
                      let inj = "(function(){var s=document.createElement('style');s.textContent=\(cssLit(css));document.documentElement.appendChild(s);})();"
                      cc.addUserScript(WKUserScript(source: inj, injectionTime: .atDocumentStart, forMainFrameOnly: false))
                  }
                  
                  cc.add(context.coordinator, name: StealthConfig.bridgeName)
                  
                  let cfg = WKWebViewConfiguration()
                  cfg.userContentController = cc
                  cfg.websiteDataStore = .default()
                  cfg.allowsInlineMediaPlayback = true
                  cfg.defaultWebpagePreferences.allowsContentJavaScript = true
                  
                  let wv = WKWebView(frame: .zero, configuration: cfg)
                  wv.navigationDelegate = context.coordinator
                  wv.uiDelegate = context.coordinator
                  wv.allowsBackForwardNavigationGestures = true
                  wv.customUserAgent = StealthConfig.randomUserAgent()
                  
                  if #available(iOS 16.4, *) { wv.isInspectable = false }
                  
                  wv.load(URLRequest(url: router.chessURL))
                  context.coordinator.webView = wv
                  context.coordinator.lastTrigger = router.navigateTrigger
                  
                  return wv
              }
              
              func updateUIView(_ v: WKWebView, context: Context) {
                  if router.navigateTrigger != context.coordinator.lastTrigger {
                      context.coordinator.lastTrigger = router.navigateTrigger
                      v.load(URLRequest(url: router.chessURL))
                  }
              }
              
              private func cssLit(_ s: String) -> String {
                  if let d = try? JSONSerialization.data(withJSONObject: [s]), let str = String(data: d, encoding: .utf8) {
                      return String(str.dropFirst().dropLast())
                  }
                  return "\"\""
              }
              
              final class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate, WKScriptMessageHandler {
                  let engine: EngineViewModel
                  weak var webView: WKWebView?
                  var lastTrigger = 0
                  
                  init(engine: EngineViewModel) { self.engine = engine }
                  
                  func userContentController(_ u: WKUserContentController, didReceive m: WKScriptMessage) {
                      guard m.name == StealthConfig.bridgeName, let d = m.body as? [String: Any] else { return }
                      
                      let p = EngineViewModel.BoardPayload(
                          grid: (d["grid"] as? String) ?? "",
                          sideToMove: (d["sideToMove"] as? String) ?? "w",
                          flipped: (d["flipped"] as? Bool) ?? false,
                          flippedConfident: (d["flippedConfident"] as? Bool) ?? false,
                          lastMoveUCI: (d["lastMoveUCI"] as? String) ?? "",
                          plyCount: (d["plyCount"] as? Int) ?? -1,
                          bottomColor: (d["bottomColor"] as? String) ?? ""
                      )
                      
                      Task { @MainActor in self.engine.ingest(p) }
                  }
                  
                  func webView(_ w: WKWebView, didFinish n: WKNavigation!) {
                      let js = "typeof window['\(StealthConfig.startFuncName)']==='function'&&window['\(StealthConfig.startFuncName)']();"
                      w.evaluateJavaScript(js, completionHandler: nil)
                  }
                  
                  func webView(_ w: WKWebView, createWebViewWith c: WKWebViewConfiguration, for a: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                      if let url = a.request.url { w.load(URLRequest(url: url)) }
                      return nil
                  }
              }
          }

          extension Bundle {
              func loadResource(named name: String, ext: String) -> String? {
                  if let url = url(forResource: name, withExtension: ext), let s = try? String(contentsOf: url) { return s }
                  return nil
              }
          }
          '''

          for path, content in files.items():
              content = textwrap.dedent(content).strip() + "\n"
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f: f.write(content)
              print(f"  ✅ {path}")
          print(f"\nWrote WebView")
          PYEOF

