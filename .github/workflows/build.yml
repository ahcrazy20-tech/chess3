      - name: Write reader.js
        run: |
          cat > Resources/reader.js <<'EOF'
          (function(){if(window.__ch_v3)return;window.__ch_v3=true;
          const PM={wp:'P',wn:'N',wb:'B',wr:'R',wq:'Q',wk:'K',bp:'p',bn:'n',bb:'b',br:'r',bq:'q',bk:'k'};
          const PN={king:'K',queen:'Q',rook:'R',bishop:'B',knight:'N',pawn:'P'};
          function fb(){return document.querySelector('wc-chess-board,chess-board,cg-board,.board-layout-chessboard');}
          function rg(b){const g=Array.from({length:8},()=>Array(8).fill('.'));
          const ns=b.querySelectorAll('.piece,piece,[data-piece]');if(!ns.length)return null;
          ns.forEach(n=>{let p=null,f=null,r=null;const c=(n.className||'').toString();
          c.split(/\s+/).forEach(x=>{if(PM[x])p=PM[x];});
          if(!p){const dp=n.getAttribute&&n.getAttribute('data-piece');if(dp&&PM[dp])p=PM[dp];}
          if(!p){const ps=c.toLowerCase().split(/\s+/);const co=ps.find(x=>x==='white'||x==='black');
          const na=ps.find(x=>PN[x]);if(co&&na){const l=PN[na];p=co==='white'?l:l.toLowerCase();}}
          c.split(/\s+/).forEach(x=>{const m=/^square-(\d)(\d)$/.exec(x);if(m){f=+m[1];r=+m[2];}});
          if(f===null){const ds=n.getAttribute&&n.getAttribute('data-square');
          if(ds&&ds.length===2){f=ds.charCodeAt(0)-96;r=parseInt(ds[1],10);}}
          if(f===null){const st=(n.getAttribute&&n.getAttribute('style'))||'';
          const m=/translate\(\s*(-?\d+(?:\.\d+)?)%?\s*,\s*(-?\d+(?:\.\d+)?)%?/.exec(st);
          if(m){const co=Math.round(parseFloat(m[1])/12.5),ro=Math.round(parseFloat(m[2])/12.5);
          if(co>=0&&co<=7&&ro>=0&&ro<=7){f=co+1;r=8-ro;}}}
          if(p&&f&&r&&r>=1&&r<=8&&f>=1&&f<=8){g[8-r][f-1]=p;}});return g;}
          function df(b){const s=[];let e=b;for(let i=0;i<6&&e;i++){if(e.classList&&e.classList.contains('flipped')){s.push(true);break;}e=e.parentElement;}
          if(b.hasAttribute('flipped'))s.push(true);const o=b.getAttribute('orientation');
          if(o==='black')s.push(true);if(o==='white')s.push(false);
          if(s.length===0)return null;const t=s.filter(x=>x===true).length,f=s.filter(x=>x===false).length;
          if(t===f)return null;return t>f;}
          function dp(){const pn=document.querySelectorAll('[data-ply]');
          if(pn.length){let m=-1;pn.forEach(n=>{const p=parseInt(n.getAttribute('data-ply'),10);if(!isNaN(p)&&p>m)m=p;});
          if(m>=0)return m;}return -1;}
          let pg=null,lp='',ls='w';
          function di(p,c){if(!p||!c)return null;const ch=[];for(let r=0;r<8;r++)for(let x=0;x<8;x++)
          if(p[r][x]!==c[r][x])ch.push({r,c:x,before:p[r][x],after:c[r][x]});
          if(ch.length<2||ch.length>4)return null;
          const t=ch.find(y=>y.after!=='.'&&y.after!==y.before);
          const f=ch.find(y=>y.before!=='.'&&y.after==='.');
          if(!t||!f)return null;
          const fr=String.fromCharCode(97+f.c)+(8-f.r),to=String.fromCharCode(97+t.c)+(8-t.r);
          const mc=t.after===t.after.toUpperCase()?'w':'b';return{uci:fr+to,movedColor:mc};}
          function tk(){const b=fb();if(!b)return;const g=rg(b);if(!g)return;
          let s=null,cf='low';const p=dp();if(p>=0){s=(p%2===0)?'w':'b';cf='high';}
          const m=di(pg,g);if(m&&!s){s=(m.movedColor==='w')?'b':'w';cf='low';}
          if(!s)s=ls;ls=s;const fr=df(b),fl=fr===null?false:fr;
          const gs=g.map(r=>r.join('')).join('');
          const py={grid:gs,sideToMove:s,flipped:fl,flippedConfident:fr!==null,
          lastMoveUCI:m?m.uci:'',plyCount:p,detectionConfidence:cf};
          const k=JSON.stringify(py);if(k!==lp){lp=k;try{window.webkit.messageHandlers.fenBridge.postMessage(py);}catch(e){}}pg=g;}
          window.__ch_startReader=function(){if(window.__ch_timer)return;window.__ch_timer=setInterval(tk,500);};
          const mo=new MutationObserver(()=>tk());try{mo.observe(document.documentElement,{childList:true,subtree:true,attributes:true});}catch(e){}
          window.__ch_startReader();})();
          EOF

