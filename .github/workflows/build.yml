      - name: Generate Swift files (Part 3 - Tablebase & Local Engine)
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, textwrap
          files = {}

          # ========== Enhanced Tablebase Service with Local Caching ==========
          files["Sources/TablebaseService.swift"] = r'''
          import Foundation

          struct TablebaseResult {
              enum Category: String { case win, draw, loss, unknown }
              let category: Category
              let dtm: Int?
              let dtz: Int?
              let bestMove: String?
              let wdl: Int?
              let allMoves: [(uci: String, category: Category, dtz: Int?)]
          }

          actor TablebaseService {
              static let shared = TablebaseService()
              private var cache: [String: TablebaseResult] = [:]
              private let maxCacheSize = 5000  // Large cache for endgames
              
              func probe(fen: String) async -> TablebaseResult? {
                  let key = normalizeFen(fen)
                  if let cached = cache[key] { return cached }
                  
                  let pieceCount = FenValidator.countPieces(fen)
                  guard pieceCount <= 7 else { return nil }
                  
                  // Try Lichess Tablebase API
                  if let result = await fetchLichess(fen: fen) {
                      cache[key] = result
                      trimCache()
                      return result
                  }
                  
                  return nil
              }
              
              private func fetchLichess(fen: String) async -> TablebaseResult? {
                  guard var comps = URLComponents(string: "https://tablebase.lichess.ovh/standard") else { return nil }
                  comps.queryItems = [URLQueryItem(name: "fen", value: fen)]
                  guard let url = comps.url else { return nil }
                  
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 8
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  
                  do {
                      let (data, resp) = try await URLSession.shared.data(for: req)
                      guard let http = resp as? HTTPURLResponse, http.statusCode == 200 else { return nil }
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      return parseResult(json)
                  } catch { return nil }
              }
              
              private func parseResult(_ json: [String: Any]) -> TablebaseResult {
                  let catStr = (json["category"] as? String) ?? "unknown"
                  let category: TablebaseResult.Category
                  switch catStr {
                  case "win": category = .win
                  case "maybe-win", "cursed-win": category = .win
                  case "draw", "blessed-loss": category = .draw
                  case "loss", "maybe-loss": category = .loss
                  default: category = .unknown
                  }
                  
                  let dtm = json["dtm"] as? Int
                  let dtz = json["dtz"] as? Int
                  let wdl = json["wdl"] as? Int
                  
                  var bestMove: String? = nil
                  var allMoves: [(String, TablebaseResult.Category, Int?)] = []
                  
                  if let moves = json["moves"] as? [[String: Any]] {
                      for move in moves {
                          if let uci = move["uci"] as? String {
                              let mCat: TablebaseResult.Category
                              let mCatStr = (move["category"] as? String) ?? "unknown"
                              switch mCatStr {
                              case "win", "maybe-win", "cursed-win": mCat = .win
                              case "draw", "blessed-loss": mCat = .draw
                              case "loss", "maybe-loss": mCat = .loss
                              default: mCat = .unknown
                              }
                              let mDtz = move["dtz"] as? Int
                              allMoves.append((uci, mCat, mDtz))
                              if bestMove == nil { bestMove = uci }
                          }
                      }
                  }
                  
                  return TablebaseResult(category: category, dtm: dtm, dtz: dtz, bestMove: bestMove, wdl: wdl, allMoves: allMoves)
              }
              
              private func normalizeFen(_ fen: String) -> String {
                  let parts = fen.split(separator: " ").map(String.init)
                  if parts.count >= 4 { return "\(parts[0]) \(parts[1]) \(parts[2]) \(parts[3])" }
                  return fen
              }
              
              private func trimCache() {
                  if cache.count > maxCacheSize {
                      let keysToRemove = Array(cache.keys.prefix(cache.count - maxCacheSize + 500))
                      for key in keysToRemove { cache.removeValue(forKey: key) }
                  }
              }
              
              func clearCache() { cache.removeAll() }
              func cacheCount() -> Int { cache.count }
          }
          '''

          # ========== Local Stockfish Engine using WKWebView ==========
          files["Sources/LocalEngine.swift"] = r'''
          import Foundation
          import WebKit
          import UIKit

          struct LocalEngineResult {
              let bestMove: String
              let ponder: String?
              let evaluation: Int  // centipawns
              let mateIn: Int?
              let depth: Int
              let pv: [String]
              let nodes: Int
              let time: Int  // ms
          }

          @MainActor
          final class LocalEngine: NSObject, ObservableObject {
              static let shared = LocalEngine()
              
              @Published var isReady = false
              @Published var isAnalyzing = false
              @Published var currentDepth = 0
              @Published var lastResult: LocalEngineResult?
              
              private var webView: WKWebView?
              private var analysisCallback: ((LocalEngineResult) -> Void)?
              private var bestMoveCallback: ((String) -> Void)?
              
              override private init() {
                  super.init()
              }
              
              func initialize() {
                  guard webView == nil else { return }
                  
                  let config = WKWebViewConfiguration()
                  let cc = WKUserContentController()
                  cc.add(self, name: StealthConfig.engineBridge)
                  config.userContentController = cc
                  config.websiteDataStore = .default()
                  config.defaultWebpagePreferences.allowsContentJavaScript = true
                  
                  let wv = WKWebView(frame: CGRect(x: 0, y: 0, width: 320, height: 200), configuration: config)
                  wv.isHidden = true
                  
                  // CRITICAL FIX: attach the webview to the app window so its JS
                  // timers/Worker keep running (a detached webview is throttled).
                  attachToWindow(wv)
                  
                  let html = createEngineHTML()
                  wv.loadHTMLString(html, baseURL: nil)
                  
                  webView = wv
                  
                  DispatchQueue.main.asyncAfter(deadline: .now() + 2.5) { [weak self] in
                      self?.isReady = true
                  }
              }
              
              private func attachToWindow(_ wv: WKWebView) {
                  guard let scene = UIApplication.shared.connectedScenes
                          .compactMap({ $0 as? UIWindowScene })
                          .first(where: { $0.activationState == .foregroundActive }),
                        let window = scene.windows.first else { return }
                  window.addSubview(wv)
                  wv.frame = CGRect(x: -400, y: -400, width: 320, height: 200)
                  wv.layer.zPosition = -999
              }
              
              func analyze(fen: String, depth: Int = 22, multiPV: Int = 3, onResult: @escaping (LocalEngineResult) -> Void) {
                  guard isReady, let wv = webView else { return }
                  
                  isAnalyzing = true
                  currentDepth = 0
                  analysisCallback = onResult
                  
                  let js = "analyzePosition('\(fen)', \(depth), \(multiPV));"
                  wv.evaluateJavaScript(js, completionHandler: nil)
              }
              
              func stop() {
                  guard let wv = webView else { return }
                  wv.evaluateJavaScript("stopAnalysis();", completionHandler: nil)
                  isAnalyzing = false
              }
              
              func getBestMove(fen: String, depth: Int = 20, callback: @escaping (String) -> Void) {
                  guard isReady, let wv = webView else { return }
                  bestMoveCallback = callback
                  wv.evaluateJavaScript("getBestMove('\(fen)', \(depth));", completionHandler: nil)
              }
              
              private func createEngineHTML() -> String {
                  return """
                  <!DOCTYPE html>
                  <html>
                  <head>
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <script>
                  var engine = null;
                  var analyzing = false;
                  var currentPV = [];
                  var lastInfo = {};
                  var bootTimer = null;
                  
                  function initEngine() {
                      try {
                          // Load Stockfish.js from CDN
                          engine = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
                          
                          engine.onmessage = function(e) {
                              var line = e.data;
                              processEngineLine(line);
                          };
                          
                          engine.postMessage('uci');
                          engine.postMessage('setoption name Threads value 1');
                          engine.postMessage('setoption name Hash value 32');
                          engine.postMessage('setoption name MultiPV value 3');
                          engine.postMessage('isready');
                          
                          bootTimer = setTimeout(function() {
                              sendToSwift({type: 'ready'});
                          }, 1500);
                      } catch(e) {
                          sendToSwift({type: 'error', message: e.toString()});
                      }
                  }
                  
                  function processEngineLine(line) {
                      if (typeof line !== 'string') { try { line = line.data || ''; } catch(e){} }
                      if (typeof line !== 'string') return;
                      if (line.indexOf('bestmove') === 0) {
                          var parts = line.split(' ');
                          var bestMove = parts[1] || '';
                          var ponder = parts[3] || null;
                          sendToSwift({
                              type: 'bestmove',
                              bestMove: bestMove,
                              ponder: ponder,
                              depth: lastInfo.depth || 0,
                              eval: lastInfo.cp || 0,
                              mate: lastInfo.mate || null,
                              pv: lastInfo.pv || [],
                              nodes: lastInfo.nodes || 0,
                              time: lastInfo.time || 0
                          });
                          analyzing = false;
                      }
                      else if (line.indexOf('info depth') !== -1) {
                          var info = parseInfo(line);
                          lastInfo = info;
                          sendToSwift({
                              type: 'info',
                              depth: info.depth,
                              eval: info.cp,
                              mate: info.mate,
                              pv: info.pv,
                              nodes: info.nodes,
                              time: info.time,
                              multipv: info.multipv
                          });
                      }
                  }
                  
                  function parseInfo(line) {
                      var info = {};
                      var depthMatch = line.match(/depth (\\d+)/);
                      var cpMatch = line.match(/score cp (-?\\d+)/);
                      var mateMatch = line.match(/score mate (-?\\d+)/);
                      var pvMatch = line.match(/pv (.+)/);
                      var nodesMatch = line.match(/nodes (\\d+)/);
                      var timeMatch = line.match(/time (\\d+)/);
                      var multipvMatch = line.match(/multipv (\\d+)/);
                      
                      if (depthMatch) info.depth = parseInt(depthMatch[1]);
                      if (cpMatch) info.cp = parseInt(cpMatch[1]);
                      if (mateMatch) info.mate = parseInt(mateMatch[1]);
                      if (pvMatch) info.pv = pvMatch[1].split(' ');
                      if (nodesMatch) info.nodes = parseInt(nodesMatch[1]);
                      if (timeMatch) info.time = parseInt(timeMatch[1]);
                      if (multipvMatch) info.multipv = parseInt(multipvMatch[1]);
                      
                      return info;
                  }
                  
                  function analyzePosition(fen, depth, multiPV) {
                      if (!engine) return;
                      analyzing = true;
                      lastInfo = {};
                      engine.postMessage('stop');
                      engine.postMessage('setoption name MultiPV value ' + multiPV);
                      engine.postMessage('position fen ' + fen);
                      engine.postMessage('go depth ' + depth);
                  }
                  
                  function getBestMove(fen, depth) {
                      if (!engine) return;
                      lastInfo = {};
                      engine.postMessage('stop');
                      engine.postMessage('setoption name MultiPV value 1');
                      engine.postMessage('position fen ' + fen);
                      engine.postMessage('go depth ' + depth);
                  }
                  
                  function stopAnalysis() {
                      if (engine) engine.postMessage('stop');
                      analyzing = false;
                  }
                  
                  function sendToSwift(obj) {
                      try {
                          window.webkit.messageHandlers.\(StealthConfig.engineBridge).postMessage(obj);
                      } catch(e) {}
                  }
                  
                  window.onload = initEngine;
                  </script>
                  </head>
                  <body></body>
                  </html>
                  """
              }
          }

          extension LocalEngine: WKScriptMessageHandler {
              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  guard let dict = message.body as? [String: Any] else { return }
                  let type = dict["type"] as? String ?? ""
                  
                  switch type {
                  case "ready":
                      self.isReady = true
                      
                  case "info":
                      self.currentDepth = dict["depth"] as? Int ?? 0
                      
                  case "bestmove":
                      let bestMove = dict["bestMove"] as? String ?? ""
                      let ponder = dict["ponder"] as? String
                      let depth = dict["depth"] as? Int ?? 0
                      let evalVal = dict["eval"] as? Int ?? 0
                      let mate = dict["mate"] as? Int
                      let pv = dict["pv"] as? [String] ?? []
                      let nodes = dict["nodes"] as? Int ?? 0
                      let time = dict["time"] as? Int ?? 0
                      
                      let result = LocalEngineResult(
                          bestMove: bestMove, ponder: ponder, evaluation: evalVal,
                          mateIn: mate, depth: depth, pv: pv, nodes: nodes, time: time
                      )
                      
                      self.lastResult = result
                      self.isAnalyzing = false
                      
                      self.analysisCallback?(result)
                      self.bestMoveCallback?(bestMove)
                      
                      self.analysisCallback = nil
                      self.bestMoveCallback = nil
                      
                  case "error":
                      let msg = dict["message"] as? String ?? "unknown"
                      print("Engine error: \(msg)")
                      
                  default:
                      break
                  }
              }
          }
          '''

          for path, content in files.items():
              content = textwrap.dedent(content).strip() + "\n"
              os.makedirs(os.path.dirname(path), exist_ok=True)
