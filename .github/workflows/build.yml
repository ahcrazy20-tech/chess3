          files["Sources/ChessWebView.swift"] = r'''
          import SwiftUI
          import WebKit

          struct ChessWebView: UIViewRepresentable {
              @ObservedObject var engine: EngineViewModel
              @ObservedObject var router: AppRouter
              func makeCoordinator() -> Coordinator { Coordinator(engine: engine) }
              func makeUIView(context: Context) -> WKWebView {
                  let cc = WKUserContentController()
                  if let jsTemplate = Bundle.main.loadResource(named: "reader", ext: "js") {
                      let js = jsTemplate
                          .replacingOccurrences(of: "__BRIDGE_NAME__", with: StealthConfig.bridgeName)
                          .replacingOccurrences(of: "__READER_FLAG__", with: StealthConfig.readerFlag)
                          .replacingOccurrences(of: "__START_FUNC__", with: StealthConfig.startFuncName)
                          .replacingOccurrences(of: "__READER_INTERVAL__", with: "\(StealthConfig.readerInterval())")
                      cc.addUserScript(WKUserScript(source: js, injectionTime: .atDocumentEnd, forMainFrameOnly: false))
                  }
                  if let css = Bundle.main.loadResource(named: "adblock_css", ext: "css") {
                      let injector = "(function(){var s=document.createElement('style');s.textContent=\(cssLit(css));document.documentElement.appendChild(s);})();"
                      cc.addUserScript(WKUserScript(source: injector, injectionTime: .atDocumentStart, forMainFrameOnly: false))
                  }
                  cc.add(context.coordinator, name: StealthConfig.bridgeName)
                  let cfg = WKWebViewConfiguration()
                  cfg.userContentController = cc
                  cfg.websiteDataStore = .default()
                  cfg.allowsInlineMediaPlayback = true
                  cfg.mediaTypesRequiringUserActionForPlayback = []
                  cfg.defaultWebpagePreferences.allowsContentJavaScript = true
                  let wv = WKWebView(frame: .zero, configuration: cfg)
                  wv.navigationDelegate = context.coordinator
                  wv.uiDelegate = context.coordinator
                  wv.allowsBackForwardNavigationGestures = true
                  wv.customUserAgent = StealthConfig.randomUserAgent()
                  if #available(iOS 16.4, *) { wv.isInspectable = false }
                  wv.load(URLRequest(url: router.chessURL))
                  context.coordinator.webView = wv
                  context.coordinator.lastTrigger = router.navigateTrigger
                  return wv
              }
              func updateUIView(_ v: WKWebView, context: Context) {
                  if router.navigateTrigger != context.coordinator.lastTrigger {
                      context.coordinator.lastTrigger = router.navigateTrigger
                      v.load(URLRequest(url: router.chessURL))
                  }
              }
              private func cssLit(_ s: String) -> String {
                  let d = try? JSONSerialization.data(withJSONObject: [s])
                  if let d = d, let str = String(data: d, encoding: .utf8) {
                      return String(str.dropFirst().dropLast())
                  }
                  return "\"\""
              }
              final class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate, WKScriptMessageHandler {
                  let engine: EngineViewModel
                  weak var webView: WKWebView?
                  var lastTrigger = 0
                  init(engine: EngineViewModel) { self.engine = engine }
                  func userContentController(_ u: WKUserContentController, didReceive m: WKScriptMessage) {
                      guard m.name == StealthConfig.bridgeName, let d = m.body as? [String: Any] else { return }
                      let p = EngineViewModel.BoardPayload(
                          grid: (d["grid"] as? String) ?? "",
                          sideToMove: (d["sideToMove"] as? String) ?? "w",
                          flipped: (d["flipped"] as? Bool) ?? false,
                          flippedConfident: (d["flippedConfident"] as? Bool) ?? false,
                          lastMoveUCI: (d["lastMoveUCI"] as? String) ?? "",
                          plyCount: (d["plyCount"] as? Int) ?? -1,
                          detectionConfidence: (d["detectionConfidence"] as? String) ?? "unknown",
                          bottomColor: (d["bottomColor"] as? String) ?? ""
                      )
                      Task { @MainActor [weak engine] in engine?.ingest(p) }
                  }
                  func webView(_ w: WKWebView, didFinish n: WKNavigation!) {
                      let js = "typeof window['\(StealthConfig.startFuncName)']==='function'&&window['\(StealthConfig.startFuncName)']();"
                      w.evaluateJavaScript(js, completionHandler: nil)
                  }
                  func webView(_ w: WKWebView, createWebViewWith c: WKWebViewConfiguration,
                               for a: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                      if let url = a.request.url { w.load(URLRequest(url: url)) }
                      return nil
                  }
              }
          }
          extension Bundle {
              func loadResource(named name: String, ext: String) -> String? {
                  if let url = url(forResource: name, withExtension: ext),
                     let s = try? String(contentsOf: url) { return s }
                  return nil
              }
          }
          '''

          for path, content in files.items():
              content = textwrap.dedent(content).strip() + "\n"
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f: f.write(content)
              print(f"  ✅ {path}")
          print(f"\nWrote {len(files)} Swift files")
          PYEOF

