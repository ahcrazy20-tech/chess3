                  NavigationStack {
                      ScrollView {
                          VStack(spacing: 12) { statsCard; accuracyBar; qualityBreakdown; aiReviewButton; if !aiReviewText.isEmpty { aiReviewCard }; movesListCard; actionButtons }
                          .padding()
                      }
                      .navigationTitle(language.isArabic ? "المراجعة" : "Review")
                      .toolbar { ToolbarItem(placement: .topBarTrailing) { Button { showHistory = true } label: { Image(systemName: "clock.arrow.circlepath") } } }
                      .sheet(isPresented: $showHistory) { HistoryView(recorder: recorder, language: language) }
                  }
              }
              private var statsCard: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      HStack { Image(systemName: "chart.bar.fill").foregroundColor(.green); Text(language.isArabic ? "إحصائيات اللعبة" : "Game Stats").font(.headline); Spacer(); Text("\(recorder.moves.count) " + (language.isArabic ? "نقلة" : "moves")).font(.caption).foregroundColor(.secondary) }
                      HStack(spacing: 20) { statItem(value: "\(recorder.myMoveCount)", label: language.isArabic ? "نقلاتك" : "Your moves", color: .blue); statItem(value: "\(recorder.moves.count - recorder.myMoveCount)", label: language.isArabic ? "الخصم" : "Opponent", color: .gray) }
                  }.padding().background(Color.gray.opacity(0.15)).cornerRadius(12)
              }
              private func statItem(value: String, label: String, color: Color) -> some View {
                  VStack(alignment: .leading, spacing: 2) { Text(value).font(.title2.bold()).foregroundColor(color); Text(label).font(.caption).foregroundColor(.secondary) }
              }
              private var accuracyBar: some View {
                  VStack(alignment: .leading, spacing: 6) {
                      HStack { Text(language.isArabic ? "الدقة" : "Accuracy").font(.subheadline.bold()); Spacer(); Text("\(Int(recorder.currentAccuracy))%").font(.title.bold()).foregroundColor(accuracyColor) }
                      GeometryReader { geo in ZStack(alignment: .leading) { RoundedRectangle(cornerRadius: 6).fill(Color.gray.opacity(0.3)); RoundedRectangle(cornerRadius: 6).fill(accuracyColor).frame(width: geo.size.width * CGFloat(recorder.currentAccuracy / 100)) } }.frame(height: 12)
                  }.padding().background(Color.gray.opacity(0.15)).cornerRadius(12)
              }
              private var accuracyColor: Color { if recorder.currentAccuracy >= 90 { return .green }; if recorder.currentAccuracy >= 75 { return .yellow }; if recorder.currentAccuracy >= 60 { return .orange }; return .red }
              private var qualityBreakdown: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      Text(language.isArabic ? "تفاصيل جودة النقلات" : "Move Quality").font(.subheadline.bold())
                      qualityRow(icon: "✨", label: language.isArabic ? "رائعة" : "Brilliant", count: recorder.brilliantCount, color: .cyan)
                      qualityRow(icon: "⭐", label: language.isArabic ? "أفضل" : "Best", count: recorder.bestCount, color: .green)
                      qualityRow(icon: "✓", label: language.isArabic ? "جيدة" : "Good", count: recorder.goodCount, color: Color.green.opacity(0.7))
                      qualityRow(icon: "?!", label: language.isArabic ? "غير دقيقة" : "Inaccuracy", count: recorder.inaccuracyCount, color: .yellow)
                      qualityRow(icon: "?", label: language.isArabic ? "خطأ" : "Mistake", count: recorder.mistakeCount, color: .orange)
                      qualityRow(icon: "??", label: language.isArabic ? "خطأ فادح" : "Blunder", count: recorder.blunderCount, color: .red)
                  }.padding().background(Color.gray.opacity(0.15)).cornerRadius(12)
              }
              private func qualityRow(icon: String, label: String, count: Int, color: Color) -> some View {
                  HStack { Text(icon).frame(width: 30); Text(label).font(.caption); Spacer(); Text("\(count)").font(.caption.bold()).foregroundColor(color) }.padding(.vertical, 2)
              }
              private var aiReviewButton: some View {
                  Button { requestAIReview() } label: {
                      HStack {
                          if isLoadingReview { ProgressView().scaleEffect(0.7); Text(language.isArabic ? "جاري التحليل..." : "Analyzing...").font(.subheadline.bold()) }
                          else { Image(systemName: "sparkles"); Text(language.isArabic ? "طلب تحليل AI للعبة" : "Request AI Game Review").font(.subheadline.bold()) }
                      }.frame(maxWidth: .infinity).padding().background(Color.purple.opacity(0.3)).foregroundColor(.purple).cornerRadius(10)
                  }.disabled(isLoadingReview || recorder.moves.isEmpty)
              }
              private var aiReviewCard: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      HStack { Image(systemName: "sparkles").foregroundColor(.purple); Text(language.isArabic ? "تحليل AI" : "AI Review").font(.headline) }
                      Text(aiReviewText).font(.callout).foregroundColor(.white.opacity(0.9)).fixedSize(horizontal: false, vertical: true)
                  }.padding().background(Color.purple.opacity(0.15)).cornerRadius(12)
              }
              private var movesListCard: some View {
                  VStack(alignment: .leading, spacing: 6) {
                      Text(language.isArabic ? "قائمة النقلات" : "Move List").font(.subheadline.bold())
                      if recorder.moves.isEmpty { Text(language.isArabic ? "لا توجد نقلات بعد" : "No moves yet").font(.caption).foregroundColor(.secondary).padding() }
                      else { ForEach(recorder.moves) { move in moveRow(move) } }
                  }.padding().background(Color.gray.opacity(0.15)).cornerRadius(12)
              }
              private func moveRow(_ move: GameRecorder.MoveRecord) -> some View {
                  HStack {
                      Text("\(move.ply).").font(.caption.monospaced()).foregroundColor(.secondary).frame(width: 30)
                      Text(move.san.isEmpty ? move.uci : move.san).font(.callout.bold()).foregroundColor(move.wasMyMove ? .white : .gray)
                      Spacer(); qualityBadge(move.quality)
                      if move.cpLoss >= 30 { Text("-\(move.cpLoss)").font(.caption2.monospaced()).foregroundColor(.orange) }
                      if let alt = move.bestAlternative, alt != move.uci { Text("→ \(alt)").font(.caption2.monospaced()).foregroundColor(.green) }
                  }.padding(.vertical, 2)
              }
              private func qualityBadge(_ q: String) -> some View {
                  let (label, color): (String, Color) = { switch q { case "brilliant": return ("!!", .cyan); case "best": return ("⭐", .green); case "good": return ("✓", .green.opacity(0.7)); case "inaccuracy": return ("?!", .yellow); case "mistake": return ("?", .orange); case "blunder": return ("??", .red); default: return ("", .gray) } }()
                  return Text(label).font(.caption.bold()).foregroundColor(color).padding(.horizontal, 6).padding(.vertical, 2).background(color.opacity(0.2)).cornerRadius(4)
              }
              private var actionButtons: some View {
                  HStack(spacing: 8) {
                      Button { recorder.saveCurrentGame(); HapticManager.success() } label: { Label(language.isArabic ? "حفظ" : "Save", systemImage: "square.and.arrow.down").frame(maxWidth: .infinity).padding().background(Color.blue.opacity(0.3)).cornerRadius(8) }
                      Button { recorder.startNewGame(); aiReviewText = ""; HapticManager.selection() } label: { Label(language.isArabic ? "لعبة جديدة" : "New Game", systemImage: "arrow.clockwise").frame(maxWidth: .infinity).padding().background(Color.red.opacity(0.3)).cornerRadius(8) }
                  }
              }
              private func requestAIReview() {
                  guard !recorder.moves.isEmpty else { return }; isLoadingReview = true; aiReviewText = ""
                  let movesUCI = recorder.moves.map { $0.uci }
                  Task {
                      do { let r = try await GroqService.reviewGame(movesUCI: movesUCI, accuracy: recorder.currentAccuracy, blunders: recorder.blunderCount, mistakes: recorder.mistakeCount, isArabic: language.isArabic); await MainActor.run { aiReviewText = r; isLoadingReview = false } }
                      catch { await MainActor.run { aiReviewText = "⚠️ \(error.localizedDescription)"; isLoadingReview = false } }
                  }
              }
          }
          struct HistoryView: View {
              @ObservedObject var recorder: GameRecorder
