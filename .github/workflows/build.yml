          files["Sources/FenValidator.swift"] = r'''
          import Foundation
          enum FenValidator {
              static func validate(_ fen: String) -> String? {
                  let parts = fen.split(separator: " ").map(String.init)
                  guard parts.count >= 4 else { return "not enough FEN fields" }
                  let ranks = parts[0].split(separator: "/").map(String.init)
                  guard ranks.count == 8 else { return "not 8 ranks" }
                  var whiteKings = 0, blackKings = 0, totalPieces = 0
                  for rank in ranks {
                      var count = 0
                      for ch in rank {
                          if let d = ch.wholeNumberValue { count += d }
                          else {
                              count += 1
                              totalPieces += 1
                              if ch == "K" { whiteKings += 1 }
                              if ch == "k" { blackKings += 1 }
                          }
                      }
                      if count != 8 { return "rank has \(count) squares" }
                  }
                  if whiteKings != 1 { return "\(whiteKings) white kings" }
                  if blackKings != 1 { return "\(blackKings) black kings" }
                  if totalPieces < 4 { return "only \(totalPieces) pieces" }
                  if totalPieces > 32 { return "\(totalPieces) pieces (invalid)" }
                  return nil
              }
          }
          '''

          files["Sources/FenBuilder.swift"] = r'''
          import Foundation

          @MainActor
          final class FenBuilder {
              private var knownWhiteKingMoved = false
              private var knownBlackKingMoved = false
              private var knownWhiteRookA1Moved = false
              private var knownWhiteRookH1Moved = false
              private var knownBlackRookA8Moved = false
              private var knownBlackRookH8Moved = false
              private var lastEP: String? = nil
              private var halfmoveClock: Int = 0
              private var lastGrid: [[Character]]? = nil
              private var lastPly: Int = -1

              func reset() {
                  knownWhiteKingMoved = false; knownBlackKingMoved = false
                  knownWhiteRookA1Moved = false; knownWhiteRookH1Moved = false
                  knownBlackRookA8Moved = false; knownBlackRookH8Moved = false
                  lastEP = nil; halfmoveClock = 0; lastGrid = nil; lastPly = -1
              }

              func build(grid: [[Character]], sideToMove: String, plyCount: Int) -> String {
                  if isStartingPosition(grid) {
                      reset()
                      lastGrid = grid; lastPly = plyCount
                  } else {
                      if let old = lastGrid, plyCount >= lastPly && plyCount <= lastPly + 2 {
                          detectMoveAndUpdate(oldGrid: old, newGrid: grid)
                      }
                      lastGrid = grid; lastPly = plyCount
                  }
                  let boardFen = buildBoardFen(from: grid)
                  let castling = deriveCastling(from: grid)
                  let ep = lastEP ?? "-"
                  let fullmove = max(1, (plyCount / 2) + 1)
                  return "\(boardFen) \(sideToMove) \(castling) \(ep) \(halfmoveClock) \(fullmove)"
              }

              private func detectMoveAndUpdate(oldGrid: [[Character]], newGrid: [[Character]]) {
                  var changes: [(row: Int, col: Int, before: Character, after: Character)] = []
                  for r in 0..<8 { for c in 0..<8 {
                      if oldGrid[r][c] != newGrid[r][c] {
                          changes.append((r, c, oldGrid[r][c], newGrid[r][c]))
                      }
                  }}
                  guard !changes.isEmpty else { return }
                  for change in changes {
                      if change.before == "K" && change.after == "." && change.row == 7 && change.col == 4 { knownWhiteKingMoved = true }
                      if change.before == "k" && change.after == "." && change.row == 0 && change.col == 4 { knownBlackKingMoved = true }
                  }
                  for change in changes {
                      if change.before == "R" && change.after == "." {
                          if change.row == 7 && change.col == 0 { knownWhiteRookA1Moved = true }
                          if change.row == 7 && change.col == 7 { knownWhiteRookH1Moved = true }
                      }
                      if change.before == "r" && change.after == "." {
                          if change.row == 0 && change.col == 0 { knownBlackRookA8Moved = true }
                          if change.row == 0 && change.col == 7 { knownBlackRookH8Moved = true }
                      }
                      if change.after != "." && change.before != change.after {
                          if change.row == 7 && change.col == 0 { knownWhiteRookA1Moved = true }
                          if change.row == 7 && change.col == 7 { knownWhiteRookH1Moved = true }
                          if change.row == 0 && change.col == 0 { knownBlackRookA8Moved = true }
                          if change.row == 0 && change.col == 7 { knownBlackRookH8Moved = true }
                      }
                  }
                  lastEP = nil
                  let fromSq = changes.first { $0.before != "." && $0.after == "." }
                  let toSq = changes.first { $0.after != "." && $0.after != $0.before }
                  if let from = fromSq, let to = toSq {
                      let piece = to.after
                      let rowDiff = abs(from.row - to.row)
                      if (piece == "P" || piece == "p") && rowDiff == 2 && from.col == to.col {
                          let epRow = (from.row + to.row) / 2
                          lastEP = squareName(row: epRow, col: to.col)
                      }
                      let isPawnMove = piece == "P" || piece == "p"
                      let isCapture = changes.contains { $0.before != "." && $0.after != "." && $0.before != $0.after }
                      halfmoveClock = (isPawnMove || isCapture) ? 0 : (halfmoveClock + 1)
                  }
              }

              private func isStartingPosition(_ grid: [[Character]]) -> Bool {
                  guard grid.count == 8 else { return false }
                  return String(grid[0]) == "rnbqkbnr" && String(grid[1]) == "pppppppp"
                      && String(grid[6]) == "PPPPPPPP" && String(grid[7]) == "RNBQKBNR"
              }

              private func buildBoardFen(from grid: [[Character]]) -> String {
                  var rows: [String] = []
                  for r in 0..<8 {
                      var row = ""; var empty = 0
                      for c in 0..<8 {
                          let ch = grid[r][c]
                          if ch == "." { empty += 1 }
                          else { if empty > 0 { row += "\(empty)"; empty = 0 }; row.append(ch) }
                      }
                      if empty > 0 { row += "\(empty)" }
                      rows.append(row)
                  }
                  return rows.joined(separator: "/")
              }

              private func deriveCastling(from grid: [[Character]]) -> String {
                  var s = ""
                  if !knownWhiteKingMoved && !knownWhiteRookH1Moved && grid[7][4] == "K" && grid[7][7] == "R" { s += "K" }
                  if !knownWhiteKingMoved && !knownWhiteRookA1Moved && grid[7][4] == "K" && grid[7][0] == "R" { s += "Q" }
                  if !knownBlackKingMoved && !knownBlackRookH8Moved && grid[0][4] == "k" && grid[0][7] == "r" { s += "k" }
                  if !knownBlackKingMoved && !knownBlackRookA8Moved && grid[0][4] == "k" && grid[0][0] == "r" { s += "q" }
                  return s.isEmpty ? "-" : s
              }

              private func squareName(row: Int, col: Int) -> String {
                  let file = Character(UnicodeScalar(97 + col)!)
                  let rank = 8 - row
                  return "\(file)\(rank)"
              }
          }
          '''

          files["Sources/OverlayPosition.swift"] = r'''
          import SwiftUI

          @MainActor
          final class OverlayPosition: ObservableObject {
              @Published var offset: CGSize = .zero
              @Published var isCompact: Bool = false
              @Published var transparency: Double = 0.85

              private let offsetXKey = "overlay_offset_x_v5"
              private let offsetYKey = "overlay_offset_y_v5"
              private let compactKey = "overlay_compact_v5"
              private let transparencyKey = "overlay_transparency_v5"

              init() {
                  let x = UserDefaults.standard.double(forKey: offsetXKey)
                  let y = UserDefaults.standard.double(forKey: offsetYKey)
                  offset = CGSize(width: x, height: y)
                  isCompact = UserDefaults.standard.bool(forKey: compactKey)
                  let t = UserDefaults.standard.double(forKey: transparencyKey)
                  transparency = t > 0 ? t : 0.85
              }
              func save() {
                  UserDefaults.standard.set(offset.width, forKey: offsetXKey)
                  UserDefaults.standard.set(offset.height, forKey: offsetYKey)
                  UserDefaults.standard.set(isCompact, forKey: compactKey)
                  UserDefaults.standard.set(transparency, forKey: transparencyKey)
              }
              func reset() {
                  offset = .zero; isCompact = false; transparency = 0.85; save()
              }
          }

          @MainActor
          final class AIOverlayPosition: ObservableObject {
              @Published var offset: CGSize = CGSize(width: 0, height: -220)
              @Published var isVisible: Bool = false
              @Published var isChatMode: Bool = false

              private let offsetXKey = "ai_offset_x_v5"
              private let offsetYKey = "ai_offset_y_v5"

              init() {
                  let x = UserDefaults.standard.double(forKey: offsetXKey)
                  let y = UserDefaults.standard.double(forKey: offsetYKey)
                  if x != 0 || y != 0 {
                      offset = CGSize(width: x, height: y)
                  }
              }
              func save() {
                  UserDefaults.standard.set(offset.width, forKey: offsetXKey)
                  UserDefaults.standard.set(offset.height, forKey: offsetYKey)
              }
              func reset() {
                  offset = CGSize(width: 0, height: -220); save()
              }
          }
          '''

          files["Sources/AnalysisCache.swift"] = r'''
          import Foundation
          actor AnalysisCache {
              static let shared = AnalysisCache()
              private struct Entry {
                  let moves: [TopMove]
                  let depth: Int
                  let sources: String
                  let confidence: Int
              }
              private var cache: [String: Entry] = [:]
              private var accessOrder: [String] = []
              private let maxEntries = 200
              func get(fen: String) -> (moves: [TopMove], depth: Int, sources: String, confidence: Int)? {
                  guard let entry = cache[fen] else { return nil }
                  accessOrder.removeAll { $0 == fen }
                  accessOrder.append(fen)
                  return (entry.moves, entry.depth, entry.sources, entry.confidence)
              }
              func set(fen: String, moves: [TopMove], depth: Int, sources: String, confidence: Int) {
                  cache[fen] = Entry(moves: moves, depth: depth, sources: sources, confidence: confidence)
                  accessOrder.removeAll { $0 == fen }
                  accessOrder.append(fen)
                  while accessOrder.count > maxEntries {
                      let oldest = accessOrder.removeFirst()
                      cache.removeValue(forKey: oldest)
                  }
              }
              func clear() { cache.removeAll(); accessOrder.removeAll() }
              func count() -> Int { cache.count }
          }
