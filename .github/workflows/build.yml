name: Build ChessHelper v5.3

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Clean & prepare
        run: |
          rm -rf Sources Resources ChessHelper.xcodeproj build Payload
          mkdir -p Sources Resources

      - name: Write project.yml
        run: |
          cat > project.yml <<'EOF'
          name: ChessHelper
          options:
            bundleIdPrefix: com.chesshelper
            deploymentTarget: { iOS: "16.0" }
            createIntermediateGroups: true
          settings:
            base:
              MARKETING_VERSION: "5.3.0"
              CURRENT_PROJECT_VERSION: "53"
              SWIFT_VERSION: "5.9"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              TARGETED_DEVICE_FAMILY: "1,2"
          targets:
            ChessHelper:
              type: application
              platform: iOS
              sources:
                - { path: Sources, excludes: [Engine] }
                - { path: Sources/Engine/src, compilerFlags: "-std=c++17 -O3 -DNDEBUG -DIS_64BIT -DUSE_NEON -DUSE_POPCNT -DNNUE_EMBEDDING_OFF" }
                - { path: Sources/Engine/bridge, compilerFlags: "-std=c++17 -O3" }
                - { path: Resources }
              info:
                path: Resources/Info.plist
                properties:
                  CFBundleDisplayName: Chess Helper
                  CFBundleShortVersionString: $(MARKETING_VERSION)
                  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                  CFBundleLocalizations: [en, ar]
                  LSRequiresIPhoneOS: true
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.chesshelper.app
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  PROVISIONING_PROFILE_SPECIFIER: ""
          EOF

      - name: Generate all Swift source files
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, textwrap
          files = {}

          files["Sources/LocalEngine.swift"] = r'''
          import Foundation
          import Combine

          /// Non-isolated UCI plumbing: owns the POSIX pipes, the engine thread
          /// and the response parser. All mutable state is confined to its private
          /// serial queue, so the SwiftUI-facing service stays free of
          /// concurrency warnings.
          final class EngineProcess {

              struct EngineInfo {
                  var depth = 0
                  var evalCp: Int? = nil
                  var mate: Int? = nil
                  var uci = ""
              }

              private let queue = DispatchQueue(label: "com.chesshelper.engine.io")
              private var inPipe: [Int32] = [-1, -1]
              private var outPipe: [Int32] = [-1, -1]
              private var thread: Thread?
              private var readSource: DispatchSourceRead?
              private var outBuffer = ""
              private var lineHandler: ((String) -> Void)?
              private var pendingHandshake: ((Bool) -> Void)?
              private var handshakeTimeout: DispatchWorkItem?
              private var started = false
              private var infos: [Int: EngineInfo] = [:]
              private var searchContinuation: CheckedContinuation<(moves: [TopMove], ms: Int), Never>?

              private static let infoRegex = try! NSRegularExpression(
                  pattern: #"depth\s+(\d+).*?multipv\s+(\d+).*?score\s+(cp\s+(-?\d+)|mate\s+(-?\d+)).*?pv\s+(.+)$"#
              )

              /// Spawns the engine and runs the UCI handshake. onReady is called
              /// on the process queue - hop to the main actor inside it.
              func start(bigNetPath: String?, smallNetPath: String?, onReady: @escaping (Bool) -> Void) {
                  queue.async { [weak self] in
                      guard let self = self else { onReady(false); return }
                      guard !self.started else { onReady(false); return }
                      self.started = true
                      guard pipe(&self.inPipe) == 0, pipe(&self.outPipe) == 0 else {
                          self.started = false
                          onReady(false)
                          return
                      }
                      let inFd = self.inPipe
                      let outFd = self.outPipe
                      // IMPORTANT: do NOT close inFd[0] / outFd[1] here. The engine
                      // thread dup2()s them onto stdin/stdout inside
                      // chesshelper_run_engine (which then closes the originals).
                      // Closing them on this side races the thread and can hand it
                      // a stale/reused descriptor -> crash or silent engine failure.
                      self.thread = Thread { chesshelper_run_engine(inFd[0], outFd[1]) }
                      self.thread?.name = "ChessHelperEngine"
                      self.thread?.start()
                      let readFd = outFd[0]
                      let src = DispatchSource.makeReadSource(fileDescriptor: readFd, queue: self.queue)
                      src.setEventHandler { [weak self] in self?.readAvailable(readFd) }
                      src.setCancelHandler { close(readFd) }
                      src.resume()
                      self.readSource = src

                      let handshake: (@escaping (Bool) -> Void) -> Void = { [weak self] done in
                          guard let self = self else { done(false); return }
                          self.pendingHandshake = done
                          // Cancel any previous timer so a stale timeout can never
                          // fire a false "failed" during the next handshake.
                          self.handshakeTimeout?.cancel()
                          let wi = DispatchWorkItem { [weak self] in
                              guard let self = self, let h = self.pendingHandshake else { return }
                              self.pendingHandshake = nil
                              h(false)
                          }
                          self.handshakeTimeout = wi
                          self.queue.asyncAfter(deadline: .now() + 15, execute: wi)
                      }

                      handshake { [weak self] ok1 in
                          guard let self = self, ok1 else { onReady(false); return }
                          self.send("setoption name Threads value 2\n")
                          self.send("setoption name MultiPV value 3\n")
                          if let p = bigNetPath { self.send("setoption name EvalFile value \(p)\n") }
                          if let p = smallNetPath { self.send("setoption name EvalFileSmall value \(p)\n") }
                          self.send("isready\n")
                          handshake { ok2 in onReady(ok2) }
                      }
                      self.send("uci\n")
                  }
              }

              /// Runs a UCI search to completion. Returns the moves and elapsed ms.
              func search(fen: String, depth: Int, multiPv: Int) async -> (moves: [TopMove], ms: Int) {
                  await withCheckedContinuation { (cont: CheckedContinuation<(moves: [TopMove], ms: Int), Never>) in
                      queue.async { [weak self] in
                          guard let self = self else { cont.resume(returning: ([], 0)); return }
                          let effDepth = min(max(depth, 10), 30)
                          self.infos = [:]
                          self.searchContinuation = cont
                          let t0 = Date()
                          let finish = { [weak self] in
                              guard let self = self, let c = self.searchContinuation else { return }
                              self.lineHandler = nil
                              self.searchContinuation = nil
                              let ms = Int(Date().timeIntervalSince(t0) * 1000)
                              let moves = self.infos.keys.sorted().compactMap { k -> TopMove? in
                                  guard let i = self.infos[k], !i.uci.isEmpty else { return nil }
                                  return TopMove(rank: k, uci: i.uci, san: i.uci,
                                                 evaluationCp: i.evalCp, mateIn: i.mate,
                                                 depth: i.depth, source: "local", votes: 3)
                              }
                              c.resume(returning: (moves: moves, ms: ms))
                          }
                          self.lineHandler = { [weak self] line in
                              guard let self = self else { return }
                              if let m = Self.parseInfo(line), m.depth >= (self.infos[m.mp]?.depth ?? -1) {
                                  self.infos[m.mp] = EngineInfo(depth: m.depth, evalCp: m.evalCp, mate: m.mate, uci: m.uci)
                              } else if line.hasPrefix("bestmove") {
                                  finish()
                              }
                          }
                          self.send("setoption name MultiPV value \(multiPv)\n")
                          self.send("position fen \(fen)\n")
                          self.send("go depth \(effDepth)\n")
                          self.queue.asyncAfter(deadline: .now() + 45) { [weak self] in
                              guard let self = self, self.searchContinuation != nil else { return }
                              self.send("stop\n")
                              self.queue.asyncAfter(deadline: .now() + 3) { [weak self] in
                                  guard let self = self, self.searchContinuation != nil else { return }
                                  finish()
                              }
                          }
                      }
                  }
              }

              func stop() {
                  queue.async { [weak self] in
                      guard let self = self else { return }
                      if self.started {
                          self.send("quit\n")
                          self.started = false
                      }
                      self.handshakeTimeout?.cancel()
                      self.handshakeTimeout = nil
                      self.readSource?.cancel()
                      self.readSource = nil
                      self.lineHandler = nil
                      self.pendingHandshake = nil
                      if self.inPipe[0] >= 0 { close(self.inPipe[0]) }
                      if self.inPipe[1] >= 0 { close(self.inPipe[1]) }
                      if self.outPipe[0] >= 0 { close(self.outPipe[0]) }
                      if self.outPipe[1] >= 0 { close(self.outPipe[1]) }
                      self.inPipe = [-1, -1]
                      self.outPipe = [-1, -1]
                  }
              }

              // MARK: - Pipe plumbing (UCI)

              private func readAvailable(_ fd: Int32) {
                  var buf = [UInt8](repeating: 0, count: 8192)
                  let n = read(fd, &buf, 8192)
                  guard n > 0 else { return }
                  outBuffer += String(decoding: buf[0..<n], as: UTF8.self)
                  while let idx = outBuffer.firstIndex(of: "\n") {
                      let line = String(outBuffer[..<idx]).trimmingCharacters(in: .whitespacesAndNewlines)
                      outBuffer = String(outBuffer[outBuffer.index(after: idx)...])
                      if !line.isEmpty { handleLine(line) }
                  }
              }

              private func handleLine(_ line: String) {
                  if let h = lineHandler {
                      h(line)
                      return
                  }
                  if line.hasPrefix("uciok") || line.hasPrefix("readyok") {
                      if let h = pendingHandshake {
                          pendingHandshake = nil
                          handshakeTimeout?.cancel()
                          h(true)
                      }
                  }
              }

              private func send(_ s: String) {
                  guard inPipe[1] >= 0 else { return }
                  s.withCString { ptr in
                      var remaining = s.utf8.count
                      var off = 0
                      while remaining > 0 {
                          let w = write(inPipe[1], ptr + off, remaining)
                          if w <= 0 { break }
                          off += w
                          remaining -= w
                      }
                  }
              }

              private static func parseInfo(_ line: String) -> (mp: Int, depth: Int, evalCp: Int?, mate: Int?, uci: String)? {
                  guard line.hasPrefix("info ") else { return nil }
                  let ns = line as NSString
                  let range = NSRange(location: 0, length: ns.length)
                  guard let m = infoRegex.firstMatch(in: line, options: [], range: range) else { return nil }
                  func g(_ i: Int) -> String {
                      m.range(at: i).location != NSNotFound ? ns.substring(with: m.range(at: i)) : ""
                  }
                  let depth = Int(g(1)) ?? 0
                  let mp = Int(g(2)) ?? 1
                  var cp: Int? = nil
                  var mate: Int? = nil
                  if g(3).hasPrefix("cp") { cp = Int(g(4)) }
                  else if g(3).hasPrefix("mate") { mate = Int(g(5)) }
                  let uci = g(6).split(separator: " ").first.map(String.init) ?? ""
                  return (mp, depth, cp, mate, uci)
              }
          }

          /// SwiftUI-facing service. All engine plumbing lives in EngineProcess.
          @MainActor
          final class LocalEngineService: ObservableObject {
              enum Status: String {
                  case off, needsDownload, starting, ready, failed
              }

              @Published var isEnabled: Bool {
                  didSet {
                      UserDefaults.standard.set(isEnabled, forKey: "local_engine_enabled")
                      if !isEnabled { stopEngine() }
                  }
              }
              @Published var targetDepth: Int {
                  didSet { UserDefaults.standard.set(targetDepth, forKey: "local_engine_depth") }
              }
              @Published private(set) var status: Status = .off
              @Published private(set) var statusDetail: String = ""
              @Published private(set) var isDownloading = false
              @Published private(set) var lastSearchMs: Int = 0
              @Published private(set) var lastSearchDepth: Int = 0

              static let bigNetURL = URL(string: "https://tests.stockfishchess.org/api/nn/nn-b1a57edbea57.nnue")!
              static let smallNetURL = URL(string: "https://tests.stockfishchess.org/api/nn/nn-baff1ede1f90.nnue")!
              static let bigNetName = "nn-b1a57edbea57.nnue"
              static let smallNetName = "nn-baff1ede1f90.nnue"

              private let process = EngineProcess()
              private var processStarted = false

              init() {
                  isEnabled = UserDefaults.standard.bool(forKey: "local_engine_enabled")
                  let d = UserDefaults.standard.integer(forKey: "local_engine_depth")
                  targetDepth = (d >= 10 && d <= 30) ? d : 22
              }

              // MARK: - Net files (downloaded data, not code)

              var netDirectory: URL {
                  FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0]
                      .appendingPathComponent("ChessHelperEngine", isDirectory: true)
              }
              var bigNetPath: String? { pathFor(Self.bigNetName) }
              var smallNetPath: String? { pathFor(Self.smallNetName) }
              var netsReady: Bool { bigNetPath != nil && smallNetPath != nil }
              private func pathFor(_ name: String) -> String? {
                  let u = netDirectory.appendingPathComponent(name)
                  return FileManager.default.fileExists(atPath: u.path) ? u.path : nil
              }

              func downloadNets() async -> Bool {
                  isDownloading = true
                  defer { isDownloading = false }
                  do {
                      try FileManager.default.createDirectory(at: netDirectory, withIntermediateDirectories: true)
                  } catch {
                      statusDetail = "Cannot create directory"
                      return false
                  }
                  let smallOK = await downloadOne(url: Self.smallNetURL, name: Self.smallNetName)
                  let bigOK = await downloadOne(url: Self.bigNetURL, name: Self.bigNetName)
                  if smallOK && bigOK {
                      statusDetail = ""
                      if processStarted {
                          // Restart so the freshly downloaded nets get loaded.
                          process.stop()
                          processStarted = false
                          status = .off
                      }
                      return true
                  } else {
                      statusDetail = "Download incomplete — try again"
                      return false
                  }
              }

              private func downloadOne(url: URL, name: String) async -> Bool {
                  guard let data = try? await downloadData(url: url) else { return false }
                  let dest = netDirectory.appendingPathComponent(name)
                  do {
                      try? FileManager.default.removeItem(at: dest)
                      try data.write(to: dest, options: .atomic)
                      return true
                  } catch {
                      return false
                  }
              }

              private func downloadData(url: URL) async throws -> Data {
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 600
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  let (data, resp) = try await URLSession.shared.data(for: req)
                  guard let http = resp as? HTTPURLResponse, http.statusCode == 200, !data.isEmpty else {
                      throw URLError(.badServerResponse)
                  }
                  return data
              }

              // MARK: - Engine lifecycle

              func ensureReady() async -> Bool {
                  guard isEnabled else { return false }
                  guard netsReady else {
                      status = .needsDownload
                      return false
                  }
                  if status == .ready { return true }
                  if !processStarted {
                      processStarted = true
                      status = .starting
                      statusDetail = ""
                      let big = bigNetPath
                      let small = smallNetPath
                      process.start(bigNetPath: big, smallNetPath: small) { [weak self] ok in
                          Task { @MainActor in
                              guard let self = self else { return }
                              if ok {
                                  self.status = .ready
                              } else {
                                  self.status = .failed
                                  self.statusDetail = "Engine handshake timeout"
                              }
                          }
                      }
                  }
                  for _ in 0..<30 {
                      try? await Task.sleep(nanoseconds: 200_000_000)
                      if status == .ready { return true }
                      if status == .failed { return false }
                  }
                  return status == .ready
              }

              func search(fen: String, depth: Int, multiPv: Int = 3) async -> [TopMove] {
                  guard await ensureReady() else { return [] }
                  let (moves, ms) = await process.search(fen: fen, depth: depth, multiPv: multiPv)
                  lastSearchMs = ms
                  lastSearchDepth = min(max(depth, 10), 30)
                  return moves
              }

              func stopEngine() {
                  process.stop()
                  processStarted = false
                  status = .off
              }
          }

          // C function implemented in Sources/Engine/bridge/EngineBridge.cpp
          @_silgen_name("chesshelper_run_engine")
          private func chesshelper_run_engine(_ inFD: Int32, _ outFD: Int32)

          '''

          files["Sources/AIAssistantPanel.swift"] = r'''
          import SwiftUI
          struct AIAssistantPanel: View {
              @ObservedObject var aiVM: AIAssistantViewModel
              @ObservedObject var aiPos: AIOverlayPosition
              @ObservedObject var engine: EngineViewModel
              @ObservedObject var language: AppLanguage
              @FocusState private var chatFocused: Bool
              @State private var panelDragOffset: CGSize = .zero
              var body: some View {
                  VStack(spacing: 0) {
                      header.gesture(
                          DragGesture(minimumDistance: 5)
                              .onChanged { v in panelDragOffset = v.translation }
                              .onEnded { v in
                                  aiPos.offset = CGSize(width: aiPos.offset.width + v.translation.width, height: aiPos.offset.height + v.translation.height)
                                  panelDragOffset = .zero
                                  aiPos.save()
                              }
                      )
                      if aiPos.isChatMode { chatContent } else { explanationContent }
                      if !aiPos.isChatMode { threatSection }
                  }
                  .frame(maxWidth: 320)
                  .background(.ultraThinMaterial).cornerRadius(14)
                  .overlay(RoundedRectangle(cornerRadius: 14).stroke(Color.purple.opacity(0.4), lineWidth: 1.5))
                  .shadow(color: .purple.opacity(0.3), radius: 10, y: 4)
                  .offset(panelDragOffset)
              }
              private var header: some View {
                  HStack(spacing: 6) {
                      Image(systemName: "hand.draw.fill").font(.caption2).foregroundColor(.white.opacity(0.5))
                      Image(systemName: "sparkles").font(.caption).foregroundColor(.purple)
                      Text("AI").font(.caption.bold()).foregroundColor(.purple)
                      Spacer()
                      if !aiVM.currentExplanation.isEmpty && !aiPos.isChatMode {
                          Button {
                              VoiceManager.shared.speak(text: aiVM.currentExplanation, isArabic: language.isArabic)
                              HapticManager.selection()
                          } label: {
                              Image(systemName: "speaker.wave.2.fill").font(.caption).foregroundColor(.blue)
                          }
                      }
                      Button { withAnimation { aiPos.isChatMode.toggle() } } label: {
                          Image(systemName: aiPos.isChatMode ? "text.bubble.fill" : "bubble.left.and.bubble.right.fill")
                              .font(.caption).foregroundColor(.blue)
                      }
                      Button { aiPos.isVisible = false } label: {
                          Image(systemName: "xmark.circle.fill").font(.caption).foregroundColor(.red.opacity(0.7))
                      }
                  }
                  .padding(.horizontal, 10).padding(.vertical, 6).background(Color.purple.opacity(0.15))
                  .contentShape(Rectangle())
              }
              private var explanationContent: some View {
                  ScrollView {
                      VStack(alignment: .leading, spacing: 6) {
                          if !aiVM.currentExplainedMove.isEmpty {
                              HStack {
                                  Image(systemName: "star.fill").font(.caption).foregroundColor(.purple)
                                  Text(aiVM.currentExplainedMove).font(.callout.bold()).foregroundColor(.purple)
                              }
                          }
                          if aiVM.isLoadingExplanation {
                              HStack {
                                  ProgressView().scaleEffect(0.7)
                                  Text(language.isArabic ? "AI يفكر..." : "AI thinking...").font(.caption).foregroundColor(.secondary)
                              }
                          } else if !aiVM.explanationError.isEmpty {
                              Text("⚠️ \(aiVM.explanationError)").font(.caption).foregroundColor(.orange)
                          } else if !aiVM.currentExplanation.isEmpty {
                              Text(aiVM.currentExplanation).font(.callout).foregroundColor(.white.opacity(0.9))
                                  .fixedSize(horizontal: false, vertical: true)
                          } else {
                              Text(language.isArabic ? "اضغط 'اسأل AI' للحصول على شرح" : "Tap 'Ask AI' for explanation")
                                  .font(.caption).foregroundColor(.secondary)
                          }
                      }
                      .padding(10)
                  }
                  .frame(maxHeight: 280)
              }
              private var threatSection: some View {
                  VStack(spacing: 4) {
                      Divider().opacity(0.3)
                      Button {
                          aiVM.analyzeThreats(fen: engine.currentFEN, isArabic: language.isArabic)
                      } label: {
                          HStack(spacing: 4) {
                              if aiVM.isLoadingThreats { ProgressView().scaleEffect(0.5) }
                              else { Image(systemName: "exclamationmark.shield.fill").font(.caption2) }
                              Text(language.isArabic ? "تحليل التهديدات" : "Analyze Threats").font(.caption2.bold())
                          }
                          .padding(.horizontal, 8).padding(.vertical, 4)
                          .background(Color.red.opacity(0.2)).foregroundColor(.red).cornerRadius(6)
                      }.disabled(aiVM.isLoadingThreats)
                      if !aiVM.threatAnalysis.isEmpty {
                          ScrollView {
                              Text(aiVM.threatAnalysis).font(.caption).foregroundColor(.white.opacity(0.85))
                                  .fixedSize(horizontal: false, vertical: true).padding(.horizontal, 10)
                          }
                          .frame(maxHeight: 120)
                      }
                  }
                  .padding(.bottom, 6)
              }
              private var chatContent: some View {
                  VStack(spacing: 0) {
                      ScrollViewReader { proxy in
                          ScrollView {
                              VStack(alignment: .leading, spacing: 8) {
                                  if aiVM.chatMessages.isEmpty {
                                      Text(language.isArabic ? "اسأل AI!\n\nمثال:\n• إيه أحسن استراتيجية؟" : "Ask AI!\n\nExamples:\n• Best strategy?")
                                          .font(.caption).foregroundColor(.secondary).padding(12)
                                  }
                                  ForEach(aiVM.chatMessages) { msg in
                                      HStack {
                                          if msg.role == "user" { Spacer() }
                                          Text(msg.text).font(.caption)
                                              .padding(.horizontal, 10).padding(.vertical, 6)
                                              .background(msg.role == "user" ? Color.blue.opacity(0.3) : Color.purple.opacity(0.2))
                                              .foregroundColor(.white.opacity(0.9)).cornerRadius(8)
                                              .frame(maxWidth: 240, alignment: msg.role == "user" ? .trailing : .leading)
                                          if msg.role == "ai" { Spacer() }
                                      }
                                      .id(msg.id)
                                  }
                                  if aiVM.isLoadingChat {
                                      HStack {
                                          ProgressView().scaleEffect(0.6)
                                          Text(language.isArabic ? "يكتب..." : "typing...").font(.caption2).foregroundColor(.secondary)
                                      }.padding(.horizontal, 10)
                                  }
                              }
                              .padding(6)
                          }
                          .frame(maxHeight: 280)
                          .onChange(of: aiVM.chatMessages.count) { _ in
                              if let last = aiVM.chatMessages.last {
                                  withAnimation { proxy.scrollTo(last.id, anchor: .bottom) }
                              }
                          }
                      }
                      HStack(spacing: 6) {
                          TextField(language.isArabic ? "اكتب سؤالك..." : "Your question...", text: $aiVM.chatInput)
                              .font(.caption).padding(.horizontal, 8).padding(.vertical, 6)
                              .background(Color.black.opacity(0.3)).cornerRadius(8)
                              .focused($chatFocused)
                              .onSubmit { aiVM.sendChat(fen: engine.currentFEN, isArabic: language.isArabic) }
                          Button {
                              aiVM.sendChat(fen: engine.currentFEN, isArabic: language.isArabic)
                              chatFocused = false
                          } label: {
                              Image(systemName: "paperplane.fill").foregroundColor(.blue)
                                  .padding(6).background(Color.blue.opacity(0.2)).cornerRadius(6)
                          }.disabled(aiVM.chatInput.trimmingCharacters(in: .whitespaces).isEmpty || aiVM.isLoadingChat)
                          if !aiVM.chatMessages.isEmpty {
                              Button { aiVM.clearChat() } label: {
                                  Image(systemName: "trash").foregroundColor(.red.opacity(0.7)).font(.caption)
                              }
                          }
                      }
                      .padding(8).background(Color.black.opacity(0.2))
                  }
              }
          }
          '''

          files["Sources/AIAssistantViewModel.swift"] = r'''
          import Foundation
          import SwiftUI
          @MainActor
          final class AIAssistantViewModel: ObservableObject {
              @Published var currentExplanation: String = ""
              @Published var isLoadingExplanation = false
              @Published var explanationError: String = ""
              @Published var currentExplainedMove: String = ""
              @Published var chatMessages: [ChatEntry] = []
              @Published var isLoadingChat = false
              @Published var chatInput: String = ""
              @Published var threatAnalysis: String = ""
              @Published var isLoadingThreats = false
              @Published var isPuzzleDetected = false
              @Published var puzzleHint: String = ""
              struct ChatEntry: Identifiable, Equatable {
                  let id = UUID()
                  let role: String
                  let text: String
              }
              private var explanationCache: [String: String] = [:]
