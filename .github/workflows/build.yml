          files["Sources/EngineService.swift"] = r'''
          import Foundation

          struct TopMove: Identifiable, Equatable {
              let id = UUID()
              let rank: Int
              let uci: String
              let san: String
              let evaluationCp: Int?
              let mateIn: Int?
              let depth: Int
              var evalString: String {
                  if let m = mateIn, m != 0 { return "M\(abs(m))" }
                  if let cp = evaluationCp { return String(format: "%+.2f", Double(cp)/100.0) }
                  return "—"
              }
              var winChance: Double {
                  if let m = mateIn, m != 0 { return m > 0 ? 99 : 1 }
                  guard let cp = evaluationCp else { return 50 }
                  return 50 + 50 * tanh(Double(cp)/400.0)
              }
          }

          struct EngineAnalysis {
              let topMoves: [TopMove]
              let bestMove: TopMove?
              let depth: Int
          }

          /// Uses stockfish.online free public API (no key, no chess.com traffic).
          /// Only external endpoint used by the app; nothing goes to chess.com.
          enum EngineService {
              static func analyze(fen: String, depth: Int = 15) async throws -> EngineAnalysis {
                  var comps = URLComponents(string: "https://stockfish.online/api/s/v2.php")!
                  comps.queryItems = [
                      URLQueryItem(name: "fen", value: fen),
                      URLQueryItem(name: "depth", value: "\(min(depth, 15))")
                  ]
                  guard let url = comps.url else {
                      throw NSError(domain: "EngineService", code: -1,
                                    userInfo: [NSLocalizedDescriptionKey: "Bad URL"])
                  }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 10
                  req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")

                  let (data, resp) = try await URLSession.shared.data(for: req)
                  guard let http = resp as? HTTPURLResponse, (200..<300).contains(http.statusCode) else {
                      throw NSError(domain: "EngineService", code: -2,
                                    userInfo: [NSLocalizedDescriptionKey: "Bad response"])
                  }
                  guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else {
                      throw NSError(domain: "EngineService", code: -3,
                                    userInfo: [NSLocalizedDescriptionKey: "Bad JSON"])
                  }

                  let bestmoveField = (json["bestmove"] as? String) ?? ""
                  let evalCp = json["evaluation"] as? Double
                  let mate = json["mate"] as? Int
                  let continuation = (json["continuation"] as? String) ?? ""

                  var bestUci = ""
                  let parts = bestmoveField.split(separator: " ").map(String.init)
                  for (i, p) in parts.enumerated() where p == "bestmove" && i + 1 < parts.count {
                      bestUci = parts[i+1]
                      break
                  }
                  if bestUci.isEmpty { bestUci = parts.first ?? "" }

                  var moves: [TopMove] = []
                  if !bestUci.isEmpty {
                      let cpInt = evalCp.map { Int(($0 * 100).rounded()) }
                      moves.append(TopMove(rank: 1, uci: bestUci, san: bestUci,
                                           evaluationCp: cpInt, mateIn: mate, depth: depth))
                  }

                  // Add secondary options from continuation line
                  let contMoves = continuation.split(separator: " ").map(String.init)
                  for (idx, mv) in contMoves.prefix(2).enumerated() where !mv.isEmpty && mv != bestUci {
                      moves.append(TopMove(rank: idx + 2, uci: mv, san: mv,
                                           evaluationCp: nil, mateIn: nil, depth: depth))
                      if moves.count >= 3 { break }
                  }

                  return EngineAnalysis(topMoves: moves, bestMove: moves.first, depth: depth)
              }
          }
          '''

          files["Sources/StealthManager.swift"] = r'''
          import SwiftUI
          import UIKit
          import Combine

          @MainActor
          final class StealthManager: ObservableObject {
              @Published var overlayVisible = true
              @Published var minimalMode = false
              @Published var isBeingRecorded = false
              @Published var lastHideReason = ""
              private var cancellables = Set<AnyCancellable>()

              init() {
                  NotificationCenter.default.publisher(for: UIScreen.capturedDidChangeNotification)
                      .sink { [weak self] _ in
                          guard let self = self else { return }
                          let c = UIScreen.main.isCaptured
                          self.isBeingRecorded = c
                          if c { self.hide(reason: "screen recording") }
                      }.store(in: &cancellables)
                  NotificationCenter.default.publisher(for: UIApplication.willResignActiveNotification)
                      .sink { [weak self] _ in self?.hide(reason: "backgrounded") }
                      .store(in: &cancellables)
                  NotificationCenter.default.publisher(for: UIApplication.userDidTakeScreenshotNotification)
                      .sink { [weak self] _ in self?.hide(reason: "screenshot") }
                      .store(in: &cancellables)
                  NotificationCenter.default.publisher(for: .stealthPanic)
                      .sink { [weak self] _ in self?.toggleOverlay() }
                      .store(in: &cancellables)
                  isBeingRecorded = UIScreen.main.isCaptured
                  if isBeingRecorded { hide(reason: "screen recording") }
              }
              func toggleOverlay() {
                  overlayVisible.toggle()
                  lastHideReason = overlayVisible ? "" : "panic"
              }
              func hide(reason: String) { overlayVisible = false; lastHideReason = reason }
              func show() { overlayVisible = true; lastHideReason = "" }
              func toggleMinimalMode() { minimalMode.toggle() }
          }

          extension UIWindow {
              open override func motionEnded(_ motion: UIEvent.EventSubtype, with event: UIEvent?) {
                  if motion == .motionShake {
                      NotificationCenter.default.post(name: .stealthPanic, object: nil)
                  }
                  super.motionEnded(motion, with: event)
              }
          }

          extension Notification.Name {
              static let stealthPanic = Notification.Name("StealthPanicGesture")
          }

          struct ThreeFingerCatcher: UIViewRepresentable {
              let action: () -> Void
              func makeUIView(context: Context) -> UIView {
                  let v = UIView()
                  let tap = UITapGestureRecognizer(target: context.coordinator, action: #selector(Coordinator.tapped))
                  tap.numberOfTouchesRequired = 3
                  tap.cancelsTouchesInView = false
                  v.addGestureRecognizer(tap)
                  v.isUserInteractionEnabled = true
                  v.backgroundColor = .clear
                  return v
              }
              func updateUIView(_ v: UIView, context: Context) {}
              func makeCoordinator() -> Coordinator { Coordinator(action: action) }
              final class Coordinator: NSObject {
                  let action: () -> Void
                  init(action: @escaping () -> Void) { self.action = action }
                  @objc func tapped() { action() }
              }
          }

          extension View {
              func onThreeFingerPanic(_ action: @escaping () -> Void) -> some View {
                  overlay(ThreeFingerCatcher(action: action).allowsHitTesting(true)
                          .frame(maxWidth: .infinity, maxHeight: .infinity).opacity(0.001))
              }
          }
          '''

