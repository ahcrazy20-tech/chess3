                          if x.r == 7 && x.c == 7 { wRH1m = true }
                      }
                      if x.b == "r" && x.a == "." {
                          if x.r == 0 && x.c == 0 { bRA8m = true }
                          if x.r == 0 && x.c == 7 { bRH8m = true }
                      }
                      if x.a != "." && x.b != x.a {
                          if x.r == 7 && x.c == 0 { wRA1m = true }
                          if x.r == 7 && x.c == 7 { wRH1m = true }
                          if x.r == 0 && x.c == 0 { bRA8m = true }
                          if x.r == 0 && x.c == 7 { bRH8m = true }
                      }
                  }
                  lastEP = nil
                  let from = ch.first { $0.b != "." && $0.a == "." }
                  let to = ch.first { $0.a != "." && $0.a != $0.b }
                  if let f = from, let t = to {
                      let p = t.a
                      if (p == "P" || p == "p") && abs(f.r - t.r) == 2 && f.c == t.c {
                          let epR = (f.r + t.r) / 2
                          lastEP = "\(Character(UnicodeScalar(97 + t.c)!))\(8 - epR)"
                      }
                      let isPawn = p == "P" || p == "p"
                      let isCap = ch.contains { $0.b != "." && $0.a != "." && $0.b != $0.a }
                      hmc = (isPawn || isCap) ? 0 : (hmc + 1)
                  }
              }
              private func isSP(_ g: [[Character]]) -> Bool {
                  guard g.count == 8 else { return false }
                  return String(g[0]) == "rnbqkbnr" && String(g[1]) == "pppppppp"
                      && String(g[6]) == "PPPPPPPP" && String(g[7]) == "RNBQKBNR"
              }
              private func boardFen(_ g: [[Character]]) -> String {
                  var rows: [String] = []
                  for r in 0..<8 {
                      var row = ""; var e = 0
                      for c in 0..<8 {
                          let ch = g[r][c]
                          if ch == "." { e += 1 }
                          else { if e > 0 { row += "\(e)"; e = 0 }; row.append(ch) }
                      }
                      if e > 0 { row += "\(e)" }
                      rows.append(row)
                  }
                  return rows.joined(separator: "/")
              }
              private func castling(_ g: [[Character]]) -> String {
                  var s = ""
                  if !wKm && !wRH1m && g[7][4] == "K" && g[7][7] == "R" { s += "K" }
                  if !wKm && !wRA1m && g[7][4] == "K" && g[7][0] == "R" { s += "Q" }
                  if !bKm && !bRH8m && g[0][4] == "k" && g[0][7] == "r" { s += "k" }
                  if !bKm && !bRA8m && g[0][4] == "k" && g[0][0] == "r" { s += "q" }
                  return s.isEmpty ? "-" : s
              }
          }
