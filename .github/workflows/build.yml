              static func tablebaseAnalysis(_ tb: TablebaseResult, fen: String) -> EngineAnalysis? {
                  let parts = fen.split(separator: " ").map(String.init)
                  let side = parts.count >= 2 ? parts[1] : "w"
                  let sign = side == "w" ? 1 : -1
                  var out: [TopMove] = []
                  for m in tb.moves {
                      guard MoveValidator.isPlausibleMove(uci: m.uci, fen: fen) else { continue }
                      var cp: Int? = nil
                      var mate: Int? = nil
                      switch m.category {
                      case "win": if tb.checkmate { mate = sign * 1 } else { cp = sign * 9900 }
