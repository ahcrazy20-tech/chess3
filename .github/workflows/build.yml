name: Build ChessHelper v5.3.1

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Clean & prepare
        run: |
          rm -rf Sources Resources ChessHelper.xcodeproj build Payload
          mkdir -p Sources Resources

      - name: Write project.yml
        run: |
          cat > project.yml <<'EOF'
          name: ChessHelper
          options:
            bundleIdPrefix: com.chesshelper
            deploymentTarget: { iOS: "16.0" }
            createIntermediateGroups: true
          settings:
            base:
              MARKETING_VERSION: "5.3.1"
              CURRENT_PROJECT_VERSION: "54"
              SWIFT_VERSION: "5.9"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              TARGETED_DEVICE_FAMILY: "1,2"
          targets:
            ChessHelper:
              type: application
              platform: iOS
              sources: [ { path: Sources }, { path: Resources } ]
              info:
                path: Resources/Info.plist
                properties:
                  CFBundleDisplayName: Chess Helper
                  CFBundleShortVersionString: $(MARKETING_VERSION)
                  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.chesshelper.app
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  PROVISIONING_PROFILE_SPECIFIER: ""
          EOF

      - name: Generate all Swift source files
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, textwrap
          files = {}

          files["Sources/ChessHelperApp.swift"] = r'''
          import SwiftUI
          @main
          struct ChessHelperApp: App {
              var body: some Scene {
                  WindowGroup { ContentView().preferredColorScheme(.dark) }
              }
          }
          '''

          files["Sources/AppRouter.swift"] = r'''
          import SwiftUI
          @MainActor
          final class AppRouter: ObservableObject {
              @Published var selectedTab: Int = 0
              @Published var chessURL: URL = URL(string: "https://www.chess.com/")!
              @Published var navigateTrigger: Int = 0
              func openInPlay(_ s: String) {
                  if let u = URL(string: s) { chessURL = u; navigateTrigger &+= 1; selectedTab = 0 }
              }
          }
          '''

          files["Sources/AppLanguage.swift"] = r'''
          import Foundation
          import SwiftUI
          @MainActor
          final class AppLanguage: ObservableObject {
              enum Lang: String, CaseIterable {
                  case arabic = "ar"
                  case english = "en"
                  var display: String { self == .arabic ? "العربية" : "English" }
              }
              @Published var current: Lang {
                  didSet { UserDefaults.standard.set(current.rawValue, forKey: "app_language") }
              }
              init() {
                  let saved = UserDefaults.standard.string(forKey: "app_language") ?? "en"
                  self.current = Lang(rawValue: saved) ?? .english
              }
              var isArabic: Bool { current == .arabic }
          }
          '''

          files["Sources/KeychainStore.swift"] = r'''
          import Foundation
          import Security
          enum KeychainStore {
              static let groqKeyAccount = "chess_helper_groq_api_key"
              static let service = "com.chesshelper.app"
              static func save(_ value: String, account: String) -> Bool {
                  let data = value.data(using: .utf8)!
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service, kSecAttrAccount as String: account]
                  SecItemDelete(query as CFDictionary)
                  var newItem = query; newItem[kSecValueData as String] = data
                  return SecItemAdd(newItem as CFDictionary, nil) == errSecSuccess
              }
              static func load(account: String) -> String? {
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service, kSecAttrAccount as String: account, kSecReturnData as String: true, kSecMatchLimit as String: kSecMatchLimitOne]
                  var item: CFTypeRef?
                  guard SecItemCopyMatching(query as CFDictionary, &item) == errSecSuccess, let data = item as? Data else { return nil }
                  return String(data: data, encoding: .utf8)
              }
              static func delete(account: String) {
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service, kSecAttrAccount as String: account]
                  SecItemDelete(query as CFDictionary)
              }
          }
          '''

          files["Sources/StealthConfig.swift"] = r'''
          import Foundation
          enum StealthConfig {
              static let bridgeName: String = randomName(prefix: "_", length: 6)
              static let readerFlag: String = randomName(prefix: "_", length: 8)
              static let startFuncName: String = randomName(prefix: "_", length: 8)
              private static let userAgents = [
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.6 Mobile/15E148 Safari/604.1",
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 17_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.1 Mobile/15E148 Safari/604.1",
              ]
              static func randomUserAgent() -> String { userAgents.randomElement()! }
              static func readerInterval() -> Int { Int.random(in: 500...900) }
              private static func randomName(prefix: String, length: Int) -> String {
                  let chars = "abcdefghijklmnopqrstuvwxyz0123456789"
                  return prefix + String((0..<length).map { _ in chars.randomElement()! })
              }
          }
          '''

          files["Sources/FenValidator.swift"] = r'''
          import Foundation
          enum FenValidator {
              static func validate(_ fen: String) -> String? {
                  let parts = fen.split(separator: " ").map(String.init)
                  guard parts.count >= 4 else { return "not enough FEN fields" }
                  let ranks = parts[0].split(separator: "/").map(String.init)
                  guard ranks.count == 8 else { return "not 8 ranks" }
                  var wK = 0, bK = 0, total = 0
                  for rank in ranks {
                      var count = 0
                      for ch in rank {
                          if let d = ch.wholeNumberValue { count += d }
                          else { count += 1; total += 1; if ch == "K" { wK += 1 }; if ch == "k" { bK += 1 } }
                      }
                      if count != 8 { return "rank has \(count) squares" }
                  }
                  if wK != 1 || bK != 1 { return "kings: \(wK)/\(bK)" }
                  if total < 4 || total > 32 { return "\(total) pieces" }
                  return nil
              }
          }
          '''

          files["Sources/MoveValidator.swift"] = r'''
          import Foundation
          enum MoveValidator {
              static func parseFen(_ fen: String) -> [[Character]]? {
                  let parts = fen.split(separator: " ").map(String.init)
                  guard let boardPart = parts.first else { return nil }
                  let ranks = boardPart.split(separator: "/").map(String.init)
                  guard ranks.count == 8 else { return nil }
                  var grid: [[Character]] = Array(repeating: Array(repeating: ".", count: 8), count: 8)
                  for (rIdx, rank) in ranks.enumerated() {
                      var col = 0
                      for ch in rank {
                          if let empty = ch.wholeNumberValue { col += empty }
                          else { if col < 8 { grid[rIdx][col] = ch }; col += 1 }
                      }
                  }
                  return grid
              }
              static func squareToCoord(_ sq: String) -> (row: Int, col: Int)? {
                  guard sq.count >= 2 else { return nil }
                  let chars = Array(sq)
                  guard let fs = chars[0].asciiValue, fs >= 97, fs <= 104 else { return nil }
                  guard let rd = chars[1].wholeNumberValue, rd >= 1, rd <= 8 else { return nil }
                  return (8 - rd, Int(fs) - 97)
              }
              static func isPlausibleMove(uci: String, fen: String) -> Bool {
                  guard uci.count >= 4 else { return false }
                  guard let grid = parseFen(fen) else { return false }
                  let parts = fen.split(separator: " ").map(String.init)
                  guard parts.count >= 2 else { return false }
                  guard let from = squareToCoord(String(uci.prefix(2))) else { return false }
                  guard let to = squareToCoord(String(uci.dropFirst(2).prefix(2))) else { return false }
                  let fromPiece = grid[from.row][from.col]
                  guard fromPiece != "." else { return false }
                  if fromPiece.isUppercase != (parts[1] == "w") { return false }
                  let toPiece = grid[to.row][to.col]
                  if toPiece != "." && toPiece.isUppercase == fromPiece.isUppercase { return false }
                  return true
              }
          }
          '''

          files["Sources/FenBuilder.swift"] = r'''
          import Foundation
          @MainActor
          final class FenBuilder {
              private var wKm=false,bKm=false,wRA1m=false,wRH1m=false,bRA8m=false,bRH8m=false
              private var lastEP:String?=nil,hmc:Int=0,lastGrid:[[Character]]?=nil,lastPly:Int = -1
              func reset() { wKm=false;bKm=false;wRA1m=false;wRH1m=false;bRA8m=false;bRH8m=false;lastEP=nil;hmc=0;lastGrid=nil;lastPly = -1 }
              func build(grid:[[Character]],sideToMove:String,plyCount:Int)->String {
                  if isSP(grid){reset();lastGrid=grid;lastPly=plyCount}
                  else{if let old=lastGrid,plyCount>=lastPly&&plyCount<=lastPly+2{detect(old:old,new:grid)};lastGrid=grid;lastPly=plyCount}
                  return "\(boardFen(grid)) \(sideToMove) \(castling(grid)) \(lastEP ?? "-") \(hmc) \(max(1,(plyCount/2)+1))"
              }
              private func detect(old:[[Character]],new:[[Character]]) {
                  var ch:[(r:Int,c:Int,b:Character,a:Character)]=[]
                  for r in 0..<8{for c in 0..<8{if old[r][c] != new[r][c]{ch.append((r,c,old[r][c],new[r][c]))}}}
                  guard !ch.isEmpty else{return}
                  for x in ch{
                      if x.b=="K"&&x.a=="."&&x.r==7&&x.c==4{wKm=true}
                      if x.b=="k"&&x.a=="."&&x.r==0&&x.c==4{bKm=true}
                      if x.b=="R"&&x.a=="."{if x.r==7&&x.c==0{wRA1m=true};if x.r==7&&x.c==7{wRH1m=true}}
                      if x.b=="r"&&x.a=="."{if x.r==0&&x.c==0{bRA8m=true};if x.r==0&&x.c==7{bRH8m=true}}
                      if x.a != "."&&x.b != x.a{if x.r==7&&x.c==0{wRA1m=true};if x.r==7&&x.c==7{wRH1m=true};if x.r==0&&x.c==0{bRA8m=true};if x.r==0&&x.c==7{bRH8m=true}}
                  }
                  lastEP=nil
                  let from=ch.first{$0.b != "."&&$0.a=="."},to=ch.first{$0.a != "."&&$0.a != $0.b}
                  if let f=from,let t=to{
                      let p=t.a;if(p=="P"||p=="p")&&abs(f.r-t.r)==2&&f.c==t.c{let epR=(f.r+t.r)/2;lastEP="\(Character(UnicodeScalar(97+t.c)!))\(8-epR)"}
                      hmc=((p=="P"||p=="p")||ch.contains{$0.b != "."&&$0.a != "."&&$0.b != $0.a}) ? 0:(hmc+1)
                  }
              }
              private func isSP(_ g:[[Character]])->Bool{g.count==8&&String(g[0])=="rnbqkbnr"&&String(g[1])=="pppppppp"&&String(g[6])=="PPPPPPPP"&&String(g[7])=="RNBQKBNR"}
              private func boardFen(_ g:[[Character]])->String{var rows:[String]=[];for r in 0..<8{var row="";var e=0;for c in 0..<8{let ch=g[r][c];if ch=="."{e+=1}else{if e>0{row+="\(e)";e=0};row.append(ch)}};if e>0{row+="\(e)"};rows.append(row)};return rows.joined(separator:"/")}
              private func castling(_ g:[[Character]])->String{var s="";if !wKm&&!wRH1m&&g[7][4]=="K"&&g[7][7]=="R"{s+="K"};if !wKm&&!wRA1m&&g[7][4]=="K"&&g[7][0]=="R"{s+="Q"};if !bKm&&!bRH8m&&g[0][4]=="k"&&g[0][7]=="r"{s+="k"};if !bKm&&!bRA8m&&g[0][4]=="k"&&g[0][0]=="r"{s+="q"};return s.isEmpty ? "-":s}
          }
          '''

          files["Sources/OverlayPosition.swift"] = r'''
          import SwiftUI
          @MainActor
          final class OverlayPosition: ObservableObject {
              @Published var offset:CGSize = .zero
              @Published var isCompact:Bool = false
              @Published var transparency:Double = 0.85
              private let xK="ov_x_v54",yK="ov_y_v54",cK="ov_c_v54",tK="ov_t_v54"
              init(){let x=UserDefaults.standard.double(forKey:xK);let y=UserDefaults.standard.double(forKey:yK);offset=CGSize(width:x,height:y);isCompact=UserDefaults.standard.bool(forKey:cK);let t=UserDefaults.standard.double(forKey:tK);transparency=t>0 ? t:0.85}
              func save(){UserDefaults.standard.set(offset.width,forKey:xK);UserDefaults.standard.set(offset.height,forKey:yK);UserDefaults.standard.set(isCompact,forKey:cK);UserDefaults.standard.set(transparency,forKey:tK)}
              func reset(){offset = .zero;isCompact=false;transparency=0.85;save()}
          }
          @MainActor
          final class AIOverlayPosition: ObservableObject {
              @Published var offset:CGSize=CGSize(width:0,height:-220)
              @Published var isVisible:Bool=false
              @Published var isChatMode:Bool=false
              private let xK="ai_x_v54",yK="ai_y_v54"
              init(){let x=UserDefaults.standard.double(forKey:xK);let y=UserDefaults.standard.double(forKey:yK);if x != 0||y != 0{offset=CGSize(width:x,height:y)}}
              func save(){UserDefaults.standard.set(offset.width,forKey:xK);UserDefaults.standard.set(offset.height,forKey:yK)}
              func reset(){offset=CGSize(width:0,height:-220);save()}
          }
          '''

          files["Sources/AnalysisCache.swift"] = r'''
          import Foundation
          actor AnalysisCache {
              static let shared = AnalysisCache()
              private struct Entry{let moves:[TopMove];let depth:Int;let sources:String;let confidence:Int}
              private var cache:[String:Entry]=[:]
              private var order:[String]=[]
              func get(fen:String)->(moves:[TopMove],depth:Int,sources:String,confidence:Int)?{
                  guard let e=cache[fen] else{return nil};order.removeAll{$0==fen};order.append(fen);return(e.moves,e.depth,e.sources,e.confidence)
              }
              func set(fen:String,moves:[TopMove],depth:Int,sources:String,confidence:Int){
                  cache[fen]=Entry(moves:moves,depth:depth,sources:sources,confidence:confidence)
                  order.removeAll{$0==fen};order.append(fen)
                  while order.count>500{let o=order.removeFirst();cache.removeValue(forKey:o)}
              }
              func clear(){cache.removeAll();order.removeAll()}
              func count()->Int{cache.count}
          }
          '''

          files["Sources/HapticManager.swift"] = r'''
          import UIKit
          enum HapticManager {
              static func moveReady(){UIImpactFeedbackGenerator(style:.light).impactOccurred(intensity:0.5)}
              static func blunderWarning(){UINotificationFeedbackGenerator().notificationOccurred(.warning)}
              static func success(){UINotificationFeedbackGenerator().notificationOccurred(.success)}
              static func selection(){UISelectionFeedbackGenerator().selectionChanged()}
          }
          '''

          files["Sources/VoiceManager.swift"] = r'''
          import Foundation
          import AVFoundation
          @MainActor
          final class VoiceManager: ObservableObject {
              static let shared = VoiceManager()
              private let synth = AVSpeechSynthesizer()
              private init(){
                  do{try AVAudioSession.sharedInstance().setCategory(.playback,mode:.voicePrompt,options:[.mixWithOthers,.duckOthers]);try AVAudioSession.sharedInstance().setActive(true)}catch{}
              }
              func speakMove(uci:String,san:String,isArabic:Bool){
                  let text=isArabic ? descAr(uci:uci,san:san):descEn(uci:uci,san:san)
                  speak(text:text,isArabic:isArabic)
              }
              func speak(text:String,isArabic:Bool){
                  synth.stopSpeaking(at:.immediate)
                  let u=AVSpeechUtterance(string:text);u.voice=AVSpeechSynthesisVoice(language:isArabic ? "ar-SA":"en-US");u.rate=0.5;u.volume=1.0;synth.speak(u)
              }
              func stop(){synth.stopSpeaking(at:.immediate)}
              private func descAr(uci:String,san:String)->String{"\(detectPiece(san:san,ar:true)) إلى \(arabicSq(extractSq(uci:uci)))"}
              private func descEn(uci:String,san:String)->String{"\(detectPiece(san:san,ar:false)) to \(extractSq(uci:uci))"}
              private func detectPiece(san:String,ar:Bool)->String{
                  switch san.first ?? "P"{
                  case "K":return ar ? "الملك":"King";case "Q":return ar ? "الوزير":"Queen";case "R":return ar ? "القلعة":"Rook"
                  case "B":return ar ? "الفيل":"Bishop";case "N":return ar ? "الحصان":"Knight"
                  case "O":return san.hasPrefix("O-O-O") ? (ar ? "تبييت طويل":"Long castle"):(ar ? "تبييت قصير":"Short castle")
                  default:return ar ? "الجندي":"Pawn"
                  }
              }
              private func extractSq(uci:String)->String{uci.count>=4 ? String(uci.dropFirst(2).prefix(2)):uci}
              private func arabicSq(_ sq:String)->String{
                  guard let f=sq.first,let r=sq.last else{return sq}
                  let fa:String;switch f{case "a":fa="أ";case "b":fa="ب";case "c":fa="ج";case "d":fa="د";case "e":fa="هـ";case "f":fa="و";case "g":fa="ز";case "h":fa="ح";default:fa=String(f)}
                  return "\(fa)\(r)"
              }
          }
          '''

          files["Sources/GameRecorder.swift"] = r'''
          import Foundation
          import SwiftUI
          @MainActor
          final class GameRecorder: ObservableObject {
              struct MoveRecord: Identifiable,Codable{let id:UUID;let ply:Int;let uci:String;let san:String;let fenBefore:String;let fenAfter:String;let evalBefore:Int?;let evalAfter:Int?;let wasMyMove:Bool;let quality:String;let bestAlternative:String?;let cpLoss:Int;let timestamp:Date}
              @Published var moves:[MoveRecord]=[]
              @Published var gameId:UUID=UUID()
              @Published var currentAccuracy:Double=100.0
              @Published var myMoveCount:Int=0
              @Published var brilliantCount=0,bestCount=0,goodCount=0,inaccuracyCount=0,mistakeCount=0,blunderCount=0

              func recordMove(previousFen:String,previousEval:Int?,currentFen:String,currentEval:Int?,lastMoveUCI:String,wasMyMove:Bool,bestMoveUCI:String?,plyCount:Int){
                  guard !lastMoveUCI.isEmpty else{return}
                  var cpLoss=0;if let p=previousEval,let c=currentEval{cpLoss=max(0,(p-c)*(wasMyMove ? 1:-1))}
                  let q:String;switch cpLoss{case ..<(-30):q="brilliant";case(-30)...15:q="best";case 16...49:q="good";case 50...99:q="inaccuracy";case 100...299:q="mistake";default:q="blunder"}
                  let isBest=(bestMoveUCI==lastMoveUCI);let fq=isBest ? "best":q
                  moves.append(MoveRecord(id:UUID(),ply:plyCount,uci:lastMoveUCI,san:lastMoveUCI,fenBefore:previousFen,fenAfter:currentFen,evalBefore:previousEval,evalAfter:currentEval,wasMyMove:wasMyMove,quality:fq,bestAlternative:isBest ? nil:bestMoveUCI,cpLoss:cpLoss,timestamp:Date()))
                  if wasMyMove{myMoveCount+=1;switch fq{case "brilliant":brilliantCount+=1;case "best":bestCount+=1;case "good":goodCount+=1;case "inaccuracy":inaccuracyCount+=1;case "mistake":mistakeCount+=1;case "blunder":blunderCount+=1;default:break};recomputeAccuracy()}
              }
              func startNewGame(){moves=[];gameId=UUID();currentAccuracy=100.0;myMoveCount=0;brilliantCount=0;bestCount=0;goodCount=0;inaccuracyCount=0;mistakeCount=0;blunderCount=0}
              private func recomputeAccuracy(){guard myMoveCount>0 else{currentAccuracy=100.0;return};let total=brilliantCount*100+bestCount*100+goodCount*90+inaccuracyCount*70+mistakeCount*40+blunderCount*10;currentAccuracy=Double(total)/Double(myMoveCount)}
              private let storeKey="chess_helper_game_history"
              func saveCurrentGame(){guard !moves.isEmpty else{return};var h=loadHistory();h.insert(GameHistoryEntry(id:gameId,date:Date(),moves:moves,accuracy:currentAccuracy),at:0);if h.count>20{h=Array(h.prefix(20))};if let d=try? JSONEncoder().encode(h){UserDefaults.standard.set(d,forKey:storeKey)}}
              func loadHistory()->[GameHistoryEntry]{guard let d=UserDefaults.standard.data(forKey:storeKey),let h=try? JSONDecoder().decode([GameHistoryEntry].self,from:d) else{return[]};return h}
              func clearHistory(){UserDefaults.standard.removeObject(forKey:storeKey)}
              func exportAsPGN()->String{var pgn="[Event \"Chess Helper\"]\n[Date \"\(DateFormatter().string(from:Date()))\"]\n\n";for(i,m) in moves.enumerated(){if i%2==0{pgn+="\(i/2+1). "};pgn+="\(m.uci) "};pgn+="*";return pgn}
          }
          struct GameHistoryEntry:Identifiable,Codable{let id:UUID;let date:Date;let moves:[GameRecorder.MoveRecord];let accuracy:Double}
          '''

          files["Sources/GroqService.swift"] = r'''
          import Foundation
          enum GroqService {
              struct ChatMessage:Codable{let role:String;let content:String}
              enum GroqError:Error,LocalizedError{
                  case noKey,invalidKey,networkError(String),rateLimited,parseError
                  var errorDescription:String?{switch self{case .noKey:return "No Groq API key";case .invalidKey:return "Invalid key";case .networkError(let m):return m;case .rateLimited:return "Rate limited";case .parseError:return "Bad response"}}
              }
              static func chat(messages:[ChatMessage],temperature:Double=0.3) async throws->String{
                  guard let apiKey=KeychainStore.load(account:KeychainStore.groqKeyAccount),!apiKey.isEmpty else{throw GroqError.noKey}
                  guard let url=URL(string:"https://api.groq.com/openai/v1/chat/completions") else{throw GroqError.networkError("Bad URL")}
                  var req=URLRequest(url:url);req.httpMethod="POST";req.setValue("application/json",forHTTPHeaderField:"Content-Type");req.setValue("Bearer \(apiKey)",forHTTPHeaderField:"Authorization");req.timeoutInterval=30
                  let body:[String:Any]=["model":"llama-3.3-70b-versatile","messages":messages.map{["role":$0.role,"content":$0.content]},"temperature":temperature,"max_tokens":500,"top_p":0.9]
                  req.httpBody=try JSONSerialization.data(withJSONObject:body)
                  let(data,resp)=try await URLSession.shared.data(for:req)
                  guard let http=resp as? HTTPURLResponse else{throw GroqError.networkError("No response")}
                  if http.statusCode==401{throw GroqError.invalidKey};if http.statusCode==429{throw GroqError.rateLimited}
                  guard(200..<300).contains(http.statusCode) else{throw GroqError.networkError("HTTP \(http.statusCode)")}
                  guard let json=try? JSONSerialization.jsonObject(with:data) as?[String:Any],let choices=json["choices"] as?[[String:Any]],let first=choices.first,let message=first["message"] as?[String:Any],let content=message["content"] as? String else{throw GroqError.parseError}
                  return content.trimmingCharacters(in:.whitespacesAndNewlines)
              }
              static func explainMove(fen:String,uci:String,san:String,eval:String,isArabic:Bool,ranking:Int,totalMoves:Int) async throws->String{
                  let sys=isArabic ? "أنت مدرب شطرنج محترف. اشرح بالعربية.":"GM-level chess coach."
                  let usr=isArabic ? "الموقف:\(fen)\nالنقلة #\(ranking):\(san)(\(uci))\nالتقييم:\(eval)\n\n1)لماذا جيدة؟2)الخطة3)تهديدات4)نصائح\n4-6أسطر.":"Position:\(fen)\nMove #\(ranking):\(san)(\(uci))\nEval:\(eval)\n\n1)Why good?2)Plan3)Threats4)Tips\n4-6 lines."
                  return try await chat(messages:[ChatMessage(role:"system",content:sys),ChatMessage(role:"user",content:usr)],temperature:0.4)
              }
              static func askAboutPosition(fen:String,question:String,isArabic:Bool,history:[ChatMessage]=[]) async throws->String{
