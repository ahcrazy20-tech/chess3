                  }.padding(.horizontal, 10).padding(.vertical, 3).background(Color.red.opacity(0.15))
              }
              
              private var tablebaseBar: some View {
                  HStack(spacing: 4) {
                      Image(systemName: "crown.fill").font(.caption2).foregroundColor(.cyan)
                      Text("TB: \(engine.tablebaseCategory)").font(.caption2.bold()).foregroundColor(.cyan)
                      Spacer()
                  }.padding(.horizontal, 10).padding(.vertical, 3).background(Color.cyan.opacity(0.15))
              }
              
              private var header: some View {
                  HStack(spacing: 6) {
