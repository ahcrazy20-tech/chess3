          import SwiftUI
          struct HelperOverlay: View {
              @ObservedObject var engine: EngineViewModel
              @ObservedObject var stealth: StealthManager
              @ObservedObject var overlayPos: OverlayPosition
              @ObservedObject var aiVM: AIAssistantViewModel
