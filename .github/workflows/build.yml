          import SwiftUI
          struct ReviewView: View {
              @ObservedObject var recorder: GameRecorder
              @ObservedObject var language: AppLanguage
              @State private var showAIReview = false
              @State private var aiReviewText = ""
              @State private var isLoadingReview = false
              @State private var showHistory = false
