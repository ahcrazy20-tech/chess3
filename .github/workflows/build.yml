                              Image(systemName: "paperplane.fill").foregroundColor(.blue).padding(6).background(Color.blue.opacity(0.2)).cornerRadius(6)
                          }.disabled(aiVM.chatInput.trimmingCharacters(in: .whitespaces).isEmpty || aiVM.isLoadingChat)
                          if !aiVM.chatMessages.isEmpty { Button { aiVM.clearChat() } label: { Image(systemName: "trash").foregroundColor(.red.opacity(0.7)).font(.caption) } }
                      }.padding(8).background(Color.black.opacity(0.2))
                  }
              }
          }
