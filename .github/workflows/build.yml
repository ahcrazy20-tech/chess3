      - name: Write reader.js
        run: |
          cat > Resources/reader.js <<'EOF'
          (function(){
            if (window['__READER_FLAG__']) return;
            Object.defineProperty(window, '__READER_FLAG__', { value: true, enumerable: false, writable: false, configurable: false });
            var PM={wp:'P',wn:'N',wb:'B',wr:'R',wq:'Q',wk:'K',bp:'p',bn:'n',bb:'b',br:'r',bq:'q',bk:'k'};
            var PN={king:'K',queen:'Q',rook:'R',bishop:'B',knight:'N',pawn:'P'};
            function fb(){return document.querySelector('wc-chess-board,chess-board,cg-board,.board-layout-chessboard');}
            function rg(b){
              var g=[[],[],[],[],[],[],[],[]];
              for(var i=0;i<8;i++) g[i]=['.','.','.','.','.','.','.','.'];
              var ns=b.querySelectorAll('.piece,piece,[data-piece]');
              if(!ns.length)return null;
              for(var k=0;k<ns.length;k++){
                var n=ns[k],p=null,f=null,r=null;
                var c=(n.className||'').toString();
                var parts=c.split(/\s+/);
                for(var i=0;i<parts.length;i++) if(PM[parts[i]]) p=PM[parts[i]];
                if(!p){var dp=n.getAttribute&&n.getAttribute('data-piece'); if(dp&&PM[dp]) p=PM[dp];}
                if(!p){
                  var lp=c.toLowerCase().split(/\s+/);
                  var co=null,na=null;
                  for(var i=0;i<lp.length;i++){if(lp[i]==='white'||lp[i]==='black')co=lp[i]; if(PN[lp[i]])na=lp[i];}
                  if(co&&na){var l=PN[na]; p=co==='white'?l:l.toLowerCase();}
                }
                for(var i=0;i<parts.length;i++){var m=/^square-(\d)(\d)$/.exec(parts[i]); if(m){f=+m[1];r=+m[2];}}
                if(f===null){var ds=n.getAttribute&&n.getAttribute('data-square'); if(ds&&ds.length===2){f=ds.charCodeAt(0)-96;r=parseInt(ds[1],10);}}
                if(f===null){
                  var st=(n.getAttribute&&n.getAttribute('style'))||'';
                  var m2=/translate\(\s*(-?\d+(?:\.\d+)?)%?\s*,\s*(-?\d+(?:\.\d+)?)%?/.exec(st);
                  if(m2){var co2=Math.round(parseFloat(m2[1])/12.5),ro=Math.round(parseFloat(m2[2])/12.5); if(co2>=0&&co2<=7&&ro>=0&&ro<=7){f=co2+1;r=8-ro;}}
                }
                if(p&&f&&r&&r>=1&&r<=8&&f>=1&&f<=8) g[8-r][f-1]=p;
              }
              return g;
            }
            function df(b,grid){
              var confident=false, flipped=false;
              var el=b;
              for(var i=0;i<6&&el;i++){
                if(el.classList&&el.classList.contains('flipped')){flipped=true;confident=true;break;}
                el=el.parentElement;
              }
              if(b.hasAttribute('flipped')){flipped=true;confident=true;}
              var o=b.getAttribute('orientation');
              if(o==='black'){flipped=true;confident=true;}
              if(o==='white'){flipped=false;confident=true;}
              // STRONGEST signal: white king row position
              if(grid){
                var wkRow=-1;
                for(var r=0;r<8;r++){ for(var c=0;c<8;c++){ if(grid[r][c]==='K'){wkRow=r;break;} } if(wkRow>=0)break; }
                if(wkRow>=0){flipped=wkRow<4; confident=true;}
              }
              return {flipped:flipped, confident:confident};
            }
            function dp(){
              var pn=document.querySelectorAll('[data-ply]');
              if(pn.length){var m=-1; for(var i=0;i<pn.length;i++){var p=parseInt(pn[i].getAttribute('data-ply'),10); if(!isNaN(p)&&p>m)m=p;} if(m>=0)return m;}
              return -1;
            }
            var prevGrid=null, lastPayload='', lastSide='w', tickTimer=null;
            function diff(p,c){
              if(!p||!c)return null;
              var changes=[];
              for(var r=0;r<8;r++) for(var x=0;x<8;x++) if(p[r][x]!==c[r][x]) changes.push({r:r,c:x,before:p[r][x],after:c[r][x]});
              if(changes.length<2||changes.length>4)return null;
              var t=null,f=null;
              for(var i=0;i<changes.length;i++){
                if(changes[i].after!=='.'&&changes[i].after!==changes[i].before) t=changes[i];
                if(changes[i].before!=='.'&&changes[i].after==='.') f=changes[i];
              }
              if(!t||!f)return null;
              var fr=String.fromCharCode(97+f.c)+(8-f.r), to=String.fromCharCode(97+t.c)+(8-t.r);
              var mc=t.after===t.after.toUpperCase()?'w':'b';
              return {uci:fr+to, movedColor:mc};
            }
            function tick(){
              var b=fb(); if(!b) return;
              var g=rg(b); if(!g) return;
              var side=null, cf='low';
              var p=dp();
              if(p>=0){side=(p%2===0)?'w':'b'; cf='high';}
              var m=diff(prevGrid,g);
              if(m&&!side){side=(m.movedColor==='w')?'b':'w'; cf='low';}
              if(!side) side=lastSide;
              lastSide=side;
              var fi=df(b,g);
              var gs='';
              for(var r=0;r<8;r++) for(var c=0;c<8;c++) gs+=g[r][c];
              var py={grid:gs, sideToMove:side, flipped:fi.flipped, flippedConfident:fi.confident,
                      lastMoveUCI:m?m.uci:'', plyCount:p, detectionConfidence:cf};
              var k=JSON.stringify(py);
              if(k!==lastPayload){
                lastPayload=k;
                try{ window.webkit.messageHandlers['__BRIDGE_NAME__'].postMessage(py); }catch(e){}
              }
              prevGrid=g;
            }
            Object.defineProperty(window, '__START_FUNC__', {
              value: function(){
                if(tickTimer) return;
                var iv = __READER_INTERVAL__ + Math.floor(Math.random()*200);
                tickTimer = setInterval(tick, iv);
              },
              enumerable: false, writable: false, configurable: false
            });
            try {
              var mo = new MutationObserver(function(){ try{ tick(); }catch(e){} });
              mo.observe(document.documentElement, {childList:true, subtree:true, attributes:true});
            } catch(e){}
            setTimeout(function(){ try{ window['__START_FUNC__'](); }catch(e){} }, 300 + Math.floor(Math.random()*400));
          })();
          EOF

      - name: Write adblock_css.css
        run: |
          cat > Resources/adblock_css.css <<'EOF'
          [id*="google_ads"],[id^="div-gpt-ad"],iframe[src*="doubleclick"],iframe[src*="googlesyndication"],
          ins.adsbygoogle,.ad-container,.ad-slot,.ads,.ad,.advertisement,.house-ad,.google-ad,
          .diamond-membership-modal,[data-ad-slot],[data-ad-unit],.cookie-banner-component,
          .cookie-consent,#onetrust-banner-sdk,.notifications-component,.upgrade-banner,
          .upsell-banner,.membership-billing-banner,.trial-cta,.diamond-upgrade,.premium-upgrade,
          .sidebar-ad,.leaderboard-ad,.right-rail-ad,.top-banner-component,.header-notification,.marketing-banner
          {display:none!important;height:0!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;}
          EOF

      - name: Show file tree
        run: find Sources Resources -type f | sort

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          set -eo pipefail
          xcodebuild -project ChessHelper.xcodeproj -scheme ChessHelper \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" ONLY_ACTIVE_ARCH=NO ARCHS=arm64 build

      - name: Package .ipa
        run: |
          set -eo pipefail
          APP="$(find build/Build/Products -type d -name 'ChessHelper.app' | head -n 1)"
          [ -n "$APP" ] || { echo "Not found"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr ChessHelper-unsigned.ipa Payload
          ls -lh ChessHelper-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-unsigned-ipa
          path: ChessHelper-unsigned.ipa
          retention-days: 90

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChessHelper-unsigned.ipa
          generate_release_notes: true
