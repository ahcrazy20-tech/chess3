                  let grid: String, sideToMove: String
                  let flipped: Bool, flippedConfident: Bool
                  let lastMoveUCI: String, plyCount: Int, detectionConfidence: String
                  let bottomColor: String
              }
              
              func ingest(_ p: BoardPayload) {
                  guard enabled else { return }
                  sideToMove = p.sideToMove; lastMoveUCI = p.lastMoveUCI; plyCount = p.plyCount
                  confidence = DetectionConfidence(rawValue: p.detectionConfidence) ?? .unknown
                  
                  // ✅ FIXED: Use flipped to detect player color correctly
                  // flipped = true means black is at bottom = you are black
                  // flipped = false means white is at bottom = you are white
                  if manualPlayerColor == nil {
                      if p.flippedConfident {
                          detectedPlayerColor = p.flipped ? "b" : "w"
                      } else if !p.bottomColor.isEmpty {
                          detectedPlayerColor = p.bottomColor
                      }
                  }
                  
                  if p.plyCount > lastKnownPly && !p.lastMoveUCI.isEmpty {
                      moveHistoryUCI.append(p.lastMoveUCI); lastKnownPly = p.plyCount
                  }
                  if p.plyCount == 0 || p.plyCount < lastKnownPly - 2 { resetFenTracker(); lastKnownPly = p.plyCount }
                  let chars = Array(p.grid); guard chars.count == 64 else { return }
                  var grid: [[Character]] = Array(repeating: Array(repeating: ".", count: 8), count: 8)
                  for r in 0..<8 { for c in 0..<8 { grid[r][c] = chars[r * 8 + c] } }
                  if p.flipped {
                      var f: [[Character]] = Array(repeating: Array(repeating: ".", count: 8), count: 8)
                      for r in 0..<8 { for c in 0..<8 { f[r][c] = grid[7 - r][7 - c] } }
                      grid = f
                  }
