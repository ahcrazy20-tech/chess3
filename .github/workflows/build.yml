          '''

          files["Sources/StealthConfig.swift"] = r'''
          import Foundation
          enum StealthConfig {
              static let bridgeName: String = randomName(prefix: "_", length: 6)
              static let readerFlag: String = randomName(prefix: "_", length: 8)
              static let startFuncName: String = randomName(prefix: "_", length: 8)
              private static let userAgents = [
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.6 Mobile/15E148 Safari/604.1",
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 17_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.1 Mobile/15E148 Safari/604.1",
              ]
              static func randomUserAgent() -> String { userAgents.randomElement()! }
              static func readerInterval() -> Int { Int.random(in: 600...1200) }
              private static func randomName(prefix: String, length: Int) -> String {
                  let chars = "abcdefghijklmnopqrstuvwxyz0123456789"
                  return prefix + String((0..<length).map { _ in chars.randomElement()! })
              }
          }
          '''

          files["Sources/FenValidator.swift"] = r'''
          import Foundation
          enum FenValidator {
              static func validate(_ fen: String) -> String? {
                  let parts = fen.split(separator: " ").map(String.init)
                  guard parts.count >= 4 else { return "not enough FEN fields" }
                  let ranks = parts[0].split(separator: "/").map(String.init)
                  guard ranks.count == 8 else { return "not 8 ranks" }
                  var whiteKings = 0, blackKings = 0, totalPieces = 0
                  for rank in ranks {
                      var count = 0
                      for ch in rank {
                          if let d = ch.wholeNumberValue { count += d }
                          else {
                              count += 1
                              totalPieces += 1
                              if ch == "K" { whiteKings += 1 }
                              if ch == "k" { blackKings += 1 }
                          }
                      }
                      if count != 8 { return "rank has \(count) squares" }
                  }
                  if whiteKings != 1 { return "\(whiteKings) white kings" }
                  if blackKings != 1 { return "\(blackKings) black kings" }
                  if totalPieces < 4 { return "only \(totalPieces) pieces" }
                  if totalPieces > 32 { return "\(totalPieces) pieces (invalid)" }
                  return nil
              }
          }
          '''

          # ============ FIXED FEN Builder with proper castling & EP tracking ============
          files["Sources/FenBuilder.swift"] = r'''
          import Foundation

          /// Builds accurate FEN by tracking game state over time.
          /// Fixes castling rights and en-passant detection which were broken before.
          @MainActor
          final class FenBuilder {
              // State that persists across positions
              private var whiteKingMoved = false
              private var blackKingMoved = false
              private var whiteRookA1Moved = false
              private var whiteRookH1Moved = false
              private var blackRookA8Moved = false
              private var blackRookH8Moved = false
              private var lastEPTarget: String? = nil  // "e3" if pawn just moved 2 squares
              private var halfmoveClock: Int = 0        // for 50-move rule
              private var lastGridState: [[Character]]? = nil
              private var lastPly: Int = -1

              /// Reset all tracking (for new game)
              func reset() {
                  whiteKingMoved = false
                  blackKingMoved = false
                  whiteRookA1Moved = false
                  whiteRookH1Moved = false
                  blackRookA8Moved = false
                  blackRookH8Moved = false
                  lastEPTarget = nil
                  halfmoveClock = 0
                  lastGridState = nil
                  lastPly = -1
              }

              /// Build accurate FEN from grid + game state
              func build(grid: [[Character]], sideToMove: String, plyCount: Int) -> String {
                  // Detect what moved since last position
                  updateStateFromDiff(newGrid: grid, newPly: plyCount)
                  lastGridState = grid
                  lastPly = plyCount

                  let boardFen = buildBoardFen(from: grid)
                  let castling = deriveCastlingRights(from: grid)
                  let ep = lastEPTarget ?? "-"
                  let fullmove = max(1, (plyCount / 2) + 1)
                  return "\(boardFen) \(sideToMove) \(castling) \(ep) \(halfmoveClock) \(fullmove)"
              }

              /// Detect what changed and update state
              private func updateStateFromDiff(newGrid: [[Character]], newPly: Int) {
                  guard let old = lastGridState else {
                      // First position: reset if it's the starting position
                      if isStartingPosition(newGrid) { reset() }
                      return
                  }
                  // If ply went backwards or jumped, treat as new game
                  if newPly < lastPly || newPly > lastPly + 2 {
                      reset()
                      lastGridState = newGrid
                      return
                  }
                  // Find changed squares
                  var changes: [(row: Int, col: Int, before: Character, after: Character)] = []
                  for r in 0..<8 {
                      for c in 0..<8 {
                          if old[r][c] != newGrid[r][c] {
                              changes.append((r, c, old[r][c], newGrid[r][c]))
                          }
                      }
                  }
                  // No change? nothing to update
                  guard !changes.isEmpty else { return }

                  // Find "from" square (had piece, now empty) and "to" square (had different, now has piece)
                  let fromSquare = changes.first { $0.before != "." && $0.after == "." }
                  let toSquare = changes.first { $0.after != "." && $0.after != $0.before }
                  guard let from = fromSquare, let to = toSquare else {
                      // Complex change (probably castling) - handle separately
                      handleCastlingIfNeeded(changes: changes)
                      lastEPTarget = nil
                      return
                  }
                  let movedPiece = to.after
                  // Track king moves
                  if movedPiece == "K" { whiteKingMoved = true }
                  if movedPiece == "k" { blackKingMoved = true }
                  // Track rook moves (using ORIGINAL row indices: 7=rank 1 white, 0=rank 8 black)
                  if from.row == 7 && from.col == 0 && movedPiece == "R" { whiteRookA1Moved = true }
                  if from.row == 7 && from.col == 7 && movedPiece == "R" { whiteRookH1Moved = true }
                  if from.row == 0 && from.col == 0 && movedPiece == "r" { blackRookA8Moved = true }
                  if from.row == 0 && from.col == 7 && movedPiece == "r" { blackRookH8Moved = true }
                  // Track rook captures on original squares
                  if to.row == 7 && to.col == 0 { whiteRookA1Moved = true }
                  if to.row == 7 && to.col == 7 { whiteRookH1Moved = true }
                  if to.row == 0 && to.col == 0 { blackRookA8Moved = true }
                  if to.row == 0 && to.col == 7 { blackRookH8Moved = true }
                  // Castling detection: king moved 2 squares
                  handleCastlingIfNeeded(changes: changes)
                  // En passant detection: pawn moved 2 squares
                  lastEPTarget = nil
                  if (movedPiece == "P" || movedPiece == "p") && abs(from.row - to.row) == 2 {
                      let epRow = (from.row + to.row) / 2
                      lastEPTarget = squareName(row: epRow, col: to.col)
                  }
                  // Halfmove clock (increment unless pawn move or capture)
                  let isCapture = changes.count >= 2 && changes.contains { $0.before != "." && $0.after != "." }
                  if movedPiece == "P" || movedPiece == "p" || isCapture {
                      halfmoveClock = 0
                  } else {
                      halfmoveClock += 1
                  }
              }

              private func handleCastlingIfNeeded(changes: [(row: Int, col: Int, before: Character, after: Character)]) {
                  // Castling produces 4 changes: king from e1/e8, king to g1/c1 (or g8/c8), rook from h1/a1, rook to f1/d1
                  guard changes.count >= 3 else { return }
                  for change in changes {
                      if change.before == "K" && change.after == "." && change.row == 7 && change.col == 4 {
                          whiteKingMoved = true
                      }
                      if change.before == "k" && change.after == "." && change.row == 0 && change.col == 4 {
                          blackKingMoved = true
                      }
                  }
              }

              private func isStartingPosition(_ grid: [[Character]]) -> Bool {
                  // Row 0 (rank 8, black back rank)
                  let row0 = String(grid[0])
                  guard row0 == "rnbqkbnr" else { return false }
                  // Row 1 (rank 7, black pawns)
                  let row1 = String(grid[1])
                  guard row1 == "pppppppp" else { return false }
                  // Row 6 (rank 2, white pawns)
                  let row6 = String(grid[6])
                  guard row6 == "PPPPPPPP" else { return false }
                  // Row 7 (rank 1, white back rank)
                  let row7 = String(grid[7])
                  guard row7 == "RNBQKBNR" else { return false }
                  return true
              }

              private func buildBoardFen(from grid: [[Character]]) -> String {
                  var rows: [String] = []
                  for r in 0..<8 {
                      var row = ""
                      var empty = 0
                      for c in 0..<8 {
                          let ch = grid[r][c]
                          if ch == "." {
                              empty += 1
                          } else {
                              if empty > 0 { row += "\(empty)"; empty = 0 }
                              row.append(ch)
                          }
                      }
                      if empty > 0 { row += "\(empty)" }
                      rows.append(row)
                  }
                  return rows.joined(separator: "/")
              }

              private func deriveCastlingRights(from grid: [[Character]]) -> String {
                  var s = ""
                  // White kingside: K not moved, H1 rook not moved, both still in place
                  if !whiteKingMoved && !whiteRookH1Moved
                      && grid[7][4] == "K" && grid[7][7] == "R" { s += "K" }
                  if !whiteKingMoved && !whiteRookA1Moved
                      && grid[7][4] == "K" && grid[7][0] == "R" { s += "Q" }
                  if !blackKingMoved && !blackRookH8Moved
                      && grid[0][4] == "k" && grid[0][7] == "r" { s += "k" }
                  if !blackKingMoved && !blackRookA8Moved
                      && grid[0][4] == "k" && grid[0][0] == "r" { s += "q" }
                  return s.isEmpty ? "-" : s
              }

              private func squareName(row: Int, col: Int) -> String {
                  let file = Character(UnicodeScalar(97 + col)!)
                  let rank = 8 - row
                  return "\(file)\(rank)"
              }
          }
          '''

          # ============ Overlay Position (draggable) ============
          files["Sources/OverlayPosition.swift"] = r'''
          import SwiftUI

          /// Persists overlay position across launches
          @MainActor
          final class OverlayPosition: ObservableObject {
              @Published var offset: CGSize = .zero
              @Published var isCompact: Bool = false
              @Published var transparency: Double = 0.85  // 0=fully transparent, 1=solid

              private let offsetXKey = "overlay_offset_x"
              private let offsetYKey = "overlay_offset_y"
              private let compactKey = "overlay_compact"
              private let transparencyKey = "overlay_transparency"

              init() {
                  let x = UserDefaults.standard.double(forKey: offsetXKey)
                  let y = UserDefaults.standard.double(forKey: offsetYKey)
                  offset = CGSize(width: x, height: y)
                  isCompact = UserDefaults.standard.bool(forKey: compactKey)
                  let t = UserDefaults.standard.double(forKey: transparencyKey)
                  transparency = t > 0 ? t : 0.85
              }

              func save() {
                  UserDefaults.standard.set(offset.width, forKey: offsetXKey)
                  UserDefaults.standard.set(offset.height, forKey: offsetYKey)
                  UserDefaults.standard.set(isCompact, forKey: compactKey)
                  UserDefaults.standard.set(transparency, forKey: transparencyKey)
              }

              func reset() {
                  offset = .zero
                  isCompact = false
                  transparency = 0.85
                  save()
              }
          }
          '''

          files["Sources/OpeningBook.swift"] = r'''
          import Foundation
          struct OpeningEntry {
              let name: String
              let moves: [String]
          }
          enum OpeningBook {
              static let entries: [OpeningEntry] = [
                  OpeningEntry(name: "Italian Game", moves: ["e2e4","e7e5","g1f3","b8c6","f1c4","g8f6","d2d3","f8c5"]),
                  OpeningEntry(name: "Ruy Lopez", moves: ["e2e4","e7e5","g1f3","b8c6","f1b5","a7a6","b5a4","g8f6","e1g1","f8e7"]),
                  OpeningEntry(name: "Scotch Game", moves: ["e2e4","e7e5","g1f3","b8c6","d2d4","e5d4","f3d4"]),
                  OpeningEntry(name: "Vienna Game", moves: ["e2e4","e7e5","b1c3"]),
                  OpeningEntry(name: "King's Gambit", moves: ["e2e4","e7e5","f2f4"]),
                  OpeningEntry(name: "Sicilian Najdorf", moves: ["e2e4","c7c5","g1f3","d7d6","d2d4","c5d4","f3d4","g8f6","b1c3","a7a6"]),
                  OpeningEntry(name: "Sicilian Dragon", moves: ["e2e4","c7c5","g1f3","d7d6","d2d4","c5d4","f3d4","g8f6","b1c3","g7g6"]),
                  OpeningEntry(name: "Sicilian Alapin", moves: ["e2e4","c7c5","c2c3"]),
                  OpeningEntry(name: "Sicilian Rossolimo", moves: ["e2e4","c7c5","g1f3","b8c6","f1b5"]),
                  OpeningEntry(name: "French Defense", moves: ["e2e4","e7e6","d2d4","d7d5"]),
                  OpeningEntry(name: "Caro-Kann Defense", moves: ["e2e4","c7c6","d2d4","d7d5"]),
                  OpeningEntry(name: "Scandinavian", moves: ["e2e4","d7d5"]),
                  OpeningEntry(name: "Pirc Defense", moves: ["e2e4","d7d6","d2d4","g8f6","b1c3","g7g6"]),
                  OpeningEntry(name: "Alekhine Defense", moves: ["e2e4","g8f6"]),
                  OpeningEntry(name: "Bird's Opening", moves: ["f2f4"]),
                  OpeningEntry(name: "From's Gambit", moves: ["f2f4","e7e5"]),
                  OpeningEntry(name: "Queen's Gambit", moves: ["d2d4","d7d5","c2c4"]),
                  OpeningEntry(name: "Queen's Gambit Declined", moves: ["d2d4","d7d5","c2c4","e7e6"]),
                  OpeningEntry(name: "Queen's Gambit Accepted", moves: ["d2d4","d7d5","c2c4","d5c4"]),
                  OpeningEntry(name: "Slav Defense", moves: ["d2d4","d7d5","c2c4","c7c6"]),
                  OpeningEntry(name: "London System", moves: ["d2d4","d7d5","g1f3","g8f6","c1f4"]),
                  OpeningEntry(name: "King's Indian Defense", moves: ["d2d4","g8f6","c2c4","g7g6","b1c3","f8g7"]),
                  OpeningEntry(name: "Nimzo-Indian", moves: ["d2d4","g8f6","c2c4","e7e6","b1c3","f8b4"]),
                  OpeningEntry(name: "Queen's Indian", moves: ["d2d4","g8f6","c2c4","e7e6","g1f3","b7b6"]),
                  OpeningEntry(name: "Grunfeld Defense", moves: ["d2d4","g8f6","c2c4","g7g6","b1c3","d7d5"]),
                  OpeningEntry(name: "Dutch Defense", moves: ["d2d4","f7f5"]),
                  OpeningEntry(name: "English Opening", moves: ["c2c4"]),
                  OpeningEntry(name: "Reti Opening", moves: ["g1f3","d7d5","c2c4"]),
              ]
              static func lookup(history: [String]) -> (name: String, nextMove: String?)? {
                  guard !history.isEmpty else { return nil }
                  var bestMatch: (name: String, nextMove: String?)? = nil
                  var bestLen = 0
                  for entry in entries {
                      guard history.count <= entry.moves.count else { continue }
                      let prefix = Array(entry.moves.prefix(history.count))
                      if prefix == history && history.count > bestLen {
                          bestLen = history.count
                          let next = history.count < entry.moves.count ? entry.moves[history.count] : nil
                          bestMatch = (name: entry.name, nextMove: next)
                      }
                  }
                  return bestMatch
              }
          }
          '''

          files["Sources/AnalysisCache.swift"] = r'''
          import Foundation
          actor AnalysisCache {
              static let shared = AnalysisCache()
              private struct Entry {
                  let moves: [TopMove]
                  let depth: Int
                  let sources: String
                  let confidence: Int
              }
              private var cache: [String: Entry] = [:]
              private var accessOrder: [String] = []
              private let maxEntries = 200

              func get(fen: String) -> (moves: [TopMove], depth: Int, sources: String, confidence: Int)? {
                  guard let entry = cache[fen] else { return nil }
                  accessOrder.removeAll { $0 == fen }
                  accessOrder.append(fen)
                  return (entry.moves, entry.depth, entry.sources, entry.confidence)
              }
              func set(fen: String, moves: [TopMove], depth: Int, sources: String, confidence: Int) {
                  cache[fen] = Entry(moves: moves, depth: depth, sources: sources, confidence: confidence)
                  accessOrder.removeAll { $0 == fen }
                  accessOrder.append(fen)
                  while accessOrder.count > maxEntries {
                      let oldest = accessOrder.removeFirst()
                      cache.removeValue(forKey: oldest)
                  }
              }
              func remove(fen: String) {
                  cache.removeValue(forKey: fen)
                  accessOrder.removeAll { $0 == fen }
              }
              func clear() {
                  cache.removeAll()
                  accessOrder.removeAll()
              }
              func count() -> Int { cache.count }
          }
          '''

          files["Sources/EngineService.swift"] = r'''
          import Foundation

          struct TopMove: Identifiable, Equatable {
              let id = UUID()
              let rank: Int
              let uci: String
              let san: String
              let evaluationCp: Int?
              let mateIn: Int?
              let depth: Int
              let source: String
              let votes: Int
              var evalString: String {
                  if let m = mateIn, m != 0 { return "M\(abs(m))" }
                  if let cp = evaluationCp { return String(format: "%+.2f", Double(cp)/100.0) }
                  return "—"
              }
              var winChance: Double {
                  if let m = mateIn, m != 0 { return m > 0 ? 99 : 1 }
                  guard let cp = evaluationCp else { return 50 }
                  return 50 + 50 * tanh(Double(cp)/400.0)
              }
              var rankScore: Double {
                  if let m = mateIn, m != 0 { return m > 0 ? 100000 - Double(m) : -100000 - Double(m) }
                  return Double(evaluationCp ?? 0)
              }
          }

          struct EngineAnalysis {
              let topMoves: [TopMove]
              let bestMove: TopMove?
              let depth: Int
              let sourcesUsed: String
              let confidence: Int
              let debugFen: String
          }

          enum EngineError: Error, LocalizedError {
              case badFen(String)
              case networkOffline
              case allEnginesFailed
              case cancelled
              var errorDescription: String? {
                  switch self {
                  case .badFen(let msg): return "Bad FEN: \(msg)"
                  case .networkOffline: return "No internet"
                  case .allEnginesFailed: return "All 3 engines offline"
                  case .cancelled: return "Cancelled"
                  }
              }
          }

          enum EngineService {
              static func callLichessCloud(fen: String) async -> [TopMove]? {
                  var comps = URLComponents(string: "https://lichess.org/api/cloud-eval")!
                  comps.queryItems = [
                      URLQueryItem(name: "fen", value: fen),
                      URLQueryItem(name: "multiPv", value: "3")
                  ]
                  guard let url = comps.url else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 5
                  req.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  do {
                      let (data, resp) = try await URLSession.shared.data(for: req)
                      guard let http = resp as? HTTPURLResponse else { return nil }
                      if http.statusCode == 404 { return [] }
                      guard http.statusCode == 200 else { return nil }
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      let depth = (json["depth"] as? Int) ?? 20
                      guard let pvs = json["pvs"] as? [[String: Any]] else { return [] }
                      var moves: [TopMove] = []
                      for (idx, pv) in pvs.prefix(3).enumerated() {
                          let movesStr = (pv["moves"] as? String) ?? ""
                          let firstMove = String(movesStr.split(separator: " ").first ?? "")
                          guard !firstMove.isEmpty else { continue }
                          let cp = pv["cp"] as? Int
                          let mate = pv["mate"] as? Int
                          moves.append(TopMove(rank: idx + 1, uci: firstMove, san: firstMove,
                                               evaluationCp: cp, mateIn: (mate == 0 ? nil : mate),
                                               depth: depth, source: "lc", votes: 1))
                      }
                      return moves
                  } catch { return nil }
              }

              static func callChessApi(fen: String) async -> TopMove? {
                  guard let url = URL(string: "https://chess-api.com/v1") else { return nil }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  req.timeoutInterval = 6
                  req.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                  let body: [String: Any] = ["fen": fen, "depth": 13, "maxThinkingTime": 200]
                  guard let httpBody = try? JSONSerialization.data(withJSONObject: body) else { return nil }
                  req.httpBody = httpBody
                  do {
                      let (data, _) = try await URLSession.shared.data(for: req)
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      let uci = (json["move"] as? String) ?? ""
                      guard !uci.isEmpty else { return nil }
                      let san = (json["san"] as? String) ?? uci
                      let eval = json["eval"] as? Double
                      let mate = json["mate"] as? Int
                      let cp = eval.map { Int(($0 * 100).rounded()) }
                      let d = (json["depth"] as? Int) ?? 13
                      return TopMove(rank: 1, uci: uci, san: san,
                                     evaluationCp: cp, mateIn: (mate == 0 ? nil : mate),
                                     depth: d, source: "cA", votes: 1)
                  } catch { return nil }
              }

              static func callStockfishOnline(fen: String) async -> TopMove? {
                  var comps = URLComponents(string: "https://stockfish.online/api/s/v2.php")!
                  comps.queryItems = [
                      URLQueryItem(name: "fen", value: fen),
                      URLQueryItem(name: "depth", value: "13")
                  ]
                  guard let url = comps.url else { return nil }
                  var req = URLRequest(url: url)
                  req.timeoutInterval = 6
                  req.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                  req.setValue(StealthConfig.randomUserAgent(), forHTTPHeaderField: "User-Agent")
                  do {
                      let (data, _) = try await URLSession.shared.data(for: req)
                      guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return nil }
                      if let success = json["success"] as? Bool, !success { return nil }
                      let bestField = (json["bestmove"] as? String) ?? ""
                      let parts = bestField.split(separator: " ").map(String.init)
                      var uci = ""
                      for (i, p) in parts.enumerated() where p == "bestmove" && i+1 < parts.count {
                          uci = parts[i+1]; break
                      }
                      if uci.isEmpty { uci = parts.first ?? "" }
                      guard !uci.isEmpty else { return nil }
                      let evalDouble = json["evaluation"] as? Double
                      let mate = json["mate"] as? Int
                      let cp: Int? = evalDouble.map { Int(($0 * 100).rounded()) }
                      let d = (json["depth"] as? Int) ?? 13
                      return TopMove(rank: 1, uci: uci, san: uci,
                                     evaluationCp: cp, mateIn: (mate == 0 ? nil : mate),
                                     depth: d, source: "sf", votes: 1)
                  } catch { return nil }
              }

              static func analyzeStreaming(fen: String,
                                            moveHistory: [String],
                                            onUpdate: @escaping @MainActor (EngineAnalysis) -> Void) async throws -> EngineAnalysis {
                  if let issue = FenValidator.validate(fen) {
                      throw EngineError.badFen(issue)
                  }

                  // Cache lookup
                  if let cached = await AnalysisCache.shared.get(fen: fen) {
                      let cachedMoves = cached.moves.enumerated().map { (i, m) in
                          TopMove(rank: i + 1, uci: m.uci, san: m.san,
                                  evaluationCp: m.evaluationCp, mateIn: m.mateIn,
                                  depth: m.depth, source: "cache", votes: m.votes)
                      }
                      let a = EngineAnalysis(
                          topMoves: cachedMoves, bestMove: cachedMoves.first,
                          depth: cached.depth, sourcesUsed: "cache",
                          confidence: cached.confidence, debugFen: fen)
                      await MainActor.run { onUpdate(a) }
                      return a
                  }

                  // 3 engines in parallel
                  async let lichessResult = callLichessCloud(fen: fen)
                  async let chessApiResult = callChessApi(fen: fen)
                  async let stockfishResult = callStockfishOnline(fen: fen)

                  let lichess = await lichessResult
                  try Task.checkCancellation()
                  let cA = await chessApiResult
                  try Task.checkCancellation()
                  let sf = await stockfishResult
                  try Task.checkCancellation()

                  // Merge results by voting
                  var moveVotes: [String: (move: TopMove, votes: Int, sources: [String])] = [:]
                  if let lcMoves = lichess {
                      for m in lcMoves {
                          if var existing = moveVotes[m.uci] {
                              existing.votes += 1
                              existing.sources.append("lc")
                              moveVotes[m.uci] = existing
                          } else {
                              moveVotes[m.uci] = (m, 1, ["lc"])
                          }
                      }
                  }
                  if let m = cA {
                      if var existing = moveVotes[m.uci] {
                          existing.votes += 1
                          existing.sources.append("cA")
                          moveVotes[m.uci] = existing
                      } else {
                          moveVotes[m.uci] = (m, 1, ["cA"])
                      }
                  }
                  if let m = sf {
                      if var existing = moveVotes[m.uci] {
                          existing.votes += 1
                          existing.sources.append("sf")
                          moveVotes[m.uci] = existing
                      } else {
                          moveVotes[m.uci] = (m, 1, ["sf"])
                      }
                  }

                  guard !moveVotes.isEmpty else {
                      if lichess == nil && cA == nil && sf == nil {
                          throw EngineError.networkOffline
                      }
                      throw EngineError.allEnginesFailed
                  }

                  let sortedEntries = moveVotes.values.sorted { a, b in
                      if a.votes != b.votes { return a.votes > b.votes }
                      return a.move.rankScore > b.move.rankScore
                  }

                  let finalMoves: [TopMove] = sortedEntries.prefix(3).enumerated().map { (idx, entry) in
                      TopMove(rank: idx + 1, uci: entry.move.uci, san: entry.move.san,
                              evaluationCp: entry.move.evaluationCp, mateIn: entry.move.mateIn,
                              depth: entry.move.depth,
                              source: entry.sources.joined(separator: "+"),
                              votes: entry.votes)
                  }

                  let topVotes = finalMoves.first?.votes ?? 1
                  let allSources = Array(Set(moveVotes.values.flatMap { $0.sources })).sorted().joined(separator: "+")
                  let bestDepth = finalMoves.map { $0.depth }.max() ?? 13

                  // SANITY CHECK: if all 3 moves have identical eval, FEN is likely wrong
                  // Don't cache in this case!
                  let evalsAreIdentical = finalMoves.count >= 2 &&
                      finalMoves.allSatisfy { $0.evaluationCp == finalMoves.first?.evaluationCp }
                  let shouldCache = !evalsAreIdentical

                  let analysis = EngineAnalysis(
                      topMoves: finalMoves, bestMove: finalMoves.first,
                      depth: bestDepth, sourcesUsed: allSources,
                      confidence: min(topVotes, 3), debugFen: fen
                  )

                  if shouldCache {
                      await AnalysisCache.shared.set(
                          fen: fen, moves: finalMoves, depth: bestDepth,
                          sources: allSources, confidence: min(topVotes, 3))
                  }

                  await MainActor.run { onUpdate(analysis) }
                  return analysis
              }
          }
          '''

