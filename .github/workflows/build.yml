                      }
                  }
                  .onThreeFingerPanic { stealth.toggleOverlay() }
              }
              private var dot: some View {
                  Button { stealth.toggleMinimalMode() } label: {
                      Circle().fill(engine.isMyTurn ? Color.green : Color.gray)
                          .frame(width: 14, height: 14)
                          .overlay(Circle().stroke(Color.white.opacity(0.3), lineWidth: 1))
                  }
              }
              private var panel: some View {
                  VStack(spacing: 0) {
                      header
                      if expanded {
                          colorRow
                          movesSection
                          lastMoveSection
                          openingSection
                          errorSection
                      }
                  }
                  .background(.ultraThinMaterial).cornerRadius(16)
                  .overlay(RoundedRectangle(cornerRadius: 16).stroke(Color.white.opacity(0.08)))
                  .shadow(color: .black.opacity(0.35), radius: 10, y: 3)
              }
              private var header: some View {
                  HStack(spacing: 10) {
                      Circle().fill(engine.enabled ? Color.green : Color.gray).frame(width: 8, height: 8)
                      Text("Chess Helper").font(.subheadline.bold())
                      HStack(spacing: 4) {
                          Image(systemName: engine.isMyTurn ? "person.fill" : "hourglass").font(.caption2)
                          Text(engine.isMyTurn ? "Your turn" : "Waiting").font(.caption2.bold())
                      }
                      .foregroundColor(engine.isMyTurn ? .green : .secondary)
                      if engine.isThinking { ProgressView().scaleEffect(0.7) }
                      Spacer()
                      Button { stealth.toggleMinimalMode() } label: {
                          Image(systemName: stealth.minimalMode ? "eye.slash.fill" : "eye.fill").font(.footnote)
                      }
                      Button { stealth.hide(reason: "manual") } label: {
                          Image(systemName: "xmark.circle.fill").font(.footnote).foregroundColor(.red.opacity(0.7))
                      }
                      Toggle("", isOn: $engine.enabled).labelsHidden().scaleEffect(0.8)
                      Button { withAnimation { expanded.toggle() } } label: {
                          Image(systemName: expanded ? "chevron.down" : "chevron.up").font(.footnote.bold())
                      }
                  }
                  .padding(.horizontal, 12).padding(.vertical, 8).contentShape(Rectangle())
              }
              private var colorRow: some View {
                  HStack(spacing: 6) {
                      Text("I play:").font(.caption2).foregroundColor(.secondary)
                      cbtn("w", "White", "♔")
                      cbtn("b", "Black", "♚")
                      if engine.manualPlayerColor != nil {
                          Button { engine.setManualColor(nil) } label: {
                              Text("Auto").font(.caption2)
                                  .padding(.horizontal, 6).padding(.vertical, 3)
                                  .background(Color.blue.opacity(0.25)).foregroundColor(.blue).cornerRadius(4)
                          }
                      }
                      Spacer()
                      if engine.plyCount >= 0 {
                          Text("ply \(engine.plyCount)").font(.caption2.monospaced()).foregroundColor(.secondary)
                      }
                  }
                  .padding(.horizontal, 12).padding(.bottom, 6)
              }
              private func cbtn(_ color: String, _ label: String, _ sym: String) -> some View {
                  let active = engine.effectivePlayerColor == color
                  return Button { engine.setManualColor(color) } label: {
                      HStack(spacing: 3) {
                          Text(sym).font(.subheadline)
                          Text(label).font(.caption2.bold())
                      }
                      .padding(.horizontal, 8).padding(.vertical, 4)
                      .background(active ? Color.green.opacity(0.35) : Color.white.opacity(0.10))
                      .foregroundColor(active ? .green : .white.opacity(0.85))
                      .cornerRadius(6)
                  }
              }
              private var movesSection: some View {
                  VStack(alignment: .leading, spacing: 4) {
                      Divider().opacity(0.3)
                      HStack {
                          Text(engine.isMyTurn ? "Top moves for you" : "Opponent's best")
                              .font(.caption).foregroundColor(.secondary)
                          Spacer()
                          Text("depth \(engine.depth)").font(.caption2.monospaced()).foregroundColor(.secondary)
                      }
                      .padding(.horizontal, 14).padding(.top, 6)
                      if engine.topMoves.isEmpty {
                          Text("—").font(.title.bold()).padding(.horizontal, 14).padding(.bottom, 4)
                      } else {
                          ForEach(Array(engine.topMoves.enumerated()), id: \.element.id) { idx, m in
                              moveRow(rank: idx + 1, move: m, isBest: idx == 0)
                          }
                      }
                      GeometryReader { geo in
                          ZStack(alignment: .leading) {
                              RoundedRectangle(cornerRadius: 4).fill(Color.black.opacity(0.6))
                              RoundedRectangle(cornerRadius: 4).fill(Color.white)
                                  .frame(width: geo.size.width * CGFloat(myWin / 100.0))
                          }
                      }
                      .frame(height: 8).padding(.horizontal, 14).padding(.top, 4)
                  }
              }
              private func moveRow(rank: Int, move: TopMove, isBest: Bool) -> some View {
                  HStack(spacing: 8) {
                      Text("#\(rank)").font(.caption.bold().monospaced())
                          .foregroundColor(rc(rank)).frame(width: 22)
                      Text(move.san.isEmpty ? move.uci : move.san)
                          .font(isBest ? .title3.bold() : .callout.bold()).foregroundColor(rc(rank))
                      Text(move.uci).font(.caption2.monospaced()).foregroundColor(.secondary)
                      Spacer()
                      Text(move.evalString).font(.caption.bold().monospaced()).foregroundColor(rc(rank))
                  }
                  .padding(.horizontal, 14).padding(.vertical, 3)
                  .background(isBest ? rc(rank).opacity(0.10) : Color.clear)
              }
              private func rc(_ r: Int) -> Color {
                  switch r { case 1: return .green; case 2: return .yellow; case 3: return .orange; default: return .white.opacity(0.7) }
              }
              @ViewBuilder private var lastMoveSection: some View {
                  if engine.lastMoveQuality != .none && !engine.lastMoveUCI.isEmpty {
                      HStack(spacing: 8) {
                          Text(engine.lastMoveWasMine ? "You:" : "Opp:").font(.caption).foregroundColor(.secondary)
                          Text(engine.lastMoveUCI).font(.caption.monospaced()).foregroundColor(.white.opacity(0.85))
                          Spacer()
                          Text(engine.lastMoveQuality.rawValue).font(.caption.bold())
                              .padding(.horizontal, 6).padding(.vertical, 2)
                              .background(engine.lastMoveQuality.color.opacity(0.25))
                              .foregroundColor(engine.lastMoveQuality.color).cornerRadius(4)
                          if engine.lastMoveCentipawnLoss >= 30 {
                              Text("-\(engine.lastMoveCentipawnLoss)cp").font(.caption2.monospaced()).foregroundColor(.orange)
                          }
                      }
                      .padding(.horizontal, 14).padding(.top, 4)
                  }
              }
              @ViewBuilder private var openingSection: some View {
                  if !engine.openingName.isEmpty {
                      HStack(spacing: 6) {
                          Image(systemName: "book.fill").font(.caption2).foregroundColor(.orange)
                          if !engine.openingECO.isEmpty {
                              Text(engine.openingECO).font(.caption2.bold().monospaced()).foregroundColor(.orange)
                          }
                          Text(engine.openingName).font(.caption.bold()).foregroundColor(.white.opacity(0.9)).lineLimit(2)
                          Spacer()
                      }
                      .padding(.horizontal, 14).padding(.top, 4)
                  }
              }
              @ViewBuilder private var errorSection: some View {
                  if !engine.errorMessage.isEmpty {
                      HStack(spacing: 6) {
                          Image(systemName: "exclamationmark.triangle.fill").foregroundColor(.red).font(.caption2)
                          Text(engine.errorMessage).font(.caption2).foregroundColor(.red).lineLimit(2)
                      }
                      .padding(.horizontal, 14).padding(.bottom, 8)
                  } else {
                      Color.clear.frame(height: 8)
                  }
              }
              private var myWin: Double {
                  engine.effectivePlayerColor == engine.sideToMove ? engine.winChance : (100 - engine.winChance)
              }
          }
          '''

          files["Sources/ChessWebView.swift"] = r'''
          import SwiftUI
          import WebKit

          struct ChessWebView: UIViewRepresentable {
              @ObservedObject var engine: EngineViewModel
              @ObservedObject var router: AppRouter
              func makeCoordinator() -> Coordinator { Coordinator(engine: engine) }
              func makeUIView(context: Context) -> WKWebView {
                  let cc = WKUserContentController()
                  if let js = Bundle.main.loadResource(named: "reader", ext: "js") {
                      cc.addUserScript(WKUserScript(source: js, injectionTime: .atDocumentEnd, forMainFrameOnly: false))
                  }
                  if let css = Bundle.main.loadResource(named: "adblock_css", ext: "css") {
                      let injector = "(function(){var s=document.createElement('style');s.textContent=\(cssLit(css));document.documentElement.appendChild(s);})();"
                      cc.addUserScript(WKUserScript(source: injector, injectionTime: .atDocumentStart, forMainFrameOnly: false))
                  }
                  cc.add(context.coordinator, name: "fenBridge")
                  let cfg = WKWebViewConfiguration()
                  cfg.userContentController = cc
                  cfg.websiteDataStore = .default()
                  cfg.allowsInlineMediaPlayback = true
                  cfg.mediaTypesRequiringUserActionForPlayback = []
                  cfg.defaultWebpagePreferences.allowsContentJavaScript = true
                  let wv = WKWebView(frame: .zero, configuration: cfg)
                  wv.navigationDelegate = context.coordinator
                  wv.uiDelegate = context.coordinator
                  wv.allowsBackForwardNavigationGestures = true
                  if #available(iOS 16.4, *) { wv.isInspectable = true }
                  wv.load(URLRequest(url: router.chessURL))
                  context.coordinator.webView = wv
                  context.coordinator.lastTrigger = router.navigateTrigger
                  return wv
              }
              func updateUIView(_ v: WKWebView, context: Context) {
                  if router.navigateTrigger != context.coordinator.lastTrigger {
                      context.coordinator.lastTrigger = router.navigateTrigger
                      v.load(URLRequest(url: router.chessURL))
                  }
              }
              private func cssLit(_ s: String) -> String {
                  let d = try? JSONSerialization.data(withJSONObject: [s])
                  if let d = d, let str = String(data: d, encoding: .utf8) {
                      return String(str.dropFirst().dropLast())
                  }
                  return "\"\""
              }
              final class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate, WKScriptMessageHandler {
                  let engine: EngineViewModel
                  weak var webView: WKWebView?
                  var lastTrigger = 0
                  init(engine: EngineViewModel) { self.engine = engine }
                  func userContentController(_ u: WKUserContentController, didReceive m: WKScriptMessage) {
                      guard m.name == "fenBridge", let d = m.body as? [String: Any] else { return }
                      let p = EngineViewModel.BoardPayload(
                          grid: (d["grid"] as? String) ?? "",
                          sideToMove: (d["sideToMove"] as? String) ?? "w",
                          flipped: (d["flipped"] as? Bool) ?? false,
                          flippedConfident: (d["flippedConfident"] as? Bool) ?? false,
                          lastMoveUCI: (d["lastMoveUCI"] as? String) ?? "",
                          plyCount: (d["plyCount"] as? Int) ?? -1,
                          detectionConfidence: (d["detectionConfidence"] as? String) ?? "unknown"
                      )
                      Task { @MainActor [weak engine] in engine?.ingest(p) }
                  }
                  func webView(_ w: WKWebView, didFinish n: WKNavigation!) {
                      w.evaluateJavaScript("window.__ch_startReader && window.__ch_startReader();", completionHandler: nil)
                  }
                  func webView(_ w: WKWebView, createWebViewWith c: WKWebViewConfiguration,
                               for a: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                      if let url = a.request.url { w.load(URLRequest(url: url)) }
                      return nil
                  }
              }
          }

          extension Bundle {
              func loadResource(named name: String, ext: String) -> String? {
                  if let url = url(forResource: name, withExtension: ext),
                     let s = try? String(contentsOf: url) { return s }
                  return nil
              }
          }
          '''

          for path, content in files.items():
              content = textwrap.dedent(content).strip() + "\n"
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f: f.write(content)
              print(f"  ✅ {path}")
          print(f"\nWrote {len(files)} files")
          PYEOF

