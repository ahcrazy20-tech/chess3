      - name: Fetch & patch Stockfish (local engine)
        shell: bash
        run: |
          set -eo pipefail
          SF_TAG=sf_16.1
          mkdir -p Sources/Engine
          curl -fsSL "https://github.com/official-stockfish/Stockfish/archive/refs/tags/${SF_TAG}.tar.gz" -o /tmp/sf.tar.gz
          tar -xzf /tmp/sf.tar.gz -C /tmp
          rm -rf Sources/Engine/src
          mv "/tmp/Stockfish-${SF_TAG}/src" Sources/Engine/src
          python3 - <<'PYPATCH'
          p = "Sources/Engine/src/main.cpp"
          s = open(p).read()
          assert "int main(int argc, char* argv[])" in s, "main signature not found"
          s = s.replace("int main(int argc, char* argv[])", "int engine_main(int argc, char* argv[])", 1)
          s += '''

          extern "C" int chesshelper_engine_main(int argc, char* argv[]) {
              return engine_main(argc, argv);
          }
          '''
          open(p, "w").write(s)
          print("Stockfish main patched -> engine_main")
          PYPATCH
          mkdir -p Sources/Engine/bridge
          cat > Sources/Engine/bridge/EngineBridge.cpp <<'CPPEOF'
          #include <cstdio>
          #include <unistd.h>

          extern "C" int chesshelper_engine_main(int argc, char* argv[]);

          // Launched on a background thread by LocalEngineService.
          // stdin/stdout/stderr are redirected to POSIX pipes so the
          // UCI protocol flows through file descriptors.
          extern "C" void chesshelper_run_engine(int inFD, int outFD) {
              dup2(inFD, STDIN_FILENO);
              dup2(outFD, STDOUT_FILENO);
              dup2(outFD, STDERR_FILENO);
              // Close the original descriptors now that they're duplicated; the
              // Swift side keeps only its own pipe ends. Doing the close HERE
              // (not in the Swift spawner) removes the close-after-spawn race.
              if (inFD > STDERR_FILENO) close(inFD);
              if (outFD > STDERR_FILENO) close(outFD);
              char prog[] = "stockfish";
              char* argv[] = { prog, nullptr };
              chesshelper_engine_main(1, argv);
          }
          CPPEOF
          echo "Stockfish engine ready: $(find Sources/Engine -name '*.cpp' | wc -l) cpp files"

