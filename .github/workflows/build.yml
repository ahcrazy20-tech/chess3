name: Build ChessHelper v6.0

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Clean & prepare
        run: |
          rm -rf Sources Resources ChessHelper.xcodeproj build Payload
          mkdir -p Sources Resources

      - name: Write project.yml
        run: |
          cat > project.yml <<'EOF'
          name: ChessHelper
          options:
            bundleIdPrefix: com.chesshelper
            deploymentTarget: { iOS: "16.0" }
            createIntermediateGroups: true
          settings:
            base:
              MARKETING_VERSION: "6.0.0"
              CURRENT_PROJECT_VERSION: "60"
              SWIFT_VERSION: "5.9"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              TARGETED_DEVICE_FAMILY: "1,2"
          targets:
            ChessHelper:
              type: application
              platform: iOS
              sources: [ { path: Sources }, { path: Resources } ]
              info:
                path: Resources/Info.plist
                properties:
                  CFBundleDisplayName: Chess Helper
                  CFBundleShortVersionString: $(MARKETING_VERSION)
                  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.chesshelper.app
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  PROVISIONING_PROFILE_SPECIFIER: ""
          EOF

      - name: Generate Swift source files (Part 1 - Core)
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, textwrap
          files = {}

          # ========== Base files ==========
          files["Sources/ChessHelperApp.swift"] = r'''
          import SwiftUI
          @main
          struct ChessHelperApp: App {
              var body: some Scene {
                  WindowGroup { ContentView().preferredColorScheme(.dark) }
              }
          }
          '''

          files["Sources/AppRouter.swift"] = r'''
          import SwiftUI
          @MainActor
          final class AppRouter: ObservableObject {
              @Published var selectedTab: Int = 0
              @Published var chessURL: URL = URL(string: "https://www.chess.com/")!
              @Published var navigateTrigger: Int = 0
              func openInPlay(_ s: String) {
                  if let u = URL(string: s) { chessURL = u; navigateTrigger &+= 1; selectedTab = 0 }
              }
          }
          '''

          files["Sources/AppLanguage.swift"] = r'''
          import Foundation
          import SwiftUI
          @MainActor
          final class AppLanguage: ObservableObject {
              enum Lang: String, CaseIterable {
                  case arabic = "ar"
                  case english = "en"
                  var display: String { self == .arabic ? "العربية" : "English" }
                  var voiceCode: String { self == .arabic ? "ar-SA" : "en-US" }
              }
              @Published var current: Lang {
                  didSet { UserDefaults.standard.set(current.rawValue, forKey: "app_language") }
              }
              init() {
                  let saved = UserDefaults.standard.string(forKey: "app_language") ?? "en"
                  self.current = Lang(rawValue: saved) ?? .english
              }
              var isArabic: Bool { current == .arabic }
          }
          '''

          files["Sources/KeychainStore.swift"] = r'''
          import Foundation
          import Security
          enum KeychainStore {
              static let groqKeyAccount = "chess_helper_groq_api_key"
              static let service = "com.chesshelper.app"
              static func save(_ value: String, account: String) -> Bool {
                  let data = value.data(using: .utf8)!
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service, kSecAttrAccount as String: account]
                  SecItemDelete(query as CFDictionary)
                  var newItem = query
                  newItem[kSecValueData as String] = data
                  return SecItemAdd(newItem as CFDictionary, nil) == errSecSuccess
              }
              static func load(account: String) -> String? {
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service, kSecAttrAccount as String: account, kSecReturnData as String: true, kSecMatchLimit as String: kSecMatchLimitOne]
                  var item: CFTypeRef?
                  guard SecItemCopyMatching(query as CFDictionary, &item) == errSecSuccess, let data = item as? Data else { return nil }
                  return String(data: data, encoding: .utf8)
              }
              static func delete(account: String) {
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: service, kSecAttrAccount as String: account]
                  SecItemDelete(query as CFDictionary)
              }
          }
          '''

          files["Sources/StealthConfig.swift"] = r'''
          import Foundation
          enum StealthConfig {
              static let bridgeName: String = randomName(prefix: "_", length: 6)
              static let readerFlag: String = randomName(prefix: "_", length: 8)
              static let startFuncName: String = randomName(prefix: "_", length: 8)
              static let localEngineBridge: String = randomName(prefix: "_sf_", length: 6)
              private static let userAgents = [
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.6 Mobile/15E148 Safari/604.1",
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 17_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.1 Mobile/15E148 Safari/604.1",
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4 Mobile/15E148 Safari/604.1",
              ]
              static func randomUserAgent() -> String { userAgents.randomElement()! }
              static func readerInterval() -> Int { Int.random(in: 500...900) }
              private static func randomName(prefix: String, length: Int) -> String {
                  let chars = "abcdefghijklmnopqrstuvwxyz0123456789"
                  return prefix + String((0..<length).map { _ in chars.randomElement()! })
              }
          }
          '''

          files["Sources/FenValidator.swift"] = r'''
          import Foundation
          enum FenValidator {
              static func validate(_ fen: String) -> String? {
                  let parts = fen.split(separator: " ").map(String.init)
                  guard parts.count >= 4 else { return "not enough FEN fields" }
                  let ranks = parts[0].split(separator: "/").map(String.init)
                  guard ranks.count == 8 else { return "not 8 ranks" }
                  var wK = 0, bK = 0, total = 0
                  for rank in ranks {
                      var count = 0
                      for ch in rank {
                          if let d = ch.wholeNumberValue { count += d }
                          else { count += 1; total += 1; if ch == "K" { wK += 1 }; if ch == "k" { bK += 1 } }
                      }
                      if count != 8 { return "rank has \(count) squares" }
                  }
                  if wK != 1 { return "\(wK) white kings" }
                  if bK != 1 { return "\(bK) black kings" }
                  if total < 4 { return "only \(total) pieces" }
                  if total > 32 { return "\(total) pieces" }
                  return nil
              }
              
              static func countPieces(_ fen: String) -> Int {
                  let parts = fen.split(separator: " ").map(String.init)
                  guard let boardPart = parts.first else { return 0 }
                  var count = 0
                  for ch in boardPart {
                      if ch.isLetter { count += 1 }
                  }
                  return count
              }
          }
          '''

          files["Sources/MoveValidator.swift"] = r'''
          import Foundation
          enum MoveValidator {
              static func parseFen(_ fen: String) -> [[Character]]? {
                  let parts = fen.split(separator: " ").map(String.init)
                  guard let boardPart = parts.first else { return nil }
                  let ranks = boardPart.split(separator: "/").map(String.init)
                  guard ranks.count == 8 else { return nil }
                  var grid: [[Character]] = Array(repeating: Array(repeating: ".", count: 8), count: 8)
                  for (rIdx, rank) in ranks.enumerated() {
                      var col = 0
                      for ch in rank {
                          if let empty = ch.wholeNumberValue {
                              col += empty
                          } else {
                              if col < 8 { grid[rIdx][col] = ch }
                              col += 1
                          }
                      }
                  }
                  return grid
              }
              static func squareToCoord(_ square: String) -> (row: Int, col: Int)? {
                  guard square.count >= 2 else { return nil }
                  let chars = Array(square)
                  let fileChar = chars[0]
                  guard let fileScalar = fileChar.asciiValue, fileScalar >= 97, fileScalar <= 104 else { return nil }
                  let col = Int(fileScalar) - 97
                  guard let rankDigit = chars[1].wholeNumberValue, rankDigit >= 1, rankDigit <= 8 else { return nil }
                  let row = 8 - rankDigit
                  return (row, col)
              }
              static func isPlausibleMove(uci: String, fen: String) -> Bool {
                  guard uci.count >= 4 else { return false }
                  guard let grid = parseFen(fen) else { return false }
                  let parts = fen.split(separator: " ").map(String.init)
                  guard parts.count >= 2 else { return false }
                  let sideToMove = parts[1]
                  let fromStr = String(uci.prefix(2))
                  let toStr = String(uci.dropFirst(2).prefix(2))
                  guard let from = squareToCoord(fromStr) else { return false }
                  guard let to = squareToCoord(toStr) else { return false }
                  let fromPiece = grid[from.row][from.col]
                  guard fromPiece != "." else { return false }
                  let isWhitePiece = fromPiece.isUppercase
                  let isWhiteTurn = sideToMove == "w"
                  if isWhitePiece != isWhiteTurn { return false }
                  let toPiece = grid[to.row][to.col]
                  if toPiece != "." {
                      let toIsWhite = toPiece.isUppercase
                      if toIsWhite == isWhitePiece { return false }
                  }
                  return true
              }
          }
          '''

          files["Sources/FenBuilder.swift"] = r'''
          import Foundation
          @MainActor
          final class FenBuilder {
              private var wKm = false, bKm = false
              private var wRA1m = false, wRH1m = false, bRA8m = false, bRH8m = false
              private var lastEP: String? = nil
              private var hmc: Int = 0
              private var lastGrid: [[Character]]? = nil
              private var lastPly: Int = -1
              func reset() {
                  wKm = false; bKm = false
                  wRA1m = false; wRH1m = false; bRA8m = false; bRH8m = false
                  lastEP = nil; hmc = 0; lastGrid = nil; lastPly = -1
              }
              func build(grid: [[Character]], sideToMove: String, plyCount: Int) -> String {
                  if isSP(grid) { reset(); lastGrid = grid; lastPly = plyCount }
                  else {
                      if let old = lastGrid, plyCount >= lastPly && plyCount <= lastPly + 2 {
                          detect(old: old, new: grid)
                      }
                      lastGrid = grid; lastPly = plyCount
                  }
                  let b = boardFen(grid); let c = castling(grid)
                  let ep = lastEP ?? "-"; let fm = max(1, (plyCount / 2) + 1)
                  return "\(b) \(sideToMove) \(c) \(ep) \(hmc) \(fm)"
              }
              private func detect(old: [[Character]], new: [[Character]]) {
                  var ch: [(r: Int, c: Int, b: Character, a: Character)] = []
                  for r in 0..<8 { for c in 0..<8 {
                      if old[r][c] != new[r][c] { ch.append((r, c, old[r][c], new[r][c])) }
                  }}
                  guard !ch.isEmpty else { return }
                  for x in ch {
                      if x.b == "K" && x.a == "." && x.r == 7 && x.c == 4 { wKm = true }
                      if x.b == "k" && x.a == "." && x.r == 0 && x.c == 4 { bKm = true }
                      if x.b == "R" && x.a == "." {
                          if x.r == 7 && x.c == 0 { wRA1m = true }
                          if x.r == 7 && x.c == 7 { wRH1m = true }
                      }
                      if x.b == "r" && x.a == "." {
                          if x.r == 0 && x.c == 0 { bRA8m = true }
                          if x.r == 0 && x.c == 7 { bRH8m = true }
                      }
                      if x.a != "." && x.b != x.a {
                          if x.r == 7 && x.c == 0 { wRA1m = true }
                          if x.r == 7 && x.c == 7 { wRH1m = true }
                          if x.r == 0 && x.c == 0 { bRA8m = true }
                          if x.r == 0 && x.c == 7 { bRH8m = true }
                      }
                  }
                  lastEP = nil
                  let from = ch.first { $0.b != "." && $0.a == "." }
                  let to = ch.first { $0.a != "." && $0.a != $0.b }
                  if let f = from, let t = to {
                      let p = t.a
                      if (p == "P" || p == "p") && abs(f.r - t.r) == 2 && f.c == t.c {
                          let epR = (f.r + t.r) / 2
                          lastEP = "\(Character(UnicodeScalar(97 + t.c)!))\(8 - epR)"
                      }
                      let isPawn = p == "P" || p == "p"
                      let isCap = ch.contains { $0.b != "." && $0.a != "." && $0.b != $0.a }
                      hmc = (isPawn || isCap) ? 0 : (hmc + 1)
                  }
              }
              private func isSP(_ g: [[Character]]) -> Bool {
                  guard g.count == 8 else { return false }
                  return String(g[0]) == "rnbqkbnr" && String(g[1]) == "pppppppp"
                      && String(g[6]) == "PPPPPPPP" && String(g[7]) == "RNBQKBNR"
              }
              private func boardFen(_ g: [[Character]]) -> String {
                  var rows: [String] = []
                  for r in 0..<8 {
                      var row = ""; var e = 0
                      for c in 0..<8 {
                          let ch = g[r][c]
                          if ch == "." { e += 1 }
                          else { if e > 0 { row += "\(e)"; e = 0 }; row.append(ch) }
                      }
                      if e > 0 { row += "\(e)" }
                      rows.append(row)
                  }
                  return rows.joined(separator: "/")
              }
              private func castling(_ g: [[Character]]) -> String {
                  var s = ""
                  if !wKm && !wRH1m && g[7][4] == "K" && g[7][7] == "R" { s += "K" }
                  if !wKm && !wRA1m && g[7][4] == "K" && g[7][0] == "R" { s += "Q" }
                  if !bKm && !bRH8m && g[0][4] == "k" && g[0][7] == "r" { s += "k" }
                  if !bKm && !bRA8m && g[0][4] == "k" && g[0][0] == "r" { s += "q" }
                  return s.isEmpty ? "-" : s
              }
          }
          '''

          files["Sources/OverlayPosition.swift"] = r'''
          import SwiftUI
          @MainActor
          final class OverlayPosition: ObservableObject {
              @Published var offset: CGSize = .zero
              @Published var isCompact: Bool = false
              @Published var transparency: Double = 0.85
              private let xK = "ov_x_v60", yK = "ov_y_v60", cK = "ov_c_v60", tK = "ov_t_v60"
              init() {
                  let x = UserDefaults.standard.double(forKey: xK)
                  let y = UserDefaults.standard.double(forKey: yK)
                  offset = CGSize(width: x, height: y)
                  isCompact = UserDefaults.standard.bool(forKey: cK)
                  let t = UserDefaults.standard.double(forKey: tK)
                  transparency = t > 0 ? t : 0.85
              }
              func save() {
                  UserDefaults.standard.set(offset.width, forKey: xK)
                  UserDefaults.standard.set(offset.height, forKey: yK)
                  UserDefaults.standard.set(isCompact, forKey: cK)
                  UserDefaults.standard.set(transparency, forKey: tK)
              }
              func reset() { offset = .zero; isCompact = false; transparency = 0.85; save() }
          }
          @MainActor
          final class AIOverlayPosition: ObservableObject {
              @Published var offset: CGSize = CGSize(width: 0, height: -220)
              @Published var isVisible: Bool = false
              @Published var isChatMode: Bool = false
              private let xK = "ai_x_v60", yK = "ai_y_v60"
              init() {
                  let x = UserDefaults.standard.double(forKey: xK)
                  let y = UserDefaults.standard.double(forKey: yK)
                  if x != 0 || y != 0 { offset = CGSize(width: x, height: y) }
              }
              func save() {
                  UserDefaults.standard.set(offset.width, forKey: xK)
                  UserDefaults.standard.set(offset.height, forKey: yK)
              }
              func reset() { offset = CGSize(width: 0, height: -220); save() }
          }
          '''

          files["Sources/AnalysisCache.swift"] = r'''
          import Foundation
          actor AnalysisCache {
              static let shared = AnalysisCache()
              private struct Entry { let moves: [TopMove]; let depth: Int; let sources: String; let confidence: Int }
              private var cache: [String: Entry] = [:]
              private var order: [String] = []
              func get(fen: String) -> (moves: [TopMove], depth: Int, sources: String, confidence: Int)? {
                  guard let e = cache[fen] else { return nil }
                  order.removeAll { $0 == fen }; order.append(fen)
                  return (e.moves, e.depth, e.sources, e.confidence)
              }
              func set(fen: String, moves: [TopMove], depth: Int, sources: String, confidence: Int) {
                  cache[fen] = Entry(moves: moves, depth: depth, sources: sources, confidence: confidence)
                  order.removeAll { $0 == fen }; order.append(fen)
                  while order.count > 500 { let o = order.removeFirst(); cache.removeValue(forKey: o) }
              }
              func clear() { cache.removeAll(); order.removeAll() }
              func count() -> Int { cache.count }
          }
          '''

          files["Sources/HapticManager.swift"] = r'''
          import UIKit
          enum HapticManager {
              static func moveReady() {
                  let g = UIImpactFeedbackGenerator(style: .light)
                  g.prepare()
                  g.impactOccurred(intensity: 0.5)
              }
              static func blunderWarning() {
                  let g = UINotificationFeedbackGenerator()
                  g.prepare()
                  g.notificationOccurred(.warning)
              }
              static func success() {
                  let g = UINotificationFeedbackGenerator()
                  g.prepare()
                  g.notificationOccurred(.success)
              }
              static func selection() {
                  let g = UISelectionFeedbackGenerator()
                  g.prepare()
                  g.selectionChanged()
              }
              static func tacticalOpportunity() {
                  let g = UINotificationFeedbackGenerator()
                  g.prepare()
                  g.notificationOccurred(.success)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.15) {
                      let g2 = UIImpactFeedbackGenerator(style: .heavy)
                      g2.impactOccurred()
                  }
              }
          }
          '''

          files["Sources/VoiceManager.swift"] = r'''
          import Foundation
          import AVFoundation
          @MainActor
          final class VoiceManager: ObservableObject {
              static let shared = VoiceManager()
              private let synth = AVSpeechSynthesizer()
              @Published var isEnabled: Bool = false
              private init() {
                  configureAudio()
              }
              private func configureAudio() {
                  do {
                      try AVAudioSession.sharedInstance().setCategory(.playback, mode: .voicePrompt, options: [.mixWithOthers, .duckOthers])
                      try AVAudioSession.sharedInstance().setActive(true)
                  } catch {
                      print("Audio session error: \(error)")
                  }
              }
              func speakMove(uci: String, san: String, isArabic: Bool) {
                  let text: String
                  if isArabic {
                      text = describeInArabic(uci: uci, san: san)
                  } else {
                      text = describeInEnglish(uci: uci, san: san)
                  }
                  speak(text: text, isArabic: isArabic)
              }
              func speak(text: String, isArabic: Bool) {
                  synth.stopSpeaking(at: .immediate)
                  let utterance = AVSpeechUtterance(string: text)
                  utterance.voice = AVSpeechSynthesisVoice(language: isArabic ? "ar-SA" : "en-US")
                  utterance.rate = 0.5
                  utterance.pitchMultiplier = 1.0
                  utterance.volume = 1.0
                  synth.speak(utterance)
              }
              func stop() {
                  synth.stopSpeaking(at: .immediate)
              }
              private func describeInArabic(uci: String, san: String) -> String {
                  let piece = detectPiece(san: san, isArabic: true)
                  let toSquare = extractSquare(uci: uci)
                  let squareArabic = arabicSquare(toSquare)
                  return "\(piece) إلى \(squareArabic)"
              }
              private func describeInEnglish(uci: String, san: String) -> String {
                  let piece = detectPiece(san: san, isArabic: false)
                  let toSquare = extractSquare(uci: uci)
                  return "\(piece) to \(toSquare)"
              }
              private func detectPiece(san: String, isArabic: Bool) -> String {
                  let first = san.first ?? "P"
                  switch first {
                  case "K": return isArabic ? "الملك" : "King"
                  case "Q": return isArabic ? "الوزير" : "Queen"
                  case "R": return isArabic ? "القلعة" : "Rook"
                  case "B": return isArabic ? "الفيل" : "Bishop"
                  case "N": return isArabic ? "الحصان" : "Knight"
                  case "O":
                      if san.hasPrefix("O-O-O") { return isArabic ? "تبييت طويل" : "Long castle" }
                      return isArabic ? "تبييت قصير" : "Short castle"
                  default:
                      return isArabic ? "الجندي" : "Pawn"
                  }
              }
              private func extractSquare(uci: String) -> String {
                  guard uci.count >= 4 else { return uci }
                  return String(uci.dropFirst(2).prefix(2))
              }
              private func arabicSquare(_ sq: String) -> String {
                  guard let file = sq.first, let rank = sq.last else { return sq }
                  let fileAr: String
                  switch file {
                  case "a": fileAr = "أ"
                  case "b": fileAr = "ب"
                  case "c": fileAr = "ج"
                  case "d": fileAr = "د"
                  case "e": fileAr = "هـ"
                  case "f": fileAr = "و"
                  case "g": fileAr = "ز"
                  case "h": fileAr = "ح"
                  default: fileAr = String(file)
                  }
                  return "\(fileAr)\(rank)"
              }
          }
          '''

          for path, content in files.items():
              content = textwrap.dedent(content).strip() + "\n"
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f: f.write(content)
              print(f"  ✅ {path}")
          print(f"\nWrote {len(files)} Swift files (Part 1 - Core)")
          PYEOF

      - name: Generate Swift source files (Part 2 - Opening Book & Tablebase)
        shell: bash
        run: |
          python3 <<'PYEOF'
          import os, textwrap
          files = {}

          # ========== Opening Book Service ==========
          files["Sources/OpeningBook.swift"] = r'''
          import Foundation

          struct OpeningInfo: Codable {
              let name: String
              let eco: String
              let moves: [String]
              let winRate: Double?
          }

          actor OpeningBook {
              static let shared = OpeningBook()
              
              private var book: [String: OpeningInfo] = [:]
              private var loaded = false
              
              func load() {
                  guard !loaded else { return }
                  loaded = true
                  
                  // Built-in opening database
                  let openings: [(fen: String, name: String, eco: String, moves: [String], winRate: Double)] = [
                      // Starting position
                      ("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -", "Starting Position", "A00", ["e4", "d4", "Nf3", "c4"], 0.50),
                      
                      // King's Pawn
                      ("rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq -", "King's Pawn Opening", "B00", ["e5", "c5", "e6", "c6", "d5"], 0.52),
                      
                      // Sicilian Defense
                      ("rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq -", "Sicilian Defense", "B20", ["Nf3", "Nc3", "c3", "f4"], 0.54),
                      ("rnbqkbnr/pp1ppppp/8/2p5/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq -", "Sicilian Defense: Open", "B30", ["d6", "Nc6", "e6", "g6"], 0.53),
                      ("rnbqkbnr/pp2pppp/3p4/2p5/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq -", "Sicilian Defense: Old Sicilian", "B32", ["d4", "Bb5+", "c3"], 0.54),
