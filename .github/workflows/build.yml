          import Foundation
          actor AnalysisCache {
              static let shared = AnalysisCache()
              private struct Entry { let moves: [TopMove]; let depth: Int; let sources: String; let confidence: Int }
              private var cache: [String: Entry] = [:]
              private var order: [String] = []
              func get(fen: String) -> (moves: [TopMove], depth: Int, sources: String, confidence: Int)? {
                  guard let e = cache[fen] else { return nil }
                  order.removeAll { $0 == fen }; order.append(fen)
                  return (e.moves, e.depth, e.sources, e.confidence)
              }
              func set(fen: String, moves: [TopMove], depth: Int, sources: String, confidence: Int) {
                  cache[fen] = Entry(moves: moves, depth: depth, sources: sources, confidence: confidence)
                  order.removeAll { $0 == fen }; order.append(fen)
                  while order.count > 200 { let o = order.removeFirst(); cache.removeValue(forKey: o) }
              }
              func clear() { cache.removeAll(); order.removeAll() }
              func count() -> Int { cache.count }
          }
