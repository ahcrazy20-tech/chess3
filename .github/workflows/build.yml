name: Build ChessHelper v2 (Stealth + Embedded Stockfish)

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean any stale source folders
        run: |
          rm -rf Sources Resources ChessHelper.xcodeproj build Payload
          rm -f  chess-helper.manifest.json
          mkdir -p Sources Resources

      # ============================================================
      #  Write project.yml
      # ============================================================
      - name: Write project.yml
        run: |
          cat > project.yml <<'PROJECT_EOF'
          name: ChessHelper
          options:
            bundleIdPrefix: com.chesshelper
            deploymentTarget:
              iOS: "16.0"
            createIntermediateGroups: true

          packages:
            ChessKitEngine:
              url: https://github.com/chesskit-app/chesskit-engine
             exactVersion: "0.6.0"

          settings:
            base:
              MARKETING_VERSION: "2.0.0"
              CURRENT_PROJECT_VERSION: "20"
              SWIFT_VERSION: "5.9"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              TARGETED_DEVICE_FAMILY: "1,2"

          targets:
            ChessHelper:
              type: application
              platform: iOS
              sources:
                - path: Sources
                - path: Resources
              dependencies:
                - package: ChessKitEngine
              info:
                path: Resources/Info.plist
                properties:
                  CFBundleDisplayName: Chess Helper
                  CFBundleShortVersionString: $(MARKETING_VERSION)
                  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.chesshelper.app
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: ""
                  PROVISIONING_PROFILE_SPECIFIER: ""
          PROJECT_EOF

      # ============================================================
      #  Sources/ChessHelperApp.swift
      # ============================================================
      - name: Write ChessHelperApp.swift
        run: |
          cat > Sources/ChessHelperApp.swift <<'SWIFT_EOF'
          import SwiftUI

          @main
          struct ChessHelperApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          SWIFT_EOF

      # ============================================================
      #  Sources/AppRouter.swift
      # ============================================================
      - name: Write AppRouter.swift
        run: |
          cat > Sources/AppRouter.swift <<'SWIFT_EOF'
          import SwiftUI

          @MainActor
          final class AppRouter: ObservableObject {
              @Published var selectedTab: Int = 0
              @Published var chessURL: URL = URL(string: "https://www.chess.com/")!
              @Published var navigateTrigger: Int = 0

              func openInPlay(_ urlString: String) {
                  if let url = URL(string: urlString) {
                      chessURL = url
                      navigateTrigger &+= 1
                      selectedTab = 0
                  }
              }
          }
          SWIFT_EOF

      # ============================================================
      #  Sources/ContentView.swift
      # ============================================================
      - name: Write ContentView.swift
        run: |
          cat > Sources/ContentView.swift <<'SWIFT_EOF'
          import SwiftUI

          struct ContentView: View {
              @StateObject private var engine  = EngineViewModel()
              @StateObject private var stealth = StealthManager()
              @StateObject private var router  = AppRouter()

              var body: some View {
                  TabView(selection: $router.selectedTab) {
                      PlayView(engine: engine, stealth: stealth, router: router)
                          .tabItem { Label("Play", systemImage: "gamecontroller.fill") }
                          .tag(0)
                      ReviewView(router: router)
                          .tabItem { Label("Review", systemImage: "magnifyingglass") }
                          .tag(1)
                      OpeningsView(router: router)
                          .tabItem { Label("Openings", systemImage: "book.fill") }
                          .tag(2)
                      PuzzlesView(router: router)
                          .tabItem { Label("Puzzles", systemImage: "puzzlepiece.fill") }
                          .tag(3)
                      StatsView(router: router)
                          .tabItem { Label("Stats", systemImage: "chart.bar.fill") }
                          .tag(4)
                      SettingsView(stealth: stealth)
                          .tabItem { Label("Settings", systemImage: "gearshape.fill") }
                          .tag(5)
                  }
                  .tint(.green)
                  .task { await StockfishEngine.shared.start() }
              }
          }
          SWIFT_EOF

      # ============================================================
      #  Sources/StockfishEngine.swift  (Embedded Stockfish 16)
      # ============================================================
      - name: Write StockfishEngine.swift
        run: |
          cat > Sources/StockfishEngine.swift <<'SWIFT_EOF'
          import Foundation
          import ChessKitEngine

          struct TopMove: Identifiable, Equatable {
              let id = UUID()
              let rank: Int
              let uci: String
              let san: String
              let evaluationCp: Int?
              let mateIn: Int?
              let depth: Int

              var evalString: String {
                  if let m = mateIn, m != 0 { return "M\(abs(m))" }
                  if let cp = evaluationCp { return String(format: "%+.2f", Double(cp) / 100.0) }
                  return "—"
              }
              var winChance: Double {
                  if let m = mateIn, m != 0 { return m > 0 ? 99 : 1 }
                  guard let cp = evaluationCp else { return 50 }
                  return 50 + 50 * tanh(Double(cp) / 400.0)
              }
          }

          struct EngineAnalysis {
              let topMoves: [TopMove]
              let bestMove: TopMove?
              let depth: Int
          }

          @MainActor
          final class StockfishEngine {
              static let shared = StockfishEngine()

              private let engine: Engine
              private var isReady = false

              private init() { self.engine = Engine(type: .stockfish) }

              func start() async {
                  guard !isReady else { return }
                  await withCheckedContinuation { (cont: CheckedContinuation<Void, Never>) in
                      engine.start { [weak self] in
                          self?.isReady = true
                          cont.resume()
                      }
                  }
                  engine.send(command: .setoption(id: "Threads", value: "3"))
                  engine.send(command: .setoption(id: "Hash", value: "64"))
                  engine.send(command: .setoption(id: "MultiPV", value: "3"))
              }

              func analyze(fen: String,
                           multiPV: Int = 3,
                           depth: Int = 20,
                           movetime: Int = 2000) async throws -> EngineAnalysis {
                  if !isReady { await start() }
                  engine.send(command: .setoption(id: "MultiPV", value: "\(multiPV)"))

                  return try await withCheckedThrowingContinuation { (cont: CheckedContinuation<EngineAnalysis, Error>) in
                      var buckets: [Int: (uci: String, cp: Int?, mate: Int?, depth: Int)] = [:]
                      var currentDepth = 0
                      var didResume = false

                      engine.receiveResponse = { response in
                          switch response {
                          case .info(let info):
                              let pv = info.multipv ?? 1
                              currentDepth = max(currentDepth, info.depth ?? 0)
                              if let first = info.pv?.first {
                                  buckets[pv] = (uci: first,
                                                 cp: info.score?.cp,
                                                 mate: info.score?.mate,
                                                 depth: info.depth ?? currentDepth)
                              }
                          case .bestmove:
                              guard !didResume else { return }
                              didResume = true
                              let sorted = buckets.sorted { $0.key < $1.key }
                              let moves: [TopMove] = sorted.enumerated().map { (idx, kv) in
                                  TopMove(rank: idx + 1,
                                          uci: kv.value.uci,
                                          san: kv.value.uci,
                                          evaluationCp: kv.value.cp,
                                          mateIn: kv.value.mate,
                                          depth: kv.value.depth)
                              }
                              cont.resume(returning: EngineAnalysis(
                                  topMoves: moves,
                                  bestMove: moves.first,
                                  depth: currentDepth
                              ))
                          default: break
                          }
                      }

                      engine.send(command: .position(.fen(fen)))
                      engine.send(command: .go(depth: depth, movetime: movetime))
                  }
              }

              func stop() { engine.send(command: .stop) }
          }
          SWIFT_EOF

      # ============================================================
      #  Sources/StealthManager.swift
      # ============================================================
      - name: Write StealthManager.swift
        run: |
          cat > Sources/StealthManager.swift <<'SWIFT_EOF'
          import SwiftUI
          import UIKit
          import Combine

          @MainActor
          final class StealthManager: ObservableObject {
              @Published var overlayVisible: Bool = true
              @Published var minimalMode: Bool = false
              @Published var isBeingRecorded: Bool = false
              @Published var lastHideReason: String = ""

              private var cancellables = Set<AnyCancellable>()

              init() {
                  setupScreenCaptureDetection()
                  setupBackgroundDetection()
                  setupScreenshotDetection()
                  setupPanicListener()
              }

              func toggleOverlay() {
                  overlayVisible.toggle()
                  lastHideReason = overlayVisible ? "" : "panic gesture"
              }
              func hide(reason: String) { overlayVisible = false; lastHideReason = reason }
              func show() { overlayVisible = true; lastHideReason = "" }
              func toggleMinimalMode() { minimalMode.toggle() }

              private func setupScreenCaptureDetection() {
                  NotificationCenter.default.publisher(for: UIScreen.capturedDidChangeNotification)
                      .sink { [weak self] _ in
                          guard let self = self else { return }
                          let captured = UIScreen.main.isCaptured
                          self.isBeingRecorded = captured
                          if captured { self.hide(reason: "screen recording") }
                      }
                      .store(in: &cancellables)
                  isBeingRecorded = UIScreen.main.isCaptured
                  if isBeingRecorded { hide(reason: "screen recording") }
              }

              private func setupBackgroundDetection() {
                  NotificationCenter.default.publisher(for: UIApplication.willResignActiveNotification)
                      .sink { [weak self] _ in self?.hide(reason: "app backgrounded") }
                      .store(in: &cancellables)
              }

              private func setupScreenshotDetection() {
                  NotificationCenter.default.publisher(for: UIApplication.userDidTakeScreenshotNotification)
                      .sink { [weak self] _ in self?.hide(reason: "screenshot taken") }
                      .store(in: &cancellables)
              }

              private func setupPanicListener() {
                  NotificationCenter.default.publisher(for: .stealthPanic)
                      .sink { [weak self] _ in self?.toggleOverlay() }
                      .store(in: &cancellables)
              }
          }

          extension UIWindow {
              open override func motionEnded(_ motion: UIEvent.EventSubtype, with event: UIEvent?) {
                  if motion == .motionShake {
                      NotificationCenter.default.post(name: .stealthPanic, object: nil)
                  }
                  super.motionEnded(motion, with: event)
              }
          }

          extension Notification.Name {
              static let stealthPanic = Notification.Name("StealthPanicGesture")
          }

          struct ThreeFingerCatcher: UIViewRepresentable {
              let action: () -> Void
              func makeUIView(context: Context) -> UIView {
                  let v = UIView()
                  let tap = UITapGestureRecognizer(target: context.coordinator,
                                                   action: #selector(Coordinator.tapped))
                  tap.numberOfTouchesRequired = 3
                  tap.numberOfTapsRequired = 1
                  tap.cancelsTouchesInView = false
                  v.addGestureRecognizer(tap)
                  v.isUserInteractionEnabled = true
                  v.backgroundColor = .clear
                  return v
              }
              func updateUIView(_ v: UIView, context: Context) {}
              func makeCoordinator() -> Coordinator { Coordinator(action: action) }
              final class Coordinator: NSObject {
                  let action: () -> Void
                  init(action: @escaping () -> Void) { self.action = action }
                  @objc func tapped() { action() }
              }
          }

          extension View {
              func onThreeFingerPanic(_ action: @escaping () -> Void) -> some View {
                  overlay(
                      ThreeFingerCatcher(action: action)
                          .allowsHitTesting(true)
                          .frame(maxWidth: .infinity, maxHeight: .infinity)
                          .opacity(0.001)
                  )
              }
          }
          SWIFT_EOF

      # ============================================================
      #  Sources/SettingsView.swift
      # ============================================================
      - name: Write SettingsView.swift
        run: |
          cat > Sources/SettingsView.swift <<'SWIFT_EOF'
          import SwiftUI

          struct SettingsView: View {
              @ObservedObject var stealth: StealthManager
              @AppStorage("engineDepth")    private var engineDepth: Int = 20
              @AppStorage("engineMovetime") private var engineMovetime: Int = 2000
              @AppStorage("multiPV")        private var multiPV: Int = 3

              var body: some View {
                  NavigationStack {
                      Form {
                          Section("Engine — Stockfish 16 (local)") {
                              Stepper(value: $engineDepth, in: 10...25) {
                                  LabeledContent("Search depth", value: "\(engineDepth)")
                              }
                              Stepper(value: $engineMovetime, in: 500...5000, step: 250) {
                                  LabeledContent("Max think time", value: "\(engineMovetime) ms")
                              }
                              Stepper(value: $multiPV, in: 1...5) {
                                  LabeledContent("Candidate moves", value: "\(multiPV)")
                              }
                              Text("Depth 20 ≈ ~3400 Elo. Higher = stronger but slower.")
                                  .font(.caption).foregroundColor(.secondary)
                          }

                          Section("Stealth — Panic gestures") {
                              Label("Shake device to hide overlay", systemImage: "iphone.gen3.radiowaves.left.and.right")
                              Label("3-finger tap to hide overlay", systemImage: "hand.tap.fill")
                              Text("Both gestures are always active.")
                                  .font(.caption).foregroundColor(.secondary)
                          }

                          Section("Stealth — Auto-hide (always on)") {
                              Label("On app background", systemImage: "iphone.slash")
                              Label("On screen recording / mirroring", systemImage: "record.circle")
                              Label("On screenshot", systemImage: "camera.viewfinder")
                              Toggle("Use minimal mode (tiny dot)", isOn: $stealth.minimalMode)
                          }

                          Section("Status") {
                              LabeledContent("Overlay visible", value: stealth.overlayVisible ? "Yes" : "No")
                              LabeledContent("Screen captured",  value: stealth.isBeingRecorded ? "Yes" : "No")
                              if !stealth.lastHideReason.isEmpty {
                                  LabeledContent("Last hide reason", value: stealth.lastHideReason)
                              }
                              Button("Force show overlay") { stealth.show() }
                              Button("Force hide overlay", role: .destructive) { stealth.hide(reason: "manual") }
                          }

                          Section("Privacy") {
                              HStack(spacing: 10) {
                                  Image(systemName: "lock.shield.fill").foregroundColor(.green).font(.title2)
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("Zero external requests").font(.callout.bold())
                                      Text("Analysis runs 100% on-device. Nothing is sent to any server.")
                                          .font(.caption).foregroundColor(.secondary)
                                  }
                              }
                          }

                          Section("About") {
                              LabeledContent("Version", value: "2.0.0 (20)")
                              LabeledContent("Engine",  value: "Stockfish 16")
                              LabeledContent("Build",   value: "TrollStore (unsigned)")
                          }
                      }
                      .navigationTitle("Settings")
                  }
              }
          }
          SWIFT_EOF

      # ============================================================
      #  Sources/LocalOpeningBook.swift
      # ============================================================
      - name: Write LocalOpeningBook.swift
        run: |
          cat > Sources/LocalOpeningBook.swift <<'SWIFT_EOF'
          import Foundation

          enum LocalOpeningBook {
              struct Entry {
                  let eco: String
                  let name: String
                  let moves: [String]
              }

              static let entries: [Entry] = [
                  Entry(eco: "B00", name: "King's Pawn Opening",          moves: ["e4"]),
                  Entry(eco: "C20", name: "King's Pawn Game",             moves: ["e4","e5"]),
                  Entry(eco: "C40", name: "King's Knight Opening",        moves: ["e4","e5","Nf3"]),
                  Entry(eco: "C44", name: "Scotch Game",                  moves: ["e4","e5","Nf3","Nc6","d4"]),
                  Entry(eco: "C50", name: "Italian Game",                 moves: ["e4","e5","Nf3","Nc6","Bc4"]),
                  Entry(eco: "C60", name: "Ruy López",                    moves: ["e4","e5","Nf3","Nc6","Bb5"]),
                  Entry(eco: "C65", name: "Ruy López: Berlin",            moves: ["e4","e5","Nf3","Nc6","Bb5","Nf6"]),
                  Entry(eco: "C78", name: "Ruy López: Morphy",            moves: ["e4","e5","Nf3","Nc6","Bb5","a6","Ba4"]),
                  Entry(eco: "B20", name: "Sicilian Defense",             moves: ["e4","c5"]),
                  Entry(eco: "B27", name: "Sicilian: Open",               moves: ["e4","c5","Nf3"]),
                  Entry(eco: "B30", name: "Sicilian: Rossolimo",          moves: ["e4","c5","Nf3","Nc6","Bb5"]),
                  Entry(eco: "B50", name: "Sicilian: Najdorf setup",      moves: ["e4","c5","Nf3","d6"]),
                  Entry(eco: "B90", name: "Sicilian: Najdorf",            moves: ["e4","c5","Nf3","d6","d4","cxd4","Nxd4","Nf6","Nc3","a6"]),
                  Entry(eco: "B22", name: "Sicilian: Alapin",             moves: ["e4","c5","c3"]),
                  Entry(eco: "C00", name: "French Defense",               moves: ["e4","e6"]),
                  Entry(eco: "C02", name: "French: Advance",              moves: ["e4","e6","d4","d5","e5"]),
                  Entry(eco: "B12", name: "Caro-Kann Defense",            moves: ["e4","c6"]),
                  Entry(eco: "B18", name: "Caro-Kann: Classical",         moves: ["e4","c6","d4","d5","Nc3","dxe4","Nxe4","Bf5"]),
                  Entry(eco: "B07", name: "Pirc Defense",                 moves: ["e4","d6","d4","Nf6","Nc3","g6"]),
                  Entry(eco: "B01", name: "Scandinavian Defense",         moves: ["e4","d5"]),
                  Entry(eco: "B02", name: "Alekhine's Defense",           moves: ["e4","Nf6"]),
                  Entry(eco: "A40", name: "Queen's Pawn Opening",         moves: ["d4"]),
                  Entry(eco: "D02", name: "London System",                moves: ["d4","d5","Nf3","Nf6","Bf4"]),
                  Entry(eco: "D00", name: "Queen's Pawn Game",            moves: ["d4","d5"]),
                  Entry(eco: "D06", name: "Queen's Gambit",               moves: ["d4","d5","c4"]),
                  Entry(eco: "D20", name: "Queen's Gambit Accepted",      moves: ["d4","d5","c4","dxc4"]),
                  Entry(eco: "D30", name: "Queen's Gambit Declined",      moves: ["d4","d5","c4","e6"]),
                  Entry(eco: "D10", name: "Slav Defense",                 moves: ["d4","d5","c4","c6"]),
                  Entry(eco: "A45", name: "Indian Game",                  moves: ["d4","Nf6"]),
                  Entry(eco: "E60", name: "King's Indian Defense",        moves: ["d4","Nf6","c4","g6"]),
                  Entry(eco: "E20", name: "Nimzo-Indian Defense",         moves: ["d4","Nf6","c4","e6","Nc3","Bb4"]),
                  Entry(eco: "E12", name: "Queen's Indian Defense",       moves: ["d4","Nf6","c4","e6","Nf3","b6"]),
                  Entry(eco: "A80", name: "Dutch Defense",                moves: ["d4","f5"]),
                  Entry(eco: "D70", name: "Grünfeld Defense",             moves: ["d4","Nf6","c4","g6","Nc3","d5"]),
                  Entry(eco: "A10", name: "English Opening",              moves: ["c4"]),
                  Entry(eco: "A04", name: "Réti Opening",                 moves: ["Nf3"]),
              ]

              static func match(sanMoves: [String]) -> Entry? {
                  guard !sanMoves.isEmpty else { return nil }
                  var best: Entry?
                  var bestLen = 0
                  for e in entries where e.moves.count <= sanMoves.count {
                      if e.moves.count > bestLen && Array(sanMoves.prefix(e.moves.count)) == e.moves {
                          best = e; bestLen = e.moves.count
                      }
                  }
                  return best
              }
          }
          SWIFT_EOF

      # ============================================================
      #  Sources/ChessAPI.swift  (offline shim)
      # ============================================================
      - name: Write ChessAPI.swift
        run: |
          cat > Sources/ChessAPI.swift <<'SWIFT_EOF'
          import Foundation

          struct OpeningMove: Identifiable {
              let id = UUID()
              let san: String
              let white: Int
              let draws: Int
              let black: Int
              var totalGames: Int { white + draws + black }
              var winRate: Double {
                  totalGames == 0 ? 0 : Double(white) / Double(totalGames) * 100
              }
          }

          enum ChessAPI {
              struct EngineResultCompat {
                  let move: String
                  let san: String
                  let ponder: String
                  let evalString: String
                  let winChance: Double
                  let depth: Int
                  let pvText: String
              }

              static func bestMove(fen: String, depth: Int = 20) async throws -> EngineResultCompat {
                  let a = try await StockfishEngine.shared.analyze(
                      fen: fen, multiPV: 1, depth: depth, movetime: 2000
                  )
                  guard let best = a.bestMove else {
                      throw NSError(domain: "ChessAPI", code: -1,
                                    userInfo: [NSLocalizedDescriptionKey: "Engine returned no move"])
                  }
                  return EngineResultCompat(
                      move: best.uci, san: best.san, ponder: "",
                      evalString: best.evalString, winChance: best.winChance,
                      depth: a.depth, pvText: ""
                  )
              }

              struct OpeningInfoCompat {
                  let name: String
                  let eco: String
                  let topMoves: [OpeningMove]
              }

              static func opening(sanMoves: [String]) -> OpeningInfoCompat? {
                  guard let e = LocalOpeningBook.match(sanMoves: sanMoves) else { return nil }
                  return OpeningInfoCompat(name: e.name, eco: e.eco, topMoves: [])
              }

              static func opening(fen: String) async -> OpeningInfoCompat? { nil }
          }
          SWIFT_EOF      # ============================================================
      #  Sources/EngineViewModel.swift
      # ============================================================
      - name: Write EngineViewModel.swift
        run: |
          cat > Sources/EngineViewModel.swift <<'SWIFT_EOF'
          import Foundation
          import SwiftUI

          enum MoveQuality: String {
              case brilliant  = "!! Brilliant"
              case best       = "!  Best"
              case good       = "   Good"
              case inaccuracy = "?! Inaccuracy"
              case mistake    = "?  Mistake"
              case blunder    = "?? Blunder"
              case none       = ""

              var color: Color {
                  switch self {
                  case .brilliant:  return .cyan
                  case .best:       return .green
                  case .good:       return .green.opacity(0.7)
                  case .inaccuracy: return .yellow
                  case .mistake:    return .orange
                  case .blunder:    return .red
                  case .none:       return .clear
                  }
              }
          }

          enum DetectionConfidence: String { case high, medium, low, unknown }

          @MainActor
          final class EngineViewModel: ObservableObject {
              @Published var currentFEN: String = ""
              @Published var topMoves: [TopMove] = []
              @Published var evaluation: String = "—"
              @Published var winChance: Double = 50
              @Published var depth: Int = 0
              @Published var isThinking: Bool = false
              @Published var errorMessage: String = ""

              @Published var detectedPlayerColor: String = "w"
              @Published var manualPlayerColor: String? = nil
              @Published var sideToMove: String = "w"
              @Published var lastMoveUCI: String = ""
              @Published var plyCount: Int = -1
              @Published var confidence: DetectionConfidence = .unknown
              @Published var sanHistory: [String] = []

              @Published var lastMoveQuality: MoveQuality = .none
              @Published var lastMoveCentipawnLoss: Int = 0
              @Published var lastMoveWasMine: Bool = false

              @Published var openingName: String = ""
              @Published var openingECO: String = ""
              @Published var enabled: Bool = true

              var bestMove: TopMove? { topMoves.first }

              private var previousEvalWhitePOV: Double? = nil
              private var lastAnalyzedFEN: String = ""
              private var analysisTask: Task<Void, Never>?
              private var debounceTask: Task<Void, Never>?

              var effectivePlayerColor: String { manualPlayerColor ?? detectedPlayerColor }
              var isMyTurn: Bool { effectivePlayerColor == sideToMove }

              func setManualColor(_ color: String?) {
                  manualPlayerColor = color
                  if !currentFEN.isEmpty { queueAnalyze(fen: currentFEN, immediate: true) }
              }
              func flipColor() {
                  setManualColor(effectivePlayerColor == "w" ? "b" : "w")
              }

              struct BoardPayload {
                  let grid: String
                  let sideToMove: String
                  let flipped: Bool
                  let flippedConfident: Bool
                  let lastMoveUCI: String
                  let plyCount: Int
                  let detectionConfidence: String
              }

              func ingest(_ payload: BoardPayload) {
                  guard enabled else { return }
                  sideToMove = payload.sideToMove
                  lastMoveUCI = payload.lastMoveUCI
                  plyCount = payload.plyCount
                  confidence = DetectionConfidence(rawValue: payload.detectionConfidence) ?? .unknown
                  if payload.flippedConfident {
                      detectedPlayerColor = payload.flipped ? "b" : "w"
                  }
                  let fenBoard = buildFENBoard(from: payload.grid)
                  let castling = deriveCastlingRights(from: payload.grid)
                  let fullmove = max(1, (payload.plyCount / 2) + 1)
                  let fen = "\(fenBoard) \(payload.sideToMove) \(castling) - 0 \(fullmove)"
                  if fen != currentFEN {
                      currentFEN = fen
                      queueAnalyze(fen: fen)
                  }
              }

              private func queueAnalyze(fen: String, immediate: Bool = false) {
                  debounceTask?.cancel()
                  debounceTask = Task { [weak self] in
                      if !immediate {
                          try? await Task.sleep(nanoseconds: 300_000_000)
                      }
                      if Task.isCancelled { return }
                      await self?.runAnalysis(fen: fen)
                  }
              }

              private func runAnalysis(fen: String) async {
                  guard fen != lastAnalyzedFEN else { return }
                  lastAnalyzedFEN = fen
                  analysisTask?.cancel()
                  isThinking = true
                  errorMessage = ""

                  let ud = UserDefaults.standard
                  let d  = ud.integer(forKey: "engineDepth")    > 0 ? ud.integer(forKey: "engineDepth")    : 20
                  let mt = ud.integer(forKey: "engineMovetime") > 0 ? ud.integer(forKey: "engineMovetime") : 2000
                  let mp = ud.integer(forKey: "multiPV")        > 0 ? ud.integer(forKey: "multiPV")        : 3

                  analysisTask = Task { [weak self] in
                      guard let self = self else { return }
                      do {
                          let a = try await StockfishEngine.shared.analyze(
                              fen: fen, multiPV: mp, depth: d, movetime: mt
                          )
                          if Task.isCancelled { return }
                          await MainActor.run {
                              self.topMoves   = a.topMoves
                              self.evaluation = a.bestMove?.evalString ?? "—"
                              self.winChance  = a.bestMove?.winChance ?? 50
                              self.depth      = a.depth
                              self.isThinking = false
                              let whitePOV = self.evalToWhitePOV(a.bestMove)
                              self.computeMoveQuality(currentEvalWhitePOV: whitePOV)
                              self.previousEvalWhitePOV = whitePOV
                              self.updateOpening()
                          }
                      } catch {
                          if Task.isCancelled { return }
                          await MainActor.run {
                              self.errorMessage = "Engine: \(error.localizedDescription)"
                              self.isThinking = false
                          }
                      }
                  }
              }

              private func evalToWhitePOV(_ move: TopMove?) -> Double {
                  guard let m = move else { return 0 }
                  if let mate = m.mateIn, mate != 0 { return mate > 0 ? 30 : -30 }
                  let cp = Double(m.evaluationCp ?? 0) / 100.0
                  return sideToMove == "w" ? cp : -cp
              }

              private func computeMoveQuality(currentEvalWhitePOV cur: Double) {
                  guard let prev = previousEvalWhitePOV, !lastMoveUCI.isEmpty else {
                      lastMoveQuality = .none; lastMoveCentipawnLoss = 0; return
                  }
                  let sideThatJustMoved: Double = (sideToMove == "w") ? -1 : 1
                  let lossPawns = (prev - cur) * sideThatJustMoved
                  let lossCP = Int((lossPawns * 100).rounded())
                  lastMoveCentipawnLoss = max(0, lossCP)
                  let mover = (sideToMove == "w") ? "b" : "w"
                  lastMoveWasMine = (mover == effectivePlayerColor)
                  switch lossCP {
                  case ..<(-30):    lastMoveQuality = .brilliant
                  case (-30)...15:  lastMoveQuality = .best
                  case 16...49:     lastMoveQuality = .good
                  case 50...99:     lastMoveQuality = .inaccuracy
                  case 100...299:   lastMoveQuality = .mistake
                  default:          lastMoveQuality = .blunder
                  }
              }

              private func updateOpening() {
                  if let info = ChessAPI.opening(sanMoves: sanHistory) {
                      openingName = info.name; openingECO = info.eco
                  } else {
                      openingName = ""; openingECO = ""
                  }
              }

              private func buildFENBoard(from grid64: String) -> String {
                  let chars = Array(grid64)
                  guard chars.count == 64 else { return "8/8/8/8/8/8/8/8" }
                  var rows: [String] = []
                  for r in 0..<8 {
                      var row = ""; var empty = 0
                      for c in 0..<8 {
                          let ch = chars[r * 8 + c]
                          if ch == "." { empty += 1 }
                          else { if empty > 0 { row += "\(empty)"; empty = 0 }; row.append(ch) }
                      }
                      if empty > 0 { row += "\(empty)" }
                      rows.append(row)
                  }
                  return rows.joined(separator: "/")
              }

              private func deriveCastlingRights(from grid64: String) -> String {
                  let chars = Array(grid64)
                  guard chars.count == 64 else { return "-" }
                  func piece(_ f: Int, _ row: Int) -> Character { chars[row * 8 + f] }
                  var s = ""
                  let wkh = piece(4, 7) == "K"
                  if wkh && piece(7, 7) == "R" { s += "K" }
                  if wkh && piece(0, 7) == "R" { s += "Q" }
                  let bkh = piece(4, 0) == "k"
                  if bkh && piece(7, 0) == "r" { s += "k" }
                  if bkh && piece(0, 0) == "r" { s += "q" }
                  return s.isEmpty ? "-" : s
              }
          }
          SWIFT_EOF

